# scripts/demo/relay-verticals.conf
#
# vertical-dir|WAR_ROOM_FILE|STRATEGIST_FILE|EXECUTIVE_FILE|DOMAIN_KEY
# DOMAIN_KEY is the string literal passed to TSM.relay.write(DOMAIN_KEY, ...)
# in the war-room page. check-relays.sh verifies:
#   1. the war-room page actually calls TSM.relay.write(DOMAIN_KEY, ...)
#   2. the strategist and executive-portal pages both reference DOMAIN_KEY
#      somewhere (relay read, dashboard filter, etc.)
# A mismatch here is exactly the "mismatched domain keys" class of bug
# documented in ARCHITECTURE-NOTES.md.

approval|approval-war-room.html|approval-strategist.html|approval-executive-portal.html|APPROVAL
bpo-war|bpo-war-room.html|bpo-strategist.html|bpo-executive-portal.html|BPO
catalog|catalog-war-room.html|catalog-strategist.html|catalog-executive-portal.html|CATALOG
cpq|cpq-war-room.html|cpq-strategist.html|cpq-executive-portal.html|CPQ
crm|crm-war-room.html|crm-strategist.html|crm-executive-portal.html|CRM
governance|governance-war-room.html|governance-strategist.html|governance-executive-portal.html|GOVERNANCE
mdm|mdm-war-room.html|mdm-strategist.html|mdm-executive-portal.html|MDM
o2c|o2c-war-room.html|o2c-strategist.html|o2c-executive-portal.html|O2C
digital-twin|digital-twin.html|digital-twin-strategist.html|digital-twin-executive-portal.html|DIGITAL_TWIN
integration-hub|integration-hub.html|integration-hub-strategist.html|integration-hub-executive-portal.html|INTEGRATION
schools-command|schools-command.html|schools-strategist.html|schools-executive-portal.html|SCHOOLS

# College (college-command) is intentionally NOT registered here. Its 5
# war rooms (COLLEGE_FINAID/BURSAR/ENDOWMENT/RESEARCH_FA/ACCRED) each pass
# the war-room and strategist checks individually, but college-executive-
# portal.html doesn't reference any per-domain key directly by design — it
# reads a single aggregated 'TSM_COLLEGE_EXEC_RELAY' key that the
# strategist itself writes after merging all 5 domains. Registering the 5
# lines here would produce 5 permanent false FAILs on the exec-portal leg
# (same false-fail class this file's header warns about), not a real bug.
# College's page-existence is still verified via demo-pages.conf.