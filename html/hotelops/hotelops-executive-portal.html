<script>
function tick(){document.getElementById('clock').textContent=new Date().toLocaleTimeString();}
setInterval(tick,1000);tick();

const DOMAIN = 'HOTELOPS';
const RELAY_KEY_FALLBACK = 'TSM_' + DOMAIN + '_RELAY';

function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  clearTimeout(showToast._h);
  showToast._h=setTimeout(()=>t.classList.remove('show'),2500);
}

// Was 'no downstream write in this demo build' -- now a real, persisted
// audit entry via TSMAuditEngine -> POST /api/governance/audit. No
// logged-in-user identity on this page (no session/auth wired here), so
// actor is the page identity itself, same convention used elsewhere for
// unauthenticated pages -- not a fabricated person.
function recordExecutiveAction(action, note){
  if(window.TSMAuditEngine){
    TSMAuditEngine.record({
      actor: 'hotelops-executive-portal',
      action: action,
      resource: DOMAIN,
      vertical: 'hotelops'
    });
  }
  showToast(note);

  // Also record to the real server-side HITL decision log (server.js:
  // /api/exec-portal/hotelops/decide), same pattern as Mortgage/PM Copilot.
  // Verdict mapping: ACKNOWLEDGED = executive signs off ('approved');
  // ESCALATED = executive pushes it up the chain ('rejected') -- a deliberate
  // two-button-to-gate-vocabulary mapping, not a literal rejection claim.
  const verdict = action === 'ACKNOWLEDGED' ? 'approved' : 'rejected';
  fetch('/api/exec-portal/hotelops/decide', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ index: Date.now(), verdict, text: note, actor: 'Executive', tenantId: (typeof TSMActiveMember !== 'undefined' && TSMActiveMember) ? TSMActiveMember.getId() : null })
  }).catch(() => { /* offline/unreachable -- action still logged to audit trail above */ });
}

// Roadmap #9 (Delivery Package) translator. Unlike Honeywell/PM Copilot,
// this vertical needs no invented severity rule at all: hotelops-engine.js's
// getExplainItems() already produces real per-record severity for every
// category (maintenance ticket severity, compliance due-date thresholds,
// IoT alert evaluation, front-desk SLA minutes, etc.), ranked by its own
// SEV_ORDER (urgent < high < medium < low). This just translates that
// existing shape {category, id, severity, explain} into the shared
// Delivery Package contract {claim, severity, rationale, dataPoints,
// sources, id} -- nothing computed here, only relabeled.
//
// Two normalizations, both preserving the original raw value in
// dataPoints so nothing is lost:
//   1. Case: compliance arrives as 'HIGH'/'MED'/'LOW' while every other
//      category is already lowercase ('urgent'/'high'/'medium'/'low') --
//      normalized to lowercase, with 'med' expanded to 'medium'.
//   2. 'urgent' -> 'high' for the Delivery Package's severity field
//      specifically, since the shared TSMDeliveryPackage risk report only
//      recognizes the literal string 'high' and urgent items are strictly
//      more severe -- they must not silently fall out of the risk report
//      for want of an exact string match.
function toDeliveryPackageItems(rawItems){
  if (!Array.isArray(rawItems)) return [];
  return rawItems.map(function (it, idx) {
    var rawSeverity = it.severity;
    var normSeverity = typeof rawSeverity === 'string' ? rawSeverity.toLowerCase() : rawSeverity;
    if (normSeverity === 'med') normSeverity = 'medium';
    var pkgSeverity = normSeverity === 'urgent' ? 'high' : normSeverity;
    return {
      id: 'hotelops-' + (it.category || 'item') + '-' + (it.id != null ? it.id : idx),
      claim: it.explain,
      severity: pkgSeverity,
      rationale: it.explain,
      dataPoints: [
        { key: 'category', value: it.category },
        { key: 'rawSeverity', value: rawSeverity }
      ],
      sources: ['hotelops-engine.js getExplainItems() \u2192 ' + it.category]
    };
  });
}

// Dedupe on the full raw string, not the claimed hash — see hotelops
// strategist page for the reasoning (keying off the hash alone would let
// unsigned tampering slip past after the first legitimate check).
const HOTELOPS_VERIFIED_CONTENT = new Set();
function verifyRelayIntegrity(data, raw){
  if (!data || !data._integrity || !data._integrity.hash || !raw) return;
  if (!window.TSMIntegrity || typeof window.TSMIntegrity.verify !== 'function') return;
  if (HOTELOPS_VERIFIED_CONTENT.has(raw)) return;
  HOTELOPS_VERIFIED_CONTENT.add(raw);
  window.TSMIntegrity.verify(data).then(result => {
    if (!result.ok && result.reason === 'mismatch') {
      console.warn('[hotelops-executive-portal] relay integrity mismatch:', result);
      if (typeof showToast === 'function') {
        showToast('Warning: relay data failed integrity check — may be stale or tampered.');
      }
    }
  }).catch(() => {});
}

function loadRelay(){
  let data = null;
  let raw = null;
  try {
    if(window.TSM && window.TSM.relay && window.TSM.relay.read){
      const d = window.TSM.relay.read(DOMAIN);
      if(d) { data = d; raw = JSON.stringify(d); }
    }
  } catch(e){}
  if (data === null) {
    try {
      raw = sessionStorage.getItem(RELAY_KEY_FALLBACK) || localStorage.getItem(RELAY_KEY_FALLBACK) || localStorage.getItem('TSM_HOTELOPS_STRATEGIST_RELAY');
      data = raw ? JSON.parse(raw) : null;
    } catch(e){ data = null; }
  }
  verifyRelayIntegrity(data, raw);
  return data;
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function money(n, currency){
  const sym = (currency === 'USD' || !currency) ? '$' : (currency + ' ');
  return sym + Math.round(n||0).toLocaleString();
}

function renderLiveMissionsRegister(){
  if(!window.TSMMissionStore) return '';
  const missions = window.TSMMissionStore.listMissions({ vertical: 'hotelops' });
  if(!missions.length) return '';
  const open = missions.filter(m => m.stage !== 'closed' && m.stage !== 'delivered');
  if(!open.length) return '';
  const rows = open.map((m, idx) => `
    <div class="risk-item">
      <div class="risk-rank">${idx+1}</div>
      <div class="risk-body">
        <div class="risk-title">${escapeHtml(m.client || m.missionNo || m.id)} &mdash; stage: ${escapeHtml(m.stage)}</div>
        <div class="risk-action">${m.workflow && m.workflow.priority ? 'Priority: ' + escapeHtml(m.workflow.priority) : 'No priority set'}</div>
      </div>
    </div>`).join('');
  return `<div class="sec">
    <div class="sec-hdr"><span class="lbl">LIVE MISSIONS</span><span class="sec-hdr-note">from Mission Store, vertical: hotelops</span></div>
    ${rows}
  </div>`;
}

function renderEmpty(){

// Same generic markdown/table renderer used by Mortgage's exec portal --
// no vertical-specific logic in here, safe to reuse verbatim.
function renderEngineOutput(text) {
  if(!text) return '';
  const clean = text.replace(/KPI_JSON:\s*\{[^}]*\}\n*/i, '').trim();
  const lines = clean.split('\n');
  const isTableSep = l => /^\s*\|?[\s:|-]+\|?\s*$/.test(l) && l.includes('-');
  const inlineFmt = s => escapeHtml(s).replace(/&lt;br\s*\/?&gt;/gi, '<br>').replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  const tables = [];
  const outLines = [];
  let i = 0;
  while (i < lines.length) {
    const line = lines[i];
    if (/^\s*\|.*\|\s*$/.test(line) && lines[i + 1] !== undefined && isTableSep(lines[i + 1])) {
      const headers = line.trim().replace(/^\||\|$/g, '').split('|').map(c => c.trim());
      let t = '<table class="md-table"><thead><tr>' + headers.map(c => `<th>${inlineFmt(c)}</th>`).join('') + '</tr></thead><tbody>';
      i += 2;
      while (i < lines.length && /^\s*\|.*\|\s*$/.test(lines[i])) {
        const cells = lines[i].trim().replace(/^\||\|$/g, '').split('|').map(c => c.trim());
        t += '<tr>' + cells.map(c => `<td>${inlineFmt(c)}</td>`).join('') + '</tr>';
        i++;
      }
      t += '</tbody></table>';
      outLines.push(`@@TABLE${tables.length}@@`);
      tables.push(t);
      continue;
    }
    outLines.push(line);
    i++;
  }
  let html = escapeHtml(outLines.join('\n'));
  html = html.replace(/&lt;br\s*\/?&gt;/gi, '<br>');
  html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  html = html.replace(/^▸\s*(.+)$/gm, '<div style="margin:4px 0">▸ $1</div>');
  html = html.replace(/^(\d+)\.\s+(.+)$/gm, '<div style="margin:4px 0 4px 8px"><strong>$1.</strong> $2</div>');
  html = html.replace(/\n{2,}/g, '<br><br>').replace(/\n/g, '<br>');
  tables.forEach((t, idx) => { html = html.replace(`@@TABLE${idx}@@`, t); });
  return html;
}

/* ---------- Owner / Asset Manager framing helpers ---------- */

function execActionMaint(b){
  if(b.severity === 'urgent') return 'Board-level guest-impact risk \u2014 confirm engineering dispatched, escalate to GM now.';
  if(b.severity === 'high') return 'Escalate to ops director if unresolved by end of day.';
  return 'Monitor \u2014 within normal ops cadence.';
}

function execActionCompliance(c){
  if(c.due_in_days <= 14) return 'Assign an owner today \u2014 licensing/compliance lapse risk within 2 weeks.';
  if(c.due_in_days <= 30) return 'Confirm owner and target completion date this week.';
  return 'On track \u2014 no board escalation needed yet.';
}

function renderFinancials(kpis, fin){
  kpis = kpis || {}; fin = fin || {};
  const total = fin.total_exposure || 0;
  return `<div class="fin-row">
    <div class="fin-card hero">
      <div class="fin-val">${money(kpis.revpar)}</div>
      <div class="fin-lbl">REVPAR</div>
      <div class="fin-sub">ADR ${money(kpis.adr)} &times; ${kpis.occupancy_pct ?? '&mdash;'}% occupancy</div>
    </div>
    <div class="fin-card">
      <div class="fin-val red">${money(total, fin.currency)}</div>
      <div class="fin-lbl">TOTAL EXPOSURE</div>
      <div class="fin-sub">OTA overcharge, this period</div>
    </div>
    <div class="fin-card">
      <div class="fin-val red">${money(fin.ota_overcharge_annualized, fin.currency)}</div>
      <div class="fin-lbl">OTA EXPOSURE (ANNUALIZED)</div>
      <div class="fin-sub">${(fin.ota_items||[]).length} OTA(s) over contracted rate</div>
    </div>
    <div class="fin-card">
      <div class="fin-val ${(kpis.gop_margin_pct||0) >= (kpis.gop_target_pct||0) ? 'green':'red'}">${kpis.gop_margin_pct ?? '&mdash;'}%</div>
      <div class="fin-lbl">GOP MARGIN</div>
      <div class="fin-sub">Target: ${kpis.gop_target_pct ?? '&mdash;'}%</div>
    </div>
    <div class="fin-card">
      <div class="fin-val blue">${money(fin.room_revenue, fin.currency)}</div>
      <div class="fin-lbl">ROOM REVENUE</div>
      <div class="fin-sub">Current period</div>
    </div>
  </div>`;
}

function renderRiskRegister(maintBreaches, complianceRisk){
  const maintTop = (maintBreaches||[]).slice().sort((a,b)=>b.hours_over-a.hours_over).slice(0,2)
    .map(b => ({ title: `Room ${b.room} \u2014 ${b.title}`, meta: `${b.hours_over}h over SLA`, action: execActionMaint(b), severity: b.severity === 'urgent' }));
  const compTop = (complianceRisk||[]).filter(c=>c.severity==='HIGH').slice(0,2)
    .map(c => ({ title: `${c.type} \u2014 ${c.detail}`, meta: `${c.due_in_days}d to deadline`, action: execActionCompliance(c), severity: c.due_in_days <= 14 }));
  const items = [...maintTop, ...compTop];
  if(!items.length){
    return `<div class="sec"><div class="sec-hdr"><span class="lbl">TOP RISK REGISTER</span></div><div class="no-items">No board-level exposure right now &mdash; nothing to escalate.</div></div>`;
  }
  const rows = items.map((it, idx) => `
    <div class="risk-item">
      <div class="risk-rank">${idx+1}</div>
      <div class="risk-body">
        <div class="risk-title">${it.severity ? '<b>' + escapeHtml(it.title) + '</b>' : escapeHtml(it.title)} &mdash; ${escapeHtml(it.meta)}</div>
        <div class="risk-action">${escapeHtml(it.action)}</div>
      </div>
    </div>`).join('');
  return `<div class="sec">
    <div class="sec-hdr"><span class="lbl">TOP RISK REGISTER</span><span class="sec-hdr-note">maintenance + compliance, board-level items</span></div>
    ${rows}
  </div>`;
}

function renderAirbnbRisks(airbnbRisks){
  const items = (airbnbRisks && airbnbRisks.items) || [];
  if(!items.length){
    return `<div class="sec"><div class="sec-hdr"><span class="lbl">AIRBNB / STR RISK REGISTER</span></div><div class="no-items">No flagged listings right now.</div></div>`;
  }
  const rows = items.map((it, idx) => {
    const isHigh = it.severity === 'high';
    const action = isHigh
      ? 'Escalate to property manager today \u2014 guest-impact or double-booking risk.'
      : 'Schedule a fix within 48h \u2014 within normal STR ops cadence.';
    return `
    <div class="risk-item">
      <div class="risk-rank">${idx+1}</div>
      <div class="risk-body">
        <div class="risk-title">${isHigh ? '<b>' + escapeHtml(it.unit_name || it.listing_id) + '</b>' : escapeHtml(it.unit_name || it.listing_id)} &mdash; ${escapeHtml(it.issue)}</div>
        <div class="risk-action">${escapeHtml(action)}</div>
      </div>
    </div>`;
  }).join('');
  return `<div class="sec">
    <div class="sec-hdr"><span class="lbl">AIRBNB / STR RISK REGISTER</span><span class="sec-hdr-note">${airbnbRisks.at_risk} of ${airbnbRisks.total_listings} listings flagged</span></div>
    ${rows}
  </div>`;
}

function renderExplainTop(explainItems){
  const items = (explainItems||[]).slice(0, 4);
  if(!items.length){
    return `<div class="sec"><div class="sec-hdr"><span class="lbl">WHY THESE ITEMS ARE FLAGGED</span></div><div class="no-items">Nothing currently flagged.</div></div>`;
  }
  const catLabel = {
    maintenance: 'Maintenance', ota_overcharge: 'OTA Overcharge', compliance: 'Compliance',
    iot: 'IoT Sensor', reservation: 'Reservation', front_desk: 'Front Desk', vip: 'VIP Readiness',
    housekeeping: 'Housekeeping', staffing: 'Staffing', incident: 'Incident', airbnb: 'Airbnb/STR'
  };
  const rows = items.map((it, idx) => `
    <div class="risk-item">
      <div class="risk-rank">${idx+1}</div>
      <div class="risk-body">
        <div class="risk-title"><b>${escapeHtml(catLabel[it.category] || it.category)}</b>${it.severity ? ' &mdash; ' + escapeHtml(it.severity.toUpperCase()) : ''}</div>
        <div class="risk-action">${escapeHtml(it.explain)}</div>
      </div>
    </div>`).join('');
  return `<div class="sec">
    <div class="sec-hdr"><span class="lbl">WHY THESE ITEMS ARE FLAGGED</span><span class="sec-hdr-note">top ${items.length} of ${(explainItems||[]).length}, by severity</span></div>
    ${rows}
  </div>`;
}

function renderPortfolio(portfolio){
  if(!portfolio || !portfolio.length) return '';
  const cards = portfolio.map(p => `
    <div class="prop-card${p.current ? ' current' : ''}">
      <div class="prop-name">${escapeHtml(p.name)}</div>
      <div class="prop-loc">${escapeHtml(p.city||'')}</div>
      <div class="prop-occ">${p.occupancy_pct}%</div>
      <div class="prop-occ-lbl">OCCUPANCY &middot; ${p.rooms_total} ROOMS</div>
      <div class="prop-metrics"><span>RevPAR <b>${money(p.revpar)}</b></span><span>ADR <b>${money(p.adr)}</b></span></div>
      ${p.current ? '<div class="you-are-here">&#9679; CURRENT PROPERTY</div>' : ''}
    </div>`).join('');
  return `<div class="sec">
    <div class="sec-hdr"><span class="lbl">PORTFOLIO</span><span class="sec-hdr-note">${portfolio.length} propert${portfolio.length===1?'y':'ies'}</span></div>
    <div class="portfolio-grid">${cards}</div>
  </div>`;
}

// ===== EXCEPTION / CASE QUEUE FEED — Roadmap #10 Case Engine =====
// Same pattern as NOC/Mortgage/Schools/PM/Legal/BPO/Healthcare/
// Construction/FinOps/Insurance, adapted for HotelOps' four real risk
// sources (already rendered above by renderRiskRegister/renderAirbnbRisks/
// renderFinancials' OTA card) rather than a single fin.*_exposure_items
// list: maintenance breaches, compliance risk, OTA overcharges, and
// Airbnb/STR flags. No fabricated fields -- everything mirrors
// data.maintenance_breaches / data.compliance_risk / fin.ota_items /
// data.airbnb_risks.items.
const _hotelFedIds = {};
function hotelopsFeedException(fedKey, title, detail, severity, exposure, process){
  if (_hotelFedIds[fedKey]) return false;
  _hotelFedIds[fedKey] = true;

  const exceptionRecord = TSMExceptions.add({
    title, detail,
    recommendedAction: 'See HotelOps Executive Portal risk register.',
    severity, confidence: null, sector: 'hotelops', agentLabel: 'HotelOps Strategist'
  });

  if (typeof TSMCaseManager !== 'undefined' && exceptionRecord) {
    const newCase = TSMCaseManager.createFromException(exceptionRecord, {
      process, source: 'HotelOps Strategist', exposure
    });
    if (newCase) {
      TSMCaseManager.requestApproval(newCase.caseId, { note: 'Auto-requested on case creation from HotelOps exception feed.' });
    }
  }
  return true;
}

function hotelopsFeedExceptions(data){
  if (typeof TSMExceptions === 'undefined' || !data) return;
  const fin = data.financials || {};
  let fedAny = false;

  (data.maintenance_breaches || []).forEach(b => {
    if (!b || !b.room) return;
    const fed = hotelopsFeedException('maint:' + b.room + ':' + (b.title || ''),
      `Room ${b.room} \u2014 ${b.title || 'maintenance breach'} (${b.hours_over}h over SLA)`,
      `Maintenance SLA breach, severity ${b.severity}.`,
      b.severity === 'urgent' ? 'high' : 'med', null, 'hotelops_maintenance_resolution');
    if (fed) fedAny = true;
  });

  (data.compliance_risk || []).forEach(c => {
    if (!c || !c.type) return;
    const fed = hotelopsFeedException('compliance:' + c.type + ':' + (c.detail || ''),
      `${c.type} \u2014 ${c.detail || ''} (${c.due_in_days}d to deadline)`,
      `Compliance deadline risk, severity ${c.severity}.`,
      c.due_in_days <= 14 ? 'high' : 'med', null, 'hotelops_compliance_resolution');
    if (fed) fedAny = true;
  });

  (fin.ota_items || []).forEach(it => {
    if (!it || !it.ota) return;
    const fed = hotelopsFeedException('ota:' + it.ota,
      `OTA Overcharge \u2014 ${it.ota} \u2014 charged ${it.charged_pct}% vs contracted ${it.contracted_pct}%`,
      `OTA commission overcharge of ${money(it.overcharge_amount, fin.currency)} on ${money(it.booking_amount, fin.currency)} in bookings.`,
      'med', it.overcharge_amount, 'hotelops_ota_overcharge_resolution');
    if (fed) fedAny = true;
  });

  ((data.airbnb_risks && data.airbnb_risks.items) || []).forEach(it => {
    const id = it.listing_id || it.unit_name;
    if (!it || !id) return;
    const fed = hotelopsFeedException('airbnb:' + id,
      `Airbnb/STR \u2014 ${it.unit_name || it.listing_id} \u2014 ${it.issue}`,
      `Airbnb/STR listing flagged, severity ${it.severity}.`,
      it.severity === 'high' ? 'high' : 'med', null, 'hotelops_airbnb_str_resolution');
    if (fed) fedAny = true;
  });

  if (!fedAny) return;
  if (typeof TSMExceptionWidget !== 'undefined') {
    TSMExceptionWidget.mount('tsm-exception-queue', { sector: 'hotelops' });
  }
  if (typeof TSMCaseWidget !== 'undefined') {
    TSMCaseWidget.mount('tsm-case-queue', { sector: 'hotelops' });
  }
}

// Roadmap #9 -- stashed here so exportClientPackage() (defined below) can
// reuse the exact same raw explain items render() already read off the
// relay, rather than re-deriving anything. This page has no quality-score
// engine or document counter wired, so qualityScore/documentCount stay
// undefined -- honest nulls in the built package, same convention as
// insurance-executive-portal.html.
let lastExplainItems = [];

// Roadmap #9 -- render() already computes/reads real kpis, financials,
// maintenance/compliance/airbnb risk data, and portfolio, but
// exportClientPackage() only ever forwarded lastExplainItems -- the
// financial and risk data shown on-screen never made it into the client
// package. Hoisted here so exportClientPackage() can pass them through as
// sections, same convention as Mortgage/Healthcare/BPO.
let lastFinancials = null;
let lastRiskData = null;
let lastPortfolio = null;

function render(){
  const data = loadRelay();
  if(!data){ renderEmpty(); return; }

  document.getElementById('hdrSub').textContent = `Relayed ${data.timestamp ? new Date(data.timestamp).toLocaleString() : '&mdash;'}`;

  const kpis = data.kpis || {};
  const fin = data.financials || {};
  lastFinancials = { kpis: kpis, financials: fin };

  let html = '';
  html += renderFinancials(kpis, fin);

  if(data.ai_summary){
    html += `<div class="ai-box"><strong style="color:var(--gold);font-family:'Orbitron',sans-serif;font-size:.65rem;letter-spacing:.1em;display:block;margin-bottom:8px;">EXECUTIVE RECOMMENDATION</strong>${renderEngineOutput(data.ai_summary)}</div>`;
  }

  html += renderRiskRegister(data.maintenance_breaches, data.compliance_risk);
  html += renderAirbnbRisks(data.airbnb_risks);
  lastRiskData = { maintenanceBreaches: data.maintenance_breaches, complianceRisk: data.compliance_risk, airbnbRisks: data.airbnb_risks };
  lastExplainItems = data.explain_items;
  html += renderExplainTop(data.explain_items);
  html += renderPortfolio(data.portfolio);
  lastPortfolio = data.portfolio;
  html += renderLiveMissionsRegister();

  hotelopsFeedExceptions(data);

  html += `<div class="sec"><div class="sec-hdr"><span class="lbl">EXECUTIVE ACTIONS</span></div>
    <div class="action-bar">
      <button class="abtn approve" onclick="recordExecutiveAction('ACKNOWLEDGED', 'Marked reviewed \u2014 logged to audit trail.')">&#10003; ACKNOWLEDGE</button>
      <button class="abtn escalate" onclick="recordExecutiveAction('ESCALATED', 'Escalation flagged \u2014 notify GM / ops director. Logged to audit trail.')">&#8593; ESCALATE</button>
    </div>
  </div>`;

  document.getElementById('wrap').innerHTML = html;
}

// Roadmap #9 -- pure assembly layer, same convention as TSMDeliveryPackage
// itself: nothing computed here, just translates lastExplainItems already
// read by render() above via toDeliveryPackageItems() and hands it to the
// engine.
window.exportClientPackage = function () {
  if (!window.TSMDeliveryPackage) {
    showToast('Delivery package engine not loaded.');
    return;
  }
  const pkg = TSMDeliveryPackage.build({
    domain: 'HotelOps',
    explainItems: toDeliveryPackageItems(lastExplainItems),
    sections: { financials: lastFinancials, riskRegister: lastRiskData, portfolio: lastPortfolio }
  });
  const blob = new Blob([JSON.stringify(pkg, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'tsm-client-package-' + Date.now() + '.json';
  a.click();
};

render();
window.addEventListener('storage', e => { if(e.key === RELAY_KEY_FALLBACK || e.key === 'TSM_EVENT_LOG') render(); });
window.addEventListener('TSM_RELAY_EVENT', e => { if(e.detail && e.detail.domain === DOMAIN) render(); });
if (window.TSMMissionStore) {
  window.TSMMissionStore.subscribe('*', () => render());
}
