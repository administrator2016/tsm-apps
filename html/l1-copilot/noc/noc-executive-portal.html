<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TSM &middot; NOC Command Center Executive Portal</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#050a0f;--bg2:#0a1020;--bg3:#0d1528;
  --cyan:#00d4d4;--amber:#f5a623;--green:#22c55e;
  --red:#ef4444;--purple:#a855f7;--blue:#3b82f6;
  --orange:#f97316;--text:#e2e8f0;--muted:#64748b;--border:#1e293b;
  --gold:#e8c15a;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);color:var(--text);font-family:'Rajdhani',sans-serif;min-height:100vh;padding-bottom:60px;}
.topbar{height:42px;background:#020810;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 20px;}
.tb-brand{font-family:'Orbitron',sans-serif;font-size:.7rem;color:var(--gold);letter-spacing:.15em;}
.tb-time{font-family:'Orbitron',sans-serif;font-size:.75rem;color:var(--gold);}
.hdr{padding:18px 24px;border-bottom:1px solid var(--border);background:var(--bg2);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;}
.hdr-title{font-family:'Orbitron',sans-serif;font-size:1rem;letter-spacing:.08em;color:var(--text);}
.hdr-sub{font-family:'JetBrains Mono',monospace;font-size:.65rem;color:var(--muted);margin-top:4px;}
.hdr-btns{display:flex;gap:8px;flex-wrap:wrap;}
.hbtn{background:var(--bg3);border:1px solid var(--border);color:var(--text);font-family:'JetBrains Mono',monospace;font-size:.62rem;padding:8px 14px;border-radius:4px;cursor:pointer;text-decoration:none;display:inline-block;}
.hbtn:hover{border-color:var(--gold);color:var(--gold);}
.hbtn.primary{border-color:var(--gold);color:var(--gold);}
.wrap{max-width:1200px;margin:0 auto;padding:20px 24px;}
.empty{text-align:center;padding:80px 20px;}
.empty h2{font-family:'Orbitron',sans-serif;font-size:.9rem;color:var(--muted);letter-spacing:.08em;margin-bottom:14px;}
.empty p{font-family:'JetBrains Mono',monospace;font-size:.7rem;color:var(--muted);margin-bottom:24px;}
.sec{background:var(--bg2);border:1px solid var(--border);border-radius:6px;padding:18px;margin-bottom:16px;}
.sec-hdr{font-family:'Orbitron',sans-serif;font-size:.68rem;color:var(--gold);letter-spacing:.12em;margin-bottom:14px;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;}
.sec-hdr .lbl::before{content:'\25C6';font-size:.55rem;margin-right:8px;}
.sec-hdr-note{font-family:'JetBrains Mono',monospace;font-size:.58rem;color:var(--muted);text-transform:none;letter-spacing:0;}
.no-items{font-family:'JetBrains Mono',monospace;font-size:.7rem;color:var(--muted);}
.meta-row{font-family:'JetBrains Mono',monospace;font-size:.65rem;color:var(--muted);margin-bottom:12px;}
.toast{position:fixed;bottom:20px;right:20px;background:var(--bg2);border:1px solid var(--gold);color:var(--gold);padding:10px 18px;border-radius:4px;font-family:'JetBrains Mono',monospace;font-size:.65rem;opacity:0;pointer-events:none;transition:.3s;z-index:50;}
.toast.show{opacity:1;transform:translateY(-4px);}

/* Financial headline */
.fin-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-bottom:16px;}
.fin-card{background:var(--bg2);border:1px solid var(--border);border-radius:6px;padding:18px;text-align:center;}
.fin-card.hero{border-color:var(--gold);background:rgba(232,193,90,.06);}
.fin-val{font-family:'Orbitron',sans-serif;font-size:1.6rem;font-weight:900;color:var(--gold);}
.fin-val.red{color:var(--red);}.fin-val.green{color:var(--green);}.fin-val.cyan{color:var(--cyan);}
.fin-lbl{font-size:.62rem;color:var(--muted);margin-top:8px;font-family:'JetBrains Mono',monospace;letter-spacing:.08em;}
.fin-sub{font-size:.58rem;color:var(--muted);margin-top:4px;font-family:'JetBrains Mono',monospace;}
.model-note{font-family:'JetBrains Mono',monospace;font-size:.6rem;color:var(--muted);border-top:1px solid var(--border);padding-top:10px;margin-top:6px;}

/* RCM stage funnel */
.funnel{display:flex;flex-direction:column;gap:6px;}
.funnel-row{display:grid;grid-template-columns:130px 1fr 90px 110px;gap:10px;align-items:center;font-size:.75rem;}
.funnel-row .fr-lbl{font-family:'JetBrains Mono',monospace;font-size:.62rem;color:var(--text);}
.funnel-bar-wrap{background:var(--bg3);border-radius:4px;height:22px;overflow:hidden;position:relative;}
.funnel-bar{height:100%;background:linear-gradient(90deg,var(--gold),var(--orange));display:flex;align-items:center;padding-left:8px;font-family:'JetBrains Mono',monospace;font-size:.6rem;color:#1a1200;font-weight:700;white-space:nowrap;}
.funnel-bar.empty-bar{background:var(--bg3);}
.fr-hours{font-family:'JetBrains Mono',monospace;font-size:.62rem;color:var(--muted);text-align:right;}
.fr-exposure{font-family:'JetBrains Mono',monospace;font-size:.65rem;text-align:right;color:var(--red);font-weight:700;}
.funnel-hdr{display:grid;grid-template-columns:130px 1fr 90px 110px;gap:10px;font-family:'JetBrains Mono',monospace;font-size:.55rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px;}
.funnel-hdr .align-r{text-align:right;}

/* Risk register */
.risk-item{display:flex;gap:14px;align-items:flex-start;padding:12px 0;border-bottom:1px solid #0f1a2e;}
.risk-item:last-child{border-bottom:none;}
.risk-rank{font-family:'Orbitron',sans-serif;font-size:1.1rem;font-weight:900;color:var(--gold);width:28px;flex-shrink:0;}
.risk-body{flex:1;}
.risk-title{font-size:.85rem;color:var(--text);margin-bottom:4px;}
.risk-title b{color:var(--red);}
.risk-action{font-family:'JetBrains Mono',monospace;font-size:.65rem;color:var(--muted);}
.risk-amount{font-family:'Orbitron',sans-serif;font-size:1rem;font-weight:700;color:var(--red);white-space:nowrap;}

.action-bar{display:flex;gap:10px;flex-wrap:wrap;margin-top:4px;}
.abtn{font-family:'Orbitron',sans-serif;font-size:.65rem;letter-spacing:.08em;padding:10px 18px;border-radius:4px;cursor:pointer;border:1px solid var(--border);background:var(--bg3);color:var(--text);}
.abtn.approve{border-color:var(--green);color:var(--green);}
.abtn.escalate{border-color:var(--red);color:var(--red);}
.abtn:hover{opacity:.85;}
.ai-box{background:rgba(232,193,90,.06);border:1px solid var(--gold);border-radius:6px;padding:22px;margin-bottom:16px;white-space:pre-wrap;font-size:.95rem;line-height:1.55;}
.ai-box table.md-table{border-collapse:collapse;width:100%;margin:8px 0;white-space:normal;}
.ai-box table.md-table th,.ai-box table.md-table td{border:1px solid var(--border);padding:4px 6px;text-align:left;vertical-align:top;}
.ai-box table.md-table th{color:var(--muted);text-transform:uppercase;font-size:.6rem;}

/* Explainability ("Why These Numbers") */
.why-details{border:1px solid var(--border);border-radius:6px;background:var(--bg3);margin-bottom:16px;}
.why-details summary{cursor:pointer;padding:10px 14px;font-family:'JetBrains Mono',monospace;font-size:.62rem;color:var(--gold);letter-spacing:.06em;list-style:none;display:flex;align-items:center;gap:8px;}
.why-details summary::-webkit-details-marker{display:none;}
.why-details summary::before{content:'\25B8';transition:transform .15s;}
.why-details[open] summary::before{transform:rotate(90deg);}
.why-body{padding:0 14px 14px;}
.why-formula{font-family:'JetBrains Mono',monospace;font-size:.6rem;color:var(--muted);border-top:1px solid var(--border);padding-top:10px;margin-bottom:10px;}
.why-formula b{color:var(--text);}
.why-table{width:100%;border-collapse:collapse;font-size:.68rem;}
.why-table th{text-align:left;font-family:'JetBrains Mono',monospace;font-size:.55rem;color:var(--muted);letter-spacing:.05em;text-transform:uppercase;padding:5px 6px;border-bottom:1px solid var(--border);}
.why-table td{padding:6px;border-bottom:1px solid #0f1a2e;font-family:'JetBrains Mono',monospace;}
.why-table tr:last-child td{border-bottom:none;}
.why-table td.excol{color:var(--red);font-weight:700;text-align:right;}
</style>

<script>
function tick(){document.getElementById('clock').textContent=new Date().toLocaleTimeString();}
setInterval(tick,1000);tick();

const DOMAIN = 'NOC';
const RELAY_KEY_FALLBACK = 'TSM_' + DOMAIN + '_RELAY';

function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  clearTimeout(showToast._h);
  showToast._h=setTimeout(()=>t.classList.remove('show'),2500);
}

// Was 'no downstream write in this demo build' -- now a real, persisted
// audit entry via TSMAuditEngine -> POST /api/governance/audit. No
// logged-in-user identity on this page (no session/auth wired here), so
// actor is the page identity itself, same convention used elsewhere for
// unauthenticated pages -- not a fabricated person.
function recordExecutiveAction(action, note){
  if(window.TSMAuditEngine){
    TSMAuditEngine.record({
      actor: 'noc-executive-portal',
      action: action,
      resource: DOMAIN,
      vertical: 'noc'
    });
  }
  showToast(note);
}

function loadRelay(){
  try {
    if(window.TSM && window.TSM.relay && window.TSM.relay.read){
      const d = window.TSM.relay.read(DOMAIN);
      if(d) return d;
    }
  } catch(e){}
  try {
    const raw = sessionStorage.getItem(RELAY_KEY_FALLBACK) || localStorage.getItem(RELAY_KEY_FALLBACK);
    return raw ? JSON.parse(raw) : null;
  } catch(e){ return null; }
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function money(n, currency){
  const sym = (currency === 'USD' || !currency) ? '$' : (currency + ' ');
  return sym + Math.round(n||0).toLocaleString();
}

function renderEmpty(){
  document.getElementById('wrap').innerHTML = `
    <div class="empty">
      <h2>NO DATA RECEIVED</h2>
      <p>Run an analysis in the NOC war room, then relay it here.</p>
      <div class="hdr-btns" style="justify-content:center;">
        <a class="hbtn primary" href="noc-war-room.html">&#128225; Go to War Room</a>
      </div>
    </div>`;
}

function renderEngineOutput(text) {
  if(!text) return '';
  const clean = text.replace(/KPI_JSON:\s*\{[^}]*\}\n*/i, '').trim();
  const lines = clean.split('\n');
  const isTableSep = l => /^\s*\|?[\s:|-]+\|?\s*$/.test(l) && l.includes('-');
  const inlineFmt = s => escapeHtml(s).replace(/&lt;br\s*\/?&gt;/gi, '<br>').replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  const tables = [];
  const outLines = [];
  let i = 0;
  while (i < lines.length) {
    const line = lines[i];
    if (/^\s*\|.*\|\s*$/.test(line) && lines[i + 1] !== undefined && isTableSep(lines[i + 1])) {
      const headers = line.trim().replace(/^\||\|$/g, '').split('|').map(c => c.trim());
      let t = '<table class="md-table"><thead><tr>' + headers.map(c => `<th>${inlineFmt(c)}</th>`).join('') + '</tr></thead><tbody>';
      i += 2;
      while (i < lines.length && /^\s*\|.*\|\s*$/.test(lines[i])) {
        const cells = lines[i].trim().replace(/^\||\|$/g, '').split('|').map(c => c.trim());
        t += '<tr>' + cells.map(c => `<td>${inlineFmt(c)}</td>`).join('') + '</tr>';
        i++;
      }
      t += '</tbody></table>';
      outLines.push(`@@TABLE${tables.length}@@`);
      tables.push(t);
      continue;
    }
    outLines.push(line);
    i++;
  }
  let html = escapeHtml(outLines.join('\n'));
  html = html.replace(/&lt;br\s*\/?&gt;/gi, '<br>');
  html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  html = html.replace(/^▸\s*(.+)$/gm, '<div style="margin:4px 0">▸ $1</div>');
  html = html.replace(/^(\d+)\.\s+(.+)$/gm, '<div style="margin:4px 0 4px 8px"><strong>$1.</strong> $2</div>');
  html = html.replace(/\n{2,}/g, '<br><br>').replace(/\n/g, '<br>');
  tables.forEach((t, idx) => { html = html.replace(`@@TABLE${idx}@@`, t); });
  return html;
}

/* ---------- CFO / RCM framing helpers ---------- */

function execAction(sev){
  if(sev === 'SEV1') return 'Engage vendor/on-call lead now \u2014 core-impact exposure is compounding hourly.';
  if(sev === 'SEV2') return 'Confirm remediation ETA with ops; escalate if unresolved this shift.';
  return 'Monitor \u2014 low board-level exposure at current pace.';
}

function renderFinancials(fin){
  if(!fin) return '';
  const total = fin.total_hourly_exposure || 0;
  return `<div class="fin-row">
    <div class="fin-card hero">
      <div class="fin-val">${money(total, fin.currency)}</div>
      <div class="fin-lbl">TOTAL HOURLY EXPOSURE</div>
      <div class="fin-sub">SLA penalties + revenue-at-risk, current run-rate</div>
    </div>
    <div class="fin-card">
      <div class="fin-val red">${money(fin.sla_penalty_exposure_total, fin.currency)}</div>
      <div class="fin-lbl">SLA PENALTY EXPOSURE</div>
      <div class="fin-sub">${(fin.sla_penalty_exposure_items||[]).length} incident(s) over SLA</div>
    </div>
    <div class="fin-card">
      <div class="fin-val red">${money(fin.revenue_at_risk_per_hour, fin.currency)}/hr</div>
      <div class="fin-lbl">REVENUE AT RISK</div>
      <div class="fin-sub">${fin.uptime_gap_pts}pt uptime gap vs. 100%</div>
    </div>
  </div>
  ${fin.note ? `<div class="model-note">&#9432; ${escapeHtml(fin.note)}</div>` : ''}`;
}

function renderFunnel(wip, fin){
  if(!wip || !wip.length) return '';
  const expByStage = {};
  (fin && fin.sla_penalty_exposure_items || []).forEach(it => {
    expByStage[it.stage] = (expByStage[it.stage] || 0) + it.exposure;
  });
  const maxCount = Math.max(1, ...wip.map(s => s.count));
  const rows = wip.map(s => {
    const pct = Math.round((s.count / maxCount) * 100);
    const exposure = expByStage[s.label] || 0;
    return `<div class="funnel-row">
      <div class="fr-lbl">${escapeHtml(s.label)}</div>
      <div class="funnel-bar-wrap"><div class="funnel-bar${s.count===0?' empty-bar':''}" style="width:${Math.max(pct,s.count?12:0)}%">${s.count} record${s.count===1?'':'s'}</div></div>
      <div class="fr-hours">${s.avg_hours_in_stage!==null ? s.avg_hours_in_stage+'h avg' : '&mdash;'}</div>
      <div class="fr-exposure">${exposure>0?money(exposure, fin&&fin.currency):'&mdash;'}</div>
    </div>`;
  }).join('');
  return `<div class="sec">
    <div class="sec-hdr"><span class="lbl">INCIDENT LIFECYCLE (RCM VIEW)</span><span class="sec-hdr-note">New &rarr; Triaged &rarr; In Progress &rarr; Escalated &rarr; Resolved &rarr; Closed</span></div>
    <div class="funnel-hdr"><span>Stage</span><span>Volume</span><span class="align-r">Avg Time</span><span class="align-r">$ Exposure</span></div>
    <div class="funnel">${rows}</div>
  </div>`;
}

/* ---------- Explainability ("Why AI Believes This") ----------
   Not a confidence score -- it's the literal formula already sitting in
   the relay payload's financials block: hours over SLA x $/hr rate for
   that severity = exposure, and uptime gap x $/pt/hr = revenue at risk.
   Rates are an editable assumption, not model output. */

function renderExplainability(fin){
  if(!fin) return '';
  const items = (fin.sla_penalty_exposure_items || []).slice(0, 8);
  const revRows = fin.revenue_at_risk_per_hour > 0
    ? `<tr><td>Uptime gap</td><td>${fin.uptime_gap_pts}pt below 100%</td><td>&times; $${(fin.revenue_at_risk_per_hour / Math.max(fin.uptime_gap_pts,0.01)).toFixed(0)}/pt/hr</td><td class="excol">${money(fin.revenue_at_risk_per_hour, fin.currency)}/hr</td></tr>`
    : '';
  const slaRows = items.map(it => `<tr>
    <td>${escapeHtml(it.id)} (${escapeHtml(it.severity)})</td>
    <td>${it.hours_over}h over SLA</td>
    <td>&times; ${money(it.rate_per_hour, fin.currency)}/hr</td>
    <td class="excol">${money(it.exposure, fin.currency)}</td>
  </tr>`).join('');
  if(!items.length && !revRows) return '';
  return `<details class="why-details">
    <summary>WHY THESE NUMBERS</summary>
    <div class="why-body">
      <div class="why-formula"><b>Formula:</b> SLA exposure = hours over SLA &times; $/hr rate by severity. Revenue at risk = uptime gap (pts) &times; $/pt/hr. Rates are editable planning assumptions in the model, not model output.${fin.note ? ' ' + escapeHtml(fin.note) : ''}</div>
      <table class="why-table">
        <thead><tr><th>Driver</th><th>Measured</th><th>Rate</th><th>Result</th></tr></thead>
        <tbody>${slaRows}${revRows}</tbody>
      </table>
    </div>
  </details>`;
}

function renderRiskRegister(fin){
  const items = (fin && fin.sla_penalty_exposure_items) || [];
  if(!items.length){
    return `<div class="sec"><div class="sec-hdr"><span class="lbl">TOP RISK REGISTER</span></div><div class="no-items">No SLA-breaching exposure right now &mdash; nothing to escalate to the board.</div></div>`;
  }
  const top3 = items.slice(0,3);
  const rows = top3.map((it, idx) => `
    <div class="risk-item">
      <div class="risk-rank">${idx+1}</div>
      <div class="risk-body">
        <div class="risk-title"><b>${escapeHtml(it.severity)}</b> &middot; ${escapeHtml(it.id)} &mdash; ${escapeHtml(it.title||'')} (${it.hours_over}h over SLA)</div>
        <div class="risk-action">${escapeHtml(execAction(it.severity))}</div>
      </div>
      <div class="risk-amount">${money(it.exposure, fin.currency)}</div>
    </div>`).join('');
  return `<div class="sec">
    <div class="sec-hdr"><span class="lbl">TOP RISK REGISTER</span><span class="sec-hdr-note">ranked by $ exposure</span></div>
    ${rows}
  </div>`;
}

// Roadmap #9 (Delivery Package) — distinct from renderExplainability()
// above (that one renders the on-page "Why These Numbers" formula panel;
// this one is the shared TSMDeliveryPackage contract, consumed only by
// exportClientPackage()). No invented severity rule needed: reuses the
// exact SEV1/SEV2/else severity tiering already grounded on this page in
// nocFeedExceptions() above (SEV1 -> high, SEV2 -> medium, else low), not a
// new mapping. revenue_at_risk_per_hour has no per-item severity anywhere
// in this codebase (it's a single aggregate uptime-gap figure, not a list
// of severities), so it stays honestly unclassified.
function getExplainItems(data){
  const items = [];
  const fin = data.financials || {};

  (fin.sla_penalty_exposure_items || []).forEach(it => {
    const sev = it.severity === 'SEV1' ? 'high' : (it.severity === 'SEV2' ? 'medium' : 'low');
    const explain = `${escapeHtml(it.severity)} \u2014 ${escapeHtml(it.id)} \u2014 ${escapeHtml(it.title||'')}, ${it.hours_over}h over SLA, ${money(it.exposure, fin.currency)} SLA-penalty exposure. Read from financials.sla_penalty_exposure_items as written by the NOC war room \u2014 same SEV1/SEV2 severity convention as nocFeedExceptions() below.`;
    items.push({
      label: it.severity + ' \u2014 ' + it.id,
      value: money(it.exposure, fin.currency),
      explain: explain,
      id: 'noc-sla-' + it.id,
      claim: it.severity + ': ' + it.id + ' ' + it.hours_over + 'h over SLA',
      severity: sev,
      rationale: explain,
      dataPoints: [
        { key: 'rawSeverity', value: it.severity },
        { key: 'hours_over', value: it.hours_over },
        { key: 'exposure', value: it.exposure }
      ],
      sources: ['NOC war room']
    });
  });

  if (fin.revenue_at_risk_per_hour != null) {
    const explain = `Read directly from financials.revenue_at_risk_per_hour \u2014 ${fin.uptime_gap_pts}pt uptime gap vs. 100% \u00d7 $/pt/hr, an editable planning assumption, not model output.`;
    items.push({
      label: 'REVENUE AT RISK',
      value: money(fin.revenue_at_risk_per_hour, fin.currency) + '/hr',
      explain: explain,
      id: 'noc-revenue-at-risk',
      claim: 'REVENUE AT RISK: ' + money(fin.revenue_at_risk_per_hour, fin.currency) + '/hr',
      // No severity: this is a single aggregate figure with no per-item
      // severity anywhere in this codebase, so left honestly unclassified.
      rationale: explain,
      dataPoints: [
        { key: 'revenue_at_risk_per_hour', value: fin.revenue_at_risk_per_hour },
        { key: 'uptime_gap_pts', value: fin.uptime_gap_pts }
      ],
      sources: ['NOC war room']
    });
  }

  return items;
}

// ===== EXCEPTION / CASE QUEUE FEED — Roadmap #10 Case Engine =====
// Same pattern as Mortgage/Schools/PM/Legal/BPO/Healthcare/Construction/
// FinOps/Insurance: turn the real SLA-breaching incidents already shown
// in the Top Risk Register into TSMExceptions.add() records, then
// TSMCaseManager.createFromException() so each gets a real
// approval/execution/audit lifecycle. No fabricated fields -- everything
// here mirrors fin.sla_penalty_exposure_items, the same real relay data
// renderRiskRegister() already renders.
const _nocFedIds = {};
function nocFeedExceptions(fin){
  if (typeof TSMExceptions === 'undefined' || !fin) return;
  const items = fin.sla_penalty_exposure_items || [];
  let fedAny = false;

  items.forEach(it => {
    if (!it || !it.id) return;
    if (_nocFedIds[it.id]) return; // already fed this incident this pageload
    _nocFedIds[it.id] = true;
    fedAny = true;

    const exceptionRecord = TSMExceptions.add({
      title: `${it.severity} \u2014 ${it.id} \u2014 ${it.title || ''} (${it.hours_over}h over SLA)`,
      detail: `SLA-penalty exposure of ${money(it.exposure, fin.currency)} at ${it.severity} severity.`,
      recommendedAction: 'See NOC Command Center Executive Portal risk register.',
      severity: it.severity === 'SEV1' ? 'high' : (it.severity === 'SEV2' ? 'med' : 'low'),
      confidence: null,
      sector: 'noc',
      agentLabel: 'NOC Strategist'
    });

    if (typeof TSMCaseManager !== 'undefined' && exceptionRecord) {
      const newCase = TSMCaseManager.createFromException(exceptionRecord, {
        process: 'noc_incident_sla_resolution',
        source: 'NOC Strategist',
        exposure: it.exposure
      });
      if (newCase) {
        TSMCaseManager.requestApproval(newCase.caseId, { note: 'Auto-requested on case creation from NOC exception feed.' });
      }
    }
  });

  if (!fedAny) return;
  if (typeof TSMExceptionWidget !== 'undefined') {
    TSMExceptionWidget.mount('tsm-exception-queue', { sector: 'noc' });
  }
  if (typeof TSMCaseWidget !== 'undefined') {
    TSMCaseWidget.mount('tsm-case-queue', { sector: 'noc' });
  }
}

// Roadmap #9 -- stashed here so exportClientPackage() (defined below) can
// reuse the exact same explain items render() already computed, rather than
// re-deriving anything. This page has no quality-score engine or document
// counter wired, so qualityScore/documentCount stay undefined -- honest
// nulls in the built package, same convention as insurance-executive-portal.html.
let lastExplainItems = [];

// Roadmap #9 -- render() already reads real financials, BNCA exposure
// projection, and incident WIP off the relay, but exportClientPackage()
// only ever forwarded lastExplainItems. Hoisted here so the export can
// pass them through as sections, same convention as Mortgage/Healthcare/BPO.
let lastFinancials = null;
let lastBncaExposure = null;
let lastIncidentWip = null;

function render(){
  const data = loadRelay();
  if(!data){ renderEmpty(); return; }

  document.getElementById('hdrSub').textContent = `Relayed ${data.timestamp ? new Date(data.timestamp).toLocaleString() : '&mdash;'}`;

  lastFinancials = data.financials || null;
  lastBncaExposure = data.bnca_exposure || null;
  lastIncidentWip = data.incident_wip || null;

  let html = '';

  // Strategist-reviewed badge, confirming the strategist hop actually
  // happened (see noc-strategist.html's relay re-stamp).
  html += data.reviewedAt
    ? `<div class="meta-row">Strategist reviewed <span style="color:var(--green)">${escapeHtml(new Date(data.reviewedAt).toLocaleTimeString())}</span></div>`
    : `<div class="meta-row"><span style="color:var(--muted)">Awaiting strategist review</span></div>`;

  html += renderFinancials(data.financials);

  // BNCA exposure projection, forwarded from the strategist page via the
  // same relay stamp.
  if(data.bnca_exposure){
    const b = data.bnca_exposure;
    html += `<div class="sec"><div class="sec-hdr">BNCA EXPOSURE PROJECTION</div>
      <div class="kpi-row">
        <div class="kpi"><div class="kpi-val cyan">$${Math.round(b.currentExposure).toLocaleString()}</div><div class="kpi-lbl">CURRENT EXPOSURE</div></div>
        <div class="kpi"><div class="kpi-val green">$${Math.round(b.ifActed.exposure).toLocaleString()}</div><div class="kpi-lbl">IF ACTED</div></div>
        <div class="kpi"><div class="kpi-val red">$${Math.round(b.ifIgnored.exposure).toLocaleString()}</div><div class="kpi-lbl">IF IGNORED</div></div>
      </div><div class="no-items" style="margin-top:8px">${escapeHtml(b.urgencyWindow||'')}</div></div>`;
  }

  if(data.ai_summary){
    html += `<div class="ai-box"><strong style="color:var(--gold);font-family:'Orbitron',sans-serif;font-size:.65rem;letter-spacing:.1em;display:block;margin-bottom:8px;">EXECUTIVE RECOMMENDATION</strong>${renderEngineOutput(data.ai_summary)}</div>`;
  }

  html += renderExplainability(data.financials);
  lastExplainItems = getExplainItems(data);
  html += renderRiskRegister(data.financials);
  html += renderFunnel(data.incident_wip, data.financials);

  nocFeedExceptions(data.financials);

  html += `<div class="sec"><div class="sec-hdr"><span class="lbl">EXECUTIVE ACTIONS</span></div>
    <div class="action-bar">
      <button class="abtn approve" onclick="recordExecutiveAction('ACKNOWLEDGED', 'Marked reviewed \u2014 logged to audit trail.')">&#10003; ACKNOWLEDGE</button>
      <button class="abtn escalate" onclick="recordExecutiveAction('ESCALATED', 'Escalation flagged \u2014 notify ops lead. Logged to audit trail.')">&#8593; ESCALATE</button>
    </div>
  </div>`;

  document.getElementById('wrap').innerHTML = html;
}

// Deferred to DOMContentLoaded (not called synchronously here) so that
// TSMExceptions/TSMCaseManager -- both loaded via <script src> tags
// earlier in the body -- are guaranteed available on the very first
// render(), not just on a later storage/TSM_RELAY_EVENT re-render. Same
// pattern used by Mortgage/Schools/PM/Legal Executive Portals.
function initRender(){
  render();
  window.addEventListener('storage', e => { if(e.key === RELAY_KEY_FALLBACK || e.key === 'TSM_EVENT_LOG') render(); });
  window.addEventListener('TSM_RELAY_EVENT', e => { if(e.detail && e.detail.domain === DOMAIN) render(); });
}
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', initRender);
} else {
  initRender();
}

// Roadmap #9 -- pure assembly layer, same convention as TSMDeliveryPackage
// itself: nothing computed here, just reuses lastExplainItems already
// produced by render() above and hands it to the engine.
window.exportClientPackage = function () {
  if (!window.TSMDeliveryPackage) {
    showToast('Delivery package engine not loaded.');
    return;
  }
  const pkg = TSMDeliveryPackage.build({
    domain: 'NOC',
    explainItems: lastExplainItems,
    sections: { financials: lastFinancials, bncaExposure: lastBncaExposure, incidentWip: lastIncidentWip }
  });
  const blob = new Blob([JSON.stringify(pkg, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'tsm-client-package-' + Date.now() + '.json';
  a.click();
};
