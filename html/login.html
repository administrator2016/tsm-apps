<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>TSM Login</title>
<style>
  body{background:#0a0e14;color:#e6f1ff;font-family:'Share Tech Mono',monospace;
       display:flex;align-items:center;justify-content:center;height:100vh;margin:0}
  form{background:#111826;border:1px solid #1f2937;padding:2rem;border-radius:6px;width:280px}
  h1{font-size:1rem;color:#00e5c7;margin:0 0 1rem}
  input{width:100%;box-sizing:border-box;background:#0a0e14;border:1px solid #1f2937;
        color:#e6f1ff;padding:.6rem;margin-bottom:.75rem;font-family:inherit}
  button{width:100%;background:#00e5c7;color:#0a0e14;border:0;padding:.6rem;
         font-weight:bold;cursor:pointer;font-family:inherit}
  #err{color:#ff5c6c;font-size:.8rem;min-height:1rem;margin-top:.5rem}
</style>
</head>
<body>
<form id="f">
  <h1>TSM ACCESS</h1>
  <input type="password" id="pw" placeholder="Password or client access code" autofocus required>
  <button type="submit">Sign in</button>
  <div id="err"></div>
</form>
<script>
document.getElementById('f').addEventListener('submit', async (e) => {
  e.preventDefault();
  const err = document.getElementById('err');
  err.textContent = '';
  try {
    const r = await fetch('/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: document.getElementById('pw').value })
    });
    const data = await r.json();
    if (data.ok) {
      // Clients land on their workspace by default; admin keeps the old
      // default landing page. An explicit ?next= always wins (e.g. when
      // the client-facing gate redirected here from a specific page).
      const fallback = data.role === 'client' ? '/client-portal.html' : '/bpo-files/suite-hub.html';
      const next = new URLSearchParams(location.search).get('next') || fallback;
      location.href = next;
    } else {
      err.textContent = data.error || 'Login failed';
    }
  } catch {
    err.textContent = 'Network error';
  }
});
</script>
</body>
</html>
