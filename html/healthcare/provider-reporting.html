<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TSM · Provider Reporting</title>
<style>
  :root{
    --bg:#0a0e14; --panel:#111826; --panel2:#0e1420; --border:#1f2937; --border-soft:#1a2332;
    --text:#e6f1ff; --text-dim:#7c8a9e; --accent:#00e5c7; --warn:#ffb454; --danger:#ff5c6c; --crit:#ff3b5c;
    --mono:'Share Tech Mono', 'SF Mono', Consolas, monospace;
  }
  *{box-sizing:border-box}
  body{background:var(--bg); color:var(--text); font-family:var(--mono); margin:0; min-height:100vh;}
  header{
    border-bottom:1px solid var(--border); padding:1.1rem 1.5rem;
    display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:.5rem;
  }
  header h1{font-size:.95rem; color:var(--accent); margin:0; letter-spacing:.06em; text-transform:uppercase}
  header .who{font-size:.75rem; color:var(--text-dim)}
  header .who b{color:var(--text)}
  #logout-btn{
    background:transparent; border:1px solid var(--border); color:var(--text-dim);
    font-family:inherit; font-size:.7rem; padding:.4rem .8rem; cursor:pointer; border-radius:4px;
  }
  #logout-btn:hover{border-color:var(--danger); color:var(--danger)}
  main{max-width:1300px; margin:0 auto; padding:1.5rem}
  .toolbar{display:flex; align-items:center; gap:.75rem; margin-bottom:1.25rem; flex-wrap:wrap}
  .toolbar input{
    background:var(--panel); border:1px solid var(--border); color:var(--text);
    font-family:inherit; font-size:.75rem; padding:.45rem .6rem; border-radius:4px;
  }
  .toolbar label{font-size:.65rem; color:var(--text-dim); text-transform:uppercase; letter-spacing:.04em}
  .toolbar .field{display:flex; flex-direction:column; gap:.25rem}
  #refresh-btn{
    background:var(--panel); border:1px solid var(--accent); color:var(--accent);
    font-family:inherit; font-size:.72rem; padding:.45rem .9rem; cursor:pointer; border-radius:4px; align-self:flex-end;
  }
  #refresh-btn:hover{background:rgba(0,229,199,.08)}
  .generated{font-size:.65rem; color:var(--text-dim); align-self:flex-end; margin-left:auto}

  .tabs{display:flex; gap:.25rem; border-bottom:1px solid var(--border); margin-bottom:1.25rem}
  .tab{
    background:none; border:none; color:var(--text-dim); font-family:inherit; font-size:.75rem;
    text-transform:uppercase; letter-spacing:.05em; padding:.6rem 1rem; cursor:pointer;
    border-bottom:2px solid transparent;
  }
  .tab.active{color:var(--accent); border-bottom-color:var(--accent)}
  .panel{display:none}
  .panel.active{display:block}

  .kpi-row{display:grid; grid-template-columns:repeat(auto-fit, minmax(180px,1fr)); gap:.75rem; margin-bottom:1.25rem}
  .kpi{background:var(--panel); border:1px solid var(--border); border-radius:6px; padding:.9rem 1rem}
  .kpi .label{font-size:.62rem; color:var(--text-dim); text-transform:uppercase; letter-spacing:.05em; margin-bottom:.35rem}
  .kpi .value{font-size:1.15rem; color:var(--text)}
  .kpi .value.accent{color:var(--accent)}
  .kpi .value.warn{color:var(--warn)}
  .kpi .value.danger{color:var(--danger)}
  .kpi .sub{font-size:.62rem; color:var(--text-dim); margin-top:.3rem}

  .section-title{font-size:.72rem; color:var(--text-dim); text-transform:uppercase; letter-spacing:.05em; margin:1.5rem 0 .6rem}
  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:1.25rem}
  @media (max-width:900px){.grid2{grid-template-columns:1fr}}

  table{width:100%; border-collapse:collapse; font-size:.76rem; margin-bottom:1rem}
  th{
    text-align:left; color:var(--text-dim); font-weight:normal; text-transform:uppercase;
    font-size:.6rem; letter-spacing:.04em; padding:.5rem .6rem; border-bottom:1px solid var(--border);
  }
  td{padding:.5rem .6rem; border-bottom:1px solid var(--border-soft); vertical-align:top}
  tbody tr:hover{background:#0f1622}
  .pill{
    display:inline-block; padding:.15rem .55rem; border-radius:3px; font-size:.6rem;
    text-transform:uppercase; letter-spacing:.03em; border:1px solid;
  }
  .pill.recovered{color:var(--accent); border-color:var(--accent)}
  .pill.partial{color:var(--warn); border-color:var(--warn)}
  .pill.none{color:var(--danger); border-color:var(--danger)}
  .pill.pending{color:var(--text-dim); border-color:var(--border)}
  .pill.critical{color:var(--crit); border-color:var(--crit)}
  .pill.high{color:var(--danger); border-color:var(--danger)}
  .pill.medium{color:var(--warn); border-color:var(--warn)}
  .pill.low{color:var(--text-dim); border-color:var(--border)}
  .num{color:var(--accent)}
  .num.unknown{color:var(--text-dim); font-style:italic}
  .bottleneck-flag{color:var(--warn); font-size:.65rem}
  .empty{color:var(--text-dim); font-size:.8rem; padding:1.25rem 0; text-align:center}
  .loading{color:var(--text-dim); font-size:.8rem; padding:1rem 0}
  .err{color:var(--danger); font-size:.8rem; padding:1rem 0}
  #gate{
    display:flex; align-items:center; justify-content:center; height:100vh; text-align:center;
    flex-direction:column; gap:.5rem;
  }
  #gate a{color:var(--accent)}

  .pill.down{color:var(--danger); border-color:var(--danger)}
  .pill.up{color:var(--warn); border-color:var(--warn)}
  .pill.stable{color:var(--accent); border-color:var(--accent)}
  .pill.na{color:var(--text-dim); border-color:var(--border)}
  .banner{background:var(--panel2); border:1px solid var(--border); border-left:3px solid var(--warn); border-radius:4px; padding:.7rem 1rem; font-size:.72rem; color:var(--text-dim); margin-bottom:1.25rem}
  .banner b{color:var(--text)}
  .reason{color:var(--text-dim); font-size:.62rem}

  .toolbar select, .toolbar input[type=month]{background:var(--panel); border:1px solid var(--border); color:var(--text); font-family:inherit; font-size:.75rem; padding:.45rem .6rem; border-radius:4px}
  .checks{display:flex; gap:.9rem; flex-wrap:wrap; align-items:center; font-size:.68rem; color:var(--text-dim)}
  .checks label{display:flex; gap:.3rem; align-items:center; text-transform:none; letter-spacing:0; color:var(--text-dim); font-size:.68rem}
  a.btn{background:var(--panel); border:1px solid var(--border); color:var(--text-dim); font-family:inherit; font-size:.72rem; padding:.45rem .9rem; border-radius:4px; text-decoration:none; align-self:flex-end}
  a.btn:hover{border-color:var(--accent); color:var(--accent)}
  .story{display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:.6rem; margin-bottom:1.25rem}
  .step{background:var(--panel); border:1px solid var(--border); border-radius:6px; padding:.8rem .9rem}
  .step .t{font-size:.6rem; color:var(--accent); text-transform:uppercase; letter-spacing:.06em; margin-bottom:.4rem}
  .step .l{font-size:.72rem; color:var(--text); line-height:1.5}
  .headline{background:var(--panel2); border:1px solid var(--border); border-left:3px solid var(--accent); border-radius:4px; padding:.8rem 1rem; font-size:.78rem; margin-bottom:1.25rem}
  .delta-up{color:var(--accent)} .delta-down{color:var(--danger)}
</style>
</head>
<body>

<div id="gate" style="display:none">
  <div style="color:var(--text-dim); font-size:.85rem">Sign in to view Provider Reporting.</div>
  <a href="/login.html">Go to login →</a>
</div>

<div id="app" style="display:none">
  <header>
    <h1>Provider Reporting</h1>
    <div style="display:flex; align-items:center; gap:1rem">
      <span class="who">Signed in as <b id="user-label">—</b></span>
      <button id="logout-btn">Sign out</button>
    </div>
  </header>

  <main>
    <div class="toolbar">
      <div class="field" id="fld-client">
        <label for="f-client">Provider (client ID)</label>
        <input id="f-client" type="text" placeholder="e.g. acme-health">
      </div>
      <div class="field">
        <label for="f-vertical">Vertical</label>
        <input id="f-vertical" type="text" placeholder="e.g. healthcare">
      </div>
      <div class="field">
        <label for="f-period">Period</label>
        <input id="f-period" type="month">
      </div>
      <div class="field" id="fld-view">
        <label for="f-view">View</label>
        <select id="f-view"><option value="internal">Internal (full)</option><option value="client">Client preview</option></select>
      </div>
      <div class="field">
        <label for="f-source">Source</label>
        <select id="f-source"><option value="live">Live</option><option value="snapshot">Saved monthly snapshot</option></select>
      </div>
      <button id="refresh-btn">Refresh</button>
      <a class="btn" id="pdf-link" href="#">Download PDF</a>
      <span class="generated" id="generated-at"></span>
    </div>
    <div class="toolbar">
      <div class="checks" id="section-checks">
        <span>Sections:</span>
        <label><input type="checkbox" value="executive-summary" checked> Executive Summary</label>
        <label><input type="checkbox" value="denial-recovery" checked> Denial &amp; Recovery</label>
        <label><input type="checkbox" value="payer-performance" checked> Payer Performance</label>
        <label><input type="checkbox" value="appeal-evidence" checked> Appeal &amp; Evidence</label>
      </div>
    </div>

    <div class="tabs" id="tabs"></div>
    <div id="wrap"><div class="loading">Loading provider report…</div></div>
  </main>
</div>

<script>
function escapeHtml(s){
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function money(n){
  if (n === null || n === undefined) return '—';
  return '<span class="num">$' + Number(n).toLocaleString(undefined, {minimumFractionDigits:2, maximumFractionDigits:2}) + '</span>';
}
function pct(r){ return (r === null || r === undefined) ? '—' : (r * 100).toFixed(1) + '%'; }
function hrs(h){
  if (h === null || h === undefined) return '—';
  return h >= 24 ? (h / 24).toFixed(1) + 'd' : h.toFixed(1) + 'h';
}
function delta(n, kind){
  if (n === null || n === undefined) return '—';
  const cls = n > 0 ? 'delta-up' : n < 0 ? 'delta-down' : '';
  const txt = kind === 'money' ? (n < 0 ? '-$' : '+$') + Math.abs(n).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2})
    : kind === 'pct' ? (n > 0 ? '+' : '') + (n * 100).toFixed(1) + ' pts'
    : (n > 0 ? '+' : '') + n;
  return '<span class="' + cls + '">' + txt + '</span>';
}
function table(head, rows){
  if (!rows.length) return '<div class="empty">No data for this scope.</div>';
  return '<table><thead><tr>' + head.map(h => '<th>' + h + '</th>').join('') + '</tr></thead><tbody>' +
    rows.map(r => '<tr>' + r.map(c => '<td>' + c + '</td>').join('') + '</tr>').join('') + '</tbody></table>';
}
function kpi(label, value, sub){
  return '<div class="kpi"><div class="label">' + label + '</div><div class="value">' + value + '</div>' + (sub ? '<div class="sub">' + sub + '</div>' : '') + '</div>';
}
function groupRows(list){
  return list.map(r => [escapeHtml(r.key), r.count, money(r.exposure), money(r.recovered), pct(r.recoveryRate), hrs(r.avgResolutionHours)]);
}
const GROUP_HEAD = ['', 'Cases', 'Exposure', 'Recovered', 'Rate', 'Avg resolution'];

function renderSummary(r){
  const e = r.executiveSummary;
  if (!e) return '<div class="empty">Executive Summary was not selected.</div>';
  const step = (t, lines) => '<div class="step"><div class="t">' + t + '</div><div class="l">' + lines.join('<br>') + '</div></div>';
  let out = '<div class="headline">' + escapeHtml(e.headline) + '</div>';
  out += '<div class="story">' +
    step('1 · Exposure', ['Resolved: ' + money(e.exposure.resolvedExposure), 'Open: ' + money(e.exposure.openExposure)]) +
    step('2 · Work', [e.work.claimsWorked + ' worked', e.work.resolved + ' resolved · ' + e.work.openNow + ' open']) +
    step('3 · Action', [e.action.topAction ? escapeHtml(e.action.topAction.action) + ' (' + pct(e.action.topAction.recoveryRate) + ')' : 'No resolved actions yet']) +
    step('4 · Recovery', [money(e.recovery.recovered), pct(e.recovery.recoveryRate) + ' · ' + hrs(e.recovery.avgResolutionHours)]) +
    step('5 · Remaining risk', ['Unrecovered: ' + money(e.remainingRisk.remainingBalance), e.remainingRisk.overdueOpen + ' past due']) +
    '</div>';
  const p = r.periodOverPeriod;
  if (p) {
    out += '<div class="section-title">Period over period (' + escapeHtml(p.previousPeriod) + ' → ' + escapeHtml(p.currentPeriod) + ')</div>' +
      table(['Metric', 'Previous', 'Current', 'Change'], [
        ['Claims worked', p.previous.claimsWorked, p.current.claimsWorked, delta(p.delta.claimsWorked)],
        ['Resolved', p.previous.resolved, p.current.resolved, delta(p.delta.resolved)],
        ['Exposure', money(p.previous.exposure), money(p.current.exposure), delta(p.delta.exposure, 'money')],
        ['Recovered', money(p.previous.recovered), money(p.current.recovered), delta(p.delta.recovered, 'money')],
        ['Recovery rate', pct(p.previous.recoveryRate), pct(p.current.recoveryRate), delta(p.delta.recoveryRate, 'pct')],
      ]);
  }
  return out;
}

function renderDenials(r){
  const d = r.denialRecovery;
  if (!d) return '<div class="empty">Denial &amp; Recovery was not selected.</div>';
  const a = d.openRecovery.aging;
  return '<div class="kpi-row">' +
    kpi('Claims worked', d.claimsWorked, d.denialVolume + ' new denials') +
    kpi('Total exposure', money(d.totalExposure)) +
    kpi('Recovered', money(d.totalRecovered), 'Rate ' + pct(d.recoveryRate)) +
    kpi('Remaining balance', money(d.remainingBalance)) +
    kpi('Avg time to resolution', hrs(d.avgResolutionHours)) +
    kpi('Open opportunities', d.openRecovery.openCount, money(d.openRecovery.openExposure) + ' exposure') +
    kpi('Deadline risk', d.slaRisk.overdueOpen + ' past due', d.slaRisk.dueWithin48h + ' due within 48h') +
    '</div>' +
    '<div class="section-title">Open aging</div>' +
    table(['< 1 day', '1–3 days', '3–7 days', '7+ days'], [[a.under1d, a.d1to3, a.d3to7, a.over7d]]) +
    '<div class="section-title">By denial category</div>' +
    table(['Denial category'].concat(GROUP_HEAD.slice(1)), groupRows(d.byDenialCategory));
}

function renderPayers(r){
  const p = r.payerPerformance;
  if (!p) return '<div class="empty">Payer Performance was not selected.</div>';
  const rows = p.byPayer.map(x => [escapeHtml(x.key), x.count, money(x.exposure), money(x.recovered), pct(x.recoveryRate), hrs(x.turnaroundHours),
    x.outcomes.recovered + ' full · ' + x.outcomes.partial + ' partial · ' + x.outcomes.none + ' none',
    escapeHtml(x.recurringDenialReasons.map(z => z.reason + ' ×' + z.count).join(', '))]);
  return '<div class="section-title">Payer performance (resolved in period)</div>' +
    table(['Payer', 'Cases', 'Exposure', 'Recovered', 'Rate', 'Turnaround', 'Appeal outcomes', 'Recurring denial reasons'], rows);
}

function renderAppeals(r){
  const a = r.appealEffectiveness;
  if (!a) return '<div class="empty">Appeal &amp; Evidence was not selected.</div>';
  return '<div class="section-title">By action taken</div>' +
    table(['Action'].concat(GROUP_HEAD.slice(1)), groupRows(a.byAction)) +
    '<div class="section-title">By action and denial category</div>' +
    table(['Action | category'].concat(GROUP_HEAD.slice(1)), groupRows(a.byActionAndDenialCategory)) +
    '<div class="reason">' + escapeHtml(a.note) + '</div>';
}

function renderInternal(r){
  const n = r.internal;
  if (!n) return '<div class="empty">Internal view is not available for this session.</div>';
  const tiers = Object.entries(n.predictionVsActual.byPredictedLikelihood).map(([t, v]) => [t, v.predicted, pct(v.calibrationRate), v.avgVariance ?? '—']);
  const flagged = n.calibrationSignals ? n.calibrationSignals.flagged.map(f => [escapeHtml(f.vertical + ' / ' + f.payer + ' / ' + f.denialCategory + ' / ' + f.action), f.predictedLikelihood, f.sampleSize, pct(f.observedRecoveryRate), f.signal]) : [];
  return '<div class="kpi-row">' +
    kpi('Likely bottleneck', escapeHtml(n.pipeline.likelyBottleneckStage || 'none')) +
    kpi('Overdue open', n.slaFailures.overdueOpen) +
    kpi('Resolved late', n.slaFailures.resolvedLate) +
    kpi('Auto-apply', n.governance.calibrationConfig.automaticProductionApplication ? 'ENABLED' : 'DISABLED', 'Human approval ' + (n.governance.calibrationConfig.humanApprovalRequired ? 'required' : 'not required')) +
    '</div>' +
    '<div class="section-title">Pipeline by stage</div>' +
    table(['Stage', 'Open', 'Avg age'], n.pipeline.byStage.map(s => [escapeHtml(s.stage), s.count, hrs(s.avgAgeHours)])) +
    '<div class="section-title">Oldest open</div>' +
    table(['Case', 'Stage', 'Priority', 'Age'], n.pipeline.oldestOpen.map(o => [escapeHtml(o.caseId), escapeHtml(o.stage || '—'), escapeHtml(o.priority || '—'), hrs(o.ageHours)])) +
    '<div class="section-title">Analyst / queue performance</div>' +
    table(['Owner', 'Resolved', 'Recovered', 'Rate', 'Avg resolution', 'Open now'], n.queuePerformance.map(q => [escapeHtml(q.owner), q.count, money(q.recovered), pct(q.recoveryRate), hrs(q.avgResolutionHours), q.openNow])) +
    '<div class="section-title">Prediction → actual</div>' +
    table(['Predicted tier', 'Records', 'Calibration rate', 'Avg variance'], tiers) +
    '<div class="section-title">Calibration signals (' + escapeHtml(n.calibrationSignals ? n.calibrationSignals.scope : 'unavailable') + ')</div>' +
    table(['Group', 'Tier', 'Samples', 'Observed rate', 'Signal'], flagged) +
    '<div class="section-title">Recent audit</div>' +
    table(['Time', 'Actor', 'Action', 'Entity'], n.governance.recentAudit.map(a => [escapeHtml(a.ts), escapeHtml(a.actor || '—'), escapeHtml(a.action), escapeHtml(a.entityId)]));
}

const TABS = [
  { id: 'summary', label: 'Executive Summary', fn: renderSummary },
  { id: 'denials', label: 'Denial & Recovery', fn: renderDenials },
  { id: 'payers', label: 'Payer Performance', fn: renderPayers },
  { id: 'appeals', label: 'Appeal & Evidence', fn: renderAppeals },
  { id: 'internal', label: 'Internal', fn: renderInternal, staffOnly: true },
];
let SESSION = null, LAST = null, ACTIVE = 'summary';

function isStaff(){ return SESSION && SESSION.role !== 'client'; }

function paintTabs(){
  const view = document.getElementById('f-view').value;
  const showInternal = isStaff() && view === 'internal';
  if (ACTIVE === 'internal' && !showInternal) ACTIVE = 'summary';
  document.getElementById('tabs').innerHTML = TABS.filter(t => !t.staffOnly || showInternal)
    .map(t => '<button class="tab' + (t.id === ACTIVE ? ' active' : '') + '" data-tab="' + t.id + '">' + t.label + '</button>').join('');
  document.querySelectorAll('#tabs .tab').forEach(b => b.addEventListener('click', () => { ACTIVE = b.dataset.tab; paintTabs(); paint(); }));
}
function paint(){
  if (!LAST) return;
  const tab = TABS.find(t => t.id === ACTIVE);
  document.getElementById('wrap').innerHTML = tab.fn(LAST);
}

function selectedSections(){
  return Array.from(document.querySelectorAll('#section-checks input:checked')).map(i => i.value);
}
function params(){
  const q = new URLSearchParams();
  const client = document.getElementById('f-client').value.trim();
  const vertical = document.getElementById('f-vertical').value.trim();
  const period = document.getElementById('f-period').value;
  const secs = selectedSections();
  if (isStaff() && client) q.set('clientId', client);
  if (vertical) q.set('vertical', vertical);
  if (period) q.set('period', period);
  if (isStaff()) q.set('view', document.getElementById('f-view').value);
  if (secs.length && secs.length < 4) q.set('sections', secs.join(','));
  return q;
}

async function load(){
  const wrap = document.getElementById('wrap');
  wrap.innerHTML = '<div class="loading">Loading provider report…</div>';
  const q = params();
  const snapshot = document.getElementById('f-source').value === 'snapshot';
  document.getElementById('pdf-link').href = '/api/bpo/reports/provider.pdf?' + q.toString();
  try {
    const url = snapshot ? '/api/bpo/reports/provider-monthly?' + q.toString() : '/api/bpo/reports/provider?' + q.toString();
    const r = await fetch(url);
    const j = await r.json();
    if (!j.ok) throw new Error(j.error || 'request failed');
    LAST = j.report;
    document.getElementById('generated-at').textContent = (snapshot ? 'Snapshot ' + j.periodLabel + ' · ' : '') + 'Generated ' + new Date(snapshot ? j.generatedAt : LAST.generatedAt).toLocaleString();
    paintTabs();
    paint();
  } catch (e) {
    wrap.innerHTML = '<div class="err">Could not load report: ' + escapeHtml(e.message) + '</div>';
  }
}

async function boot(){
  try { SESSION = await (await fetch('/api/auth/status')).json(); }
  catch (e) { document.getElementById('gate').style.display = 'flex'; return; }
  if (!SESSION.authenticated || !['admin','manager','analyst','client'].includes(SESSION.role)) {
    document.getElementById('gate').style.display = 'flex';
    return;
  }
  document.getElementById('app').style.display = 'block';
  document.getElementById('user-label').textContent = SESSION.label || SESSION.role;
  if (!isStaff()) {
    document.getElementById('fld-client').style.display = 'none';
    document.getElementById('fld-view').style.display = 'none';
  }
  const now = new Date();
  document.getElementById('f-period').value = now.getUTCFullYear() + '-' + String(now.getUTCMonth() + 1).padStart(2, '0');
  document.getElementById('logout-btn').addEventListener('click', async () => {
    await fetch('/api/auth/logout', { method: 'POST' });
    location.href = '/login.html';
  });
  document.getElementById('refresh-btn').addEventListener('click', load);
  document.getElementById('f-view').addEventListener('change', load);
  load();
}
boot();
</script>
</body>
</html>
