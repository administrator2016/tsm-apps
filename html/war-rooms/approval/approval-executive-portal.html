<!DOCTYPE html>
<html lang="en">

<meta charset="UTF-8">

<title>TSM &middot; Approval Chain Executive Portal</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/html/shared/tsm-exec-framework.css">
<style>
:root{
  --bg:#050a0f;--bg2:#0a1020;--bg3:#0d1528;
  --cyan:#00d4d4;--amber:#f5a623;--green:#22c55e;
  --red:#ef4444;--purple:#a855f7;--blue:#3b82f6;
  --orange:#f97316;--text:#e2e8f0;--muted:#64748b;--border:#1e293b;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);color:var(--text);font-family:'Rajdhani',sans-serif;min-height:100vh;padding-bottom:60px;}
.topbar{height:42px;background:#020810;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 20px;}
.tb-brand{font-family:'Orbitron',sans-serif;font-size:.7rem;color:var(--cyan);letter-spacing:.15em;}
.tb-time{font-family:'Orbitron',sans-serif;font-size:.75rem;color:var(--cyan);}
.hdr{padding:18px 24px;border-bottom:1px solid var(--border);background:var(--bg2);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;}
.hdr-title{font-family:'Orbitron',sans-serif;font-size:1rem;letter-spacing:.08em;color:var(--text);}
.hdr-sub{font-family:'JetBrains Mono',monospace;font-size:.65rem;color:var(--muted);margin-top:4px;}
.hdr-btns{display:flex;gap:8px;flex-wrap:wrap;}
.hbtn{background:var(--bg3);border:1px solid var(--border);color:var(--text);font-family:'JetBrains Mono',monospace;font-size:.62rem;padding:8px 14px;border-radius:4px;cursor:pointer;text-decoration:none;display:inline-block;}
.hbtn:hover{border-color:var(--cyan);color:var(--cyan);}
.hbtn.primary{border-color:var(--cyan);color:var(--cyan);}
.wrap{max-width:1200px;margin:0 auto;padding:20px 24px;}
.empty{text-align:center;padding:80px 20px;}
.empty h2{font-family:'Orbitron',sans-serif;font-size:.9rem;color:var(--muted);letter-spacing:.08em;margin-bottom:14px;}
.empty p{font-family:'JetBrains Mono',monospace;font-size:.7rem;color:var(--muted);margin-bottom:24px;}
.kpi-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:20px;}
.kpi{background:var(--bg2);border:1px solid var(--border);border-radius:6px;padding:16px;text-align:center;}
.kpi-val{font-family:'Orbitron',sans-serif;font-size:1.3rem;font-weight:700;color:var(--orange);}
.kpi-val.red{color:var(--red);}.kpi-val.green{color:var(--green);}.kpi-val.cyan{color:var(--cyan);}.kpi-val.amber{color:var(--amber);}
.kpi-lbl{font-size:.6rem;color:var(--muted);margin-top:6px;font-family:'JetBrains Mono',monospace;letter-spacing:.08em;}
.sec{background:var(--bg2);border:1px solid var(--border);border-radius:6px;padding:18px;margin-bottom:16px;}
.sec-hdr{font-family:'Orbitron',sans-serif;font-size:.68rem;color:var(--cyan);letter-spacing:.12em;margin-bottom:14px;display:flex;align-items:center;gap:8px;}
.sec-hdr::before{content:'\25C6';font-size:.55rem;}
.ai-box{background:rgba(0,212,212,.06);border:1px solid var(--cyan);border-radius:6px;padding:16px;margin-bottom:16px;white-space:pre-wrap;font-size:.88rem;line-height:1.55;}
.ai-box table.md-table{border-collapse:collapse;width:100%;margin:8px 0;white-space:normal;}
.ai-box table.md-table th,.ai-box table.md-table td{border:1px solid var(--border);padding:4px 6px;text-align:left;vertical-align:top;}
.ai-box table.md-table th{color:var(--muted);text-transform:uppercase;font-size:.6rem;}
.ai-box.hero{padding:22px;font-size:.95rem;}
.list-row{display:flex;align-items:flex-start;gap:10px;padding:9px 0;border-bottom:1px solid #0f1a2e;font-size:.82rem;}
.list-row:last-child{border-bottom:none;}
.lbadge{font-family:'JetBrains Mono',monospace;font-size:.55rem;font-weight:700;padding:2px 8px;border-radius:10px;flex-shrink:0;margin-top:2px;background:rgba(245,166,35,.12);color:var(--amber);border:1px solid var(--amber);white-space:nowrap;}
.meta-row{display:flex;gap:18px;flex-wrap:wrap;font-family:'JetBrains Mono',monospace;font-size:.6rem;color:var(--muted);margin-top:10px;}
.meta-row span{color:var(--text);}
.toast{position:fixed;bottom:20px;right:20px;background:var(--bg2);border:1px solid var(--cyan);color:var(--cyan);padding:10px 18px;border-radius:4px;font-family:'JetBrains Mono',monospace;font-size:.65rem;opacity:0;pointer-events:none;transition:.3s;z-index:50;}
.toast.show{opacity:1;transform:translateY(-4px);}
.action-bar{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px;}
.abtn{font-family:'Orbitron',sans-serif;font-size:.65rem;letter-spacing:.08em;padding:10px 18px;border-radius:4px;cursor:pointer;border:1px solid var(--border);background:var(--bg3);color:var(--text);}
.abtn.approve{border-color:var(--green);color:var(--green);}
.abtn.escalate{border-color:var(--red);color:var(--red);}
.abtn:hover{opacity:.85;}
.no-items{font-family:'JetBrains Mono',monospace;font-size:.7rem;color:var(--muted);}
.delta{font-size:.85rem;font-weight:700;}
.delta.up{color:var(--green);}
.delta.down{color:var(--red);}
.delta.flat{color:var(--muted);}
</style>

<body>
<section
  id="tsm-guided-how-to-root"
  data-tsm-guided-how-to="true"
  aria-label="TSM Guided How-To"
></section>

<div class="topbar">
  <span class="tb-brand">TSM &middot; APPROVAL CHAIN EXECUTIVE PORTAL</span>
  <span class="tb-time" id="clock"></span>
</div>
<div class="hdr">
  <div>
    <div class="hdr-title" id="hdrTitle">&#9989; APPROVAL CHAIN EXECUTIVE PORTAL</div>
    <div class="hdr-sub" id="hdrSub">Awaiting relay from the Approval Chain war room&hellip;</div>
  </div>
  <div class="hdr-btns">
    <a class="hbtn" href="approval-war-room.html">&larr; War Room</a>
    <a class="hbtn primary" href="approval-strategist.html">Strategist View &rarr;</a>
    <button class="hbtn" id="printBtn" onclick="window.print()">&darr; Export</button>
  </div>
</div>
<div class="wrap" id="wrap"><!-- populated by JS --></div>
<div class="wrap" id="hitlStatsWrap" style="padding-top:0;"></div>
<div class="wrap" id="excWrap" style="padding-top:0;"><div id="tsm-exception-queue"></div></div>
<div class="wrap" id="caseWrap" style="padding-top:0;"><div id="tsm-case-queue"></div></div>
<div class="toast" id="toast"></div>
<script src="/html/shared/tsm-exec-framework.js"></script>

<script src="/html/shared/tsm-quality-score-engine.js"></script>

<script>
function tick(){document.getElementById('clock').textContent=new Date().toLocaleTimeString();}
setInterval(tick,1000);tick();

const CFG = {"domain": "APPROVAL", "kpiPath": "kpis", "kpis": [{"key": "total_requests", "label": "TOTAL REQUESTS", "fmt": "num", "cls": "cyan"}, {"key": "pending_requests", "label": "PENDING", "fmt": "num", "cls": "amber"}, {"key": "escalated_count", "label": "ESCALATED", "fmt": "num", "cls": "red"}, {"key": "sla_breach_count", "label": "SLA BREACHES", "fmt": "num", "cls": "red"}, {"key": "approval_rate_pct", "label": "APPROVAL RATE", "fmt": "pct", "cls": "green"}, {"key": "avg_cycle_hours", "label": "AVG CYCLE (HRS)", "fmt": "num", "cls": "cyan"}], "lists": [{"path": "attention_flags", "label": "ATTENTION FLAGS"}], "aiPaths": ["ai_analysis"], "explainPath": "explain", "title": "Approval Chain", "isExec": true};
const RELAY_KEY_FALLBACK = 'TSM_' + CFG.domain + '_RELAY';
const HITL_DECISIONS_ENDPOINT = '/api/approval/decisions';

// Renders the HITL approve/reject decision stats (approval rate + the
// improvement-rate trend vs. the prior decision window) independently of
// the war-room relay payload above, since this comes straight from the
// server's decision log (APPROVAL_HITL_GATE) rather than a relayed
// snapshot, and should show even before any relay has ever landed.
function renderHitlStats(stats){
  const mount = document.getElementById('hitlStatsWrap');
  if(!mount) return;
  if(!stats || !stats.total){
    mount.innerHTML = `<div class="sec"><div class="sec-hdr">APPROVAL IMPROVEMENT RATE</div><div class="no-items">No HITL decisions recorded yet &mdash; approve or reject a request to start tracking trend.</div></div>`;
    return;
  }
  let deltaHtml = '<span class="delta flat">&mdash;</span>';
  if(stats.improvementRate !== null && stats.improvementRate !== undefined){
    const dir = stats.improvementRate > 0 ? 'up' : (stats.improvementRate < 0 ? 'down' : 'flat');
    const arrow = dir === 'up' ? '&#9650;' : (dir === 'down' ? '&#9660;' : '&#9679;');
    const sign = stats.improvementRate > 0 ? '+' : '';
    deltaHtml = `<span class="delta ${dir}">${arrow} ${sign}${stats.improvementRate}pp</span>`;
  }
  mount.innerHTML = `<div class="sec">
    <div class="sec-hdr">APPROVAL IMPROVEMENT RATE</div>
    <div class="kpi-row">
      <div class="kpi"><div class="kpi-val green">${stats.approvalRate}%</div><div class="kpi-lbl">APPROVAL RATE (ALL-TIME)</div></div>
      <div class="kpi"><div class="kpi-val cyan">${deltaHtml}</div><div class="kpi-lbl">IMPROVEMENT vs PRIOR PERIOD</div></div>
      <div class="kpi"><div class="kpi-val cyan">${stats.total}</div><div class="kpi-lbl">TOTAL DECISIONS</div></div>
      <div class="kpi"><div class="kpi-val green">${stats.approved}</div><div class="kpi-lbl">APPROVED</div></div>
      <div class="kpi"><div class="kpi-val red">${stats.rejected}</div><div class="kpi-lbl">REJECTED</div></div>
    </div>
  </div>`;
}

async function loadHitlStats(){
  try {
    const r = await fetch(HITL_DECISIONS_ENDPOINT);
    const data = await r.json();
    if(data && data.ok) renderHitlStats(data.stats);
  } catch(e){ /* server not reachable in this session -- leave last render in place */ }
}

function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  clearTimeout(showToast._h);
  showToast._h=setTimeout(()=>t.classList.remove('show'),2500);
}

// Was 'no downstream write in this demo build' -- now a real, persisted
// audit entry via TSMAuditEngine -> POST /api/governance/audit. No
// logged-in-user identity on this page (no session/auth wired here), so
// actor is the page identity itself, same convention used elsewhere for
// unauthenticated pages -- not a fabricated person.
function recordExecutiveAction(action, note){
  if(window.TSMAuditEngine){
    TSMAuditEngine.record({
      actor: 'approval-executive-portal',
      action: action,
      resource: (CFG && CFG.domain) || 'APPROVAL',
      vertical: 'approval'
    });
  }
  showToast(note);
}

function loadRelay(){
  try {
    if(window.TSM && window.TSM.relay && window.TSM.relay.read){
      const d = window.TSM.relay.read(CFG.domain);
      if(d) return d;
    }
  } catch(e){}
  try {
    const raw = sessionStorage.getItem(RELAY_KEY_FALLBACK) || localStorage.getItem(RELAY_KEY_FALLBACK);
    return raw ? JSON.parse(raw) : null;
  } catch(e){ return null; }
}

function getPath(obj, path){
  if(!path) return obj;
  return path.split('.').reduce((o,k)=> (o && o[k]!==undefined) ? o[k] : undefined, obj);
}

function fmtVal(v, fmt){
  if(v===undefined || v===null || v==='') return '&mdash;';
  if(fmt==='money') return '$' + Number(v).toLocaleString();
  if(fmt==='pct') return v + '%';
  return String(v);
}

function dynamicCls(v){
  const n = Number(v);
  if(isNaN(n)) return 'cyan';
  if(n>=80) return 'green';
  if(n>=50) return 'amber';
  return 'red';
}

function renderEmpty(){
  document.getElementById('wrap').innerHTML = `
    <div class="empty">
      <h2>NO DATA RECEIVED</h2>
      <p>Run an analysis in the Approval Chain war room, then relay it here.</p>
      <div class="hdr-btns" style="justify-content:center;">
        <a class="hbtn primary" href="approval-war-room.html">&#9989; Go to War Room</a>
      </div>
    </div>`;
}

function itemText(item){
  if(typeof item === 'string') return item;
  if(!item || typeof item !== 'object') return String(item);
  const keys = ['message','description','reason','title','name','label','text','type'];
  for(const k of keys){ if(item[k]) return String(item[k]); }
  return JSON.stringify(item).slice(0,140);
}

function itemBadge(item){
  if(!item || typeof item !== 'object') return null;
  return item.status || item.severity || item.stage || item.priority || null;
}

function renderList(items, label, opts){
  opts = opts || {};
  if(!items || !items.length){
    return `<div class="sec"><div class="sec-hdr">${label}</div><div class="no-items">No items.</div></div>`;
  }
  const rows = items.slice(0,12).map(it=>{
    let main, badge;
    if(opts.scoreItem){
      main = it.label || it.name || it.id || 'Domain';
      badge = (it.score!==undefined) ? it.score+'%' : null;
    } else if(opts.systemItem){
      main = it.name || it.id || 'System';
      badge = it.status || null;
      if(badge && badge==='healthy') return '';
    } else {
      main = itemText(it);
      badge = itemBadge(it);
    }
    if(!main) return '';
    return `<div class="list-row">${badge?`<span class="lbadge">${escapeHtml(String(badge))}</span>`:''}<span>${escapeHtml(String(main))}</span></div>`;
  }).filter(Boolean).join('');
  return `<div class="sec"><div class="sec-hdr">${label}</div>${rows || '<div class="no-items">All clear &mdash; no flagged items.</div>'}</div>`;
}

// Wires the shared Quality Score Engine to whatever explain items this
// portal already fetches for the risk register (CFG.explainPath), so it's
// one score per relay payload, not a second data path to keep in sync.
function renderQualityScore(explainItems, recordCount){
  if(!window.TSMQualityScoreEngine) return '';
  const q = TSMQualityScoreEngine.fromExplainItems(explainItems || [], { recordCount: recordCount });
  const bandCls = (q.band==='EXCELLENT'||q.band==='STRONG') ? 'green' : (q.band==='ACCEPTABLE') ? 'amber' : 'red';
  const tiles = [
    { val: q.overall, lbl: 'OVERALL' },
    { val: q.accuracy, lbl: 'ACCURACY' },
    { val: q.completeness, lbl: 'COMPLETENESS' },
    { val: q.compliance, lbl: 'COMPLIANCE' },
    { val: q.confidence, lbl: 'CONFIDENCE' }
  ];
  const tileHtml = tiles.map(t=>`<div class="kpi"><div class="kpi-val ${dynamicCls(t.val)}">${t.val}</div><div class="kpi-lbl">${t.lbl}</div></div>`).join('');
  const reasonsHtml = (q.reasons && q.reasons.length)
    ? q.reasons.map(r=>`<div class="list-row"><span class="lbadge">${escapeHtml(String(r.severity).toUpperCase())}</span><span>${escapeHtml(r.claim)}</span></div>`).join('')
    : '<div class="no-items">No open findings driving the score down.</div>';
  return `<div class="sec">
    <div class="sec-hdr">TSM QUALITY SCORE<span class="lbadge" style="margin-left:auto;background:transparent;border-color:var(--${bandCls});color:var(--${bandCls});">${q.band}</span></div>
    <div class="kpi-row">${tileHtml}</div>
    ${reasonsHtml}
  </div>`;
}

function render(){
  const data = loadRelay();
  if(!data){ renderEmpty(); return; }

  document.getElementById('hdrSub').textContent = `Relayed ${data.timestamp ? new Date(data.timestamp).toLocaleString() : '&mdash;'}`;

  const kpiBase = getPath(data, CFG.kpiPath) || {};
  let html = '';

  const tiles = CFG.kpis.map(k=>{
    const raw = kpiBase[k.key];
    const cls = k.cls === 'dynamic' ? dynamicCls(raw) : k.cls;
    return { val: fmtVal(raw, k.fmt), lbl: k.label, cls };
  });
  html += `<div class="kpi-row">` + tiles.map(t=>`
    <div class="kpi"><div class="kpi-val ${t.cls}">${t.val}</div><div class="kpi-lbl">${t.lbl}</div></div>
  `).join('') + `</div>`;

  let aiText = null;
  for(const p of CFG.aiPaths){
    const v = getPath(data, p);
    if(v){ aiText = v; break; }
  }
  if(aiText){
    html += `<div class="ai-box ${CFG.isExec?'hero':''}"><strong style="color:var(--cyan);font-family:'Orbitron',sans-serif;font-size:.65rem;letter-spacing:.1em;display:block;margin-bottom:8px;">${CFG.isExec?'EXECUTIVE RECOMMENDATION':'AI ANALYSIS'}</strong>${renderEngineOutput(aiText)}</div>`;
  }

  for(const l of CFG.lists){
    const items = getPath(data, l.path);
    html += renderList(items, l.label, l);
  }

  // Strategist-reviewed badge + forwarded BNCA exposure (computed on the
  // strategist page, travels here via the same relay stamp).
  if(window.TSMExecFramework){
    html += window.TSMExecFramework.renderReviewBadge(data);
    if(data.bnca_exposure) html += window.TSMExecFramework.renderBNCA(data.bnca_exposure);
  }

  if(CFG.explainPath){
    const explainItems = getPath(data, CFG.explainPath);
    html += renderQualityScore(explainItems, kpiBase.record_count);
    if(window.TSMExecFramework){
      html += TSMExecFramework.renderRiskRegister(explainItems, { isExec: CFG.isExec });
    }
  }

  if(CFG.isExec){
    html += `<div class="sec"><div class="sec-hdr">ACTIONS</div>
      <div class="action-bar">
        <button class="abtn approve" onclick="recordExecutiveAction('ACKNOWLEDGED', 'Marked reviewed \u2014 logged to audit trail.')">&#10003; ACKNOWLEDGE</button>
        <button class="abtn escalate" onclick="recordExecutiveAction('ESCALATED', 'Escalation flagged \u2014 notify ops lead. Logged to audit trail.')">&#8593; ESCALATE</button>
      </div>
    </div>`;
  }

  document.getElementById('wrap').innerHTML = html;

  // Feed the exception queue from this vertical's own CFG.lists data —
  // no fabricated fields, same convention as the rest of the platform.
  if(window.TSMExceptions && window.TSMExceptionWidget){
    window.TSMExecFramework && window.TSMExecFramework.feedExceptions(CFG.domain.toLowerCase(), CFG, data);
    window.TSMExceptionWidget.mount('tsm-exception-queue', { sector: CFG.domain.toLowerCase() });
  }
  if(window.TSMCaseWidget){
    window.TSMCaseWidget.mount('tsm-case-queue', { sector: CFG.domain.toLowerCase() });
  }
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// Ported from plant-incident.html / supplier-shutdown.html / cyber-incident.html
// so AI analysis output renders bold/table/bullet markdown instead of showing
// the raw ** and | characters (previously this box only escapeHtml()'d the text).
function renderEngineOutput(text) {
  if(!text) return '';
  const clean = text.replace(/KPI_JSON:\s*\{[^}]*\}\n*/i, '').trim();
  const lines = clean.split('\n');
  const isTableSep = l => /^\s*\|?[\s:|-]+\|?\s*$/.test(l) && l.includes('-');
  const inlineFmt = s => escapeHtml(s).replace(/&lt;br\s*\/?&gt;/gi, '<br>').replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  const tables = [];
  const outLines = [];
  let i = 0;
  while (i < lines.length) {
    const line = lines[i];
    if (/^\s*\|.*\|\s*$/.test(line) && lines[i + 1] !== undefined && isTableSep(lines[i + 1])) {
      const headers = line.trim().replace(/^\||\|$/g, '').split('|').map(c => c.trim());
      let t = '<table class="md-table"><thead><tr>' + headers.map(c => `<th>${inlineFmt(c)}</th>`).join('') + '</tr></thead><tbody>';
      i += 2;
      while (i < lines.length && /^\s*\|.*\|\s*$/.test(lines[i])) {
        const cells = lines[i].trim().replace(/^\||\|$/g, '').split('|').map(c => c.trim());
        t += '<tr>' + cells.map(c => `<td>${inlineFmt(c)}</td>`).join('') + '</tr>';
        i++;
      }
      t += '</tbody></table>';
      outLines.push(`@@TABLE${tables.length}@@`);
      tables.push(t);
      continue;
    }
    outLines.push(line);
    i++;
  }
  let html = escapeHtml(outLines.join('\n'));
  html = html.replace(/&lt;br\s*\/?&gt;/gi, '<br>');
  html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  html = html.replace(/^▸\s*(.+)$/gm, '<div style="margin:4px 0">▸ $1</div>');
  html = html.replace(/^(\d+)\.\s+(.+)$/gm, '<div style="margin:4px 0 4px 8px"><strong>$1.</strong> $2</div>');
  html = html.replace(/\n{2,}/g, '<br><br>').replace(/\n/g, '<br>');
  tables.forEach((t, idx) => { html = html.replace(`@@TABLE${idx}@@`, t); });
  return html;
}

render();
loadHitlStats();
setInterval(loadHitlStats, 20000);
window.addEventListener('storage', e => { if(e.key === RELAY_KEY_FALLBACK || e.key === 'TSM_EVENT_LOG') render(); });
window.addEventListener('TSM_RELAY_EVENT', e => { if(e.detail && e.detail.domain === CFG.domain) render(); });
</script>
