<style>
:root{
  --bg:#050a0f;--bg2:#0a1020;--bg3:#0d1528;
  --cyan:#00d4d4;--amber:#f5a623;--green:#22c55e;
  --red:#ef4444;--purple:#a855f7;--blue:#3b82f6;
  --orange:#f97316;--gold:#c9a84c;--text:#e2e8f0;--muted:#64748b;--border:#1e293b;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);color:var(--text);font-family:'Rajdhani',sans-serif;min-height:100vh;padding-bottom:60px;}
.topbar{height:42px;background:#020810;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 20px;}
.tb-brand{font-family:'Orbitron',sans-serif;font-size:.7rem;color:var(--gold);letter-spacing:.15em;}
.tb-stat{font-family:'JetBrains Mono',monospace;font-size:.65rem;color:var(--muted);}
.tb-stat span{color:var(--green);}
.tb-time{font-family:'Orbitron',sans-serif;font-size:.75rem;color:var(--gold);}
.nav-tabs{display:flex;align-items:center;background:var(--bg2);border-bottom:1px solid var(--border);padding:0 20px;gap:2px;}
.nav-tab{padding:10px 18px;font-family:'Orbitron',sans-serif;font-size:.58rem;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;letter-spacing:.08em;transition:.2s;}
.nav-tab:hover{color:var(--text);}
.nav-tab.active{color:var(--gold);border-bottom-color:var(--gold);}
.hdr{padding:18px 24px;border-bottom:1px solid var(--border);background:var(--bg2);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;}
.hdr-title{font-family:'Orbitron',sans-serif;font-size:1rem;letter-spacing:.08em;color:var(--text);}
.hdr-sub{font-family:'JetBrains Mono',monospace;font-size:.65rem;color:var(--muted);margin-top:4px;}
.hdr-badge{padding:4px 12px;border-radius:3px;font-family:'Orbitron',sans-serif;font-size:.6rem;letter-spacing:.1em;border:1px solid var(--gold);color:var(--gold);background:rgba(201,168,76,.1);}
.hdr-btns{display:flex;gap:8px;flex-wrap:wrap;}
.hbtn{background:var(--bg3);border:1px solid var(--border);color:var(--text);font-family:'JetBrains Mono',monospace;font-size:.62rem;padding:8px 14px;border-radius:4px;cursor:pointer;text-decoration:none;display:inline-block;}
.hbtn:hover{border-color:var(--gold);color:var(--gold);}
.hbtn.primary{border-color:var(--gold);color:var(--gold);}
.wrap{max-width:1100px;margin:0 auto;padding:20px 24px;}
.empty{text-align:center;padding:80px 20px;}
.empty h2{font-family:'Orbitron',sans-serif;font-size:.9rem;color:var(--muted);letter-spacing:.08em;margin-bottom:14px;}
.empty p{font-family:'JetBrains Mono',monospace;font-size:.7rem;color:var(--muted);margin-bottom:24px;}
.kpi-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:20px;}
.kpi{background:var(--bg2);border:1px solid var(--border);border-radius:6px;padding:16px;text-align:center;}
.kpi-val{font-family:'Orbitron',sans-serif;font-size:1.3rem;font-weight:700;color:var(--gold);}
.kpi-val.red{color:var(--red);}.kpi-val.green{color:var(--green);}.kpi-val.cyan{color:var(--cyan);}.kpi-val.amber{color:var(--amber);}
.kpi-lbl{font-size:.6rem;color:var(--muted);margin-top:6px;font-family:'JetBrains Mono',monospace;letter-spacing:.08em;}
.sec{background:var(--bg2);border:1px solid var(--border);border-radius:6px;padding:18px;margin-bottom:16px;}
.sec-hdr{font-family:'Orbitron',sans-serif;font-size:.68rem;color:var(--gold);letter-spacing:.12em;margin-bottom:14px;display:flex;align-items:center;gap:8px;}
.sec-hdr::before{content:'\25C6';font-size:.55rem;}
.ai-box{background:rgba(201,168,76,.06);border:1px solid var(--gold);border-radius:6px;padding:22px;margin-bottom:16px;white-space:pre-wrap;font-size:.95rem;line-height:1.6;}
.ai-box strong{color:var(--gold);font-family:'Orbitron',sans-serif;font-size:.65rem;letter-spacing:.1em;display:block;margin-bottom:10px;}
.ai-box table.md-table,.eng-mini-body table.md-table{border-collapse:collapse;width:100%;margin:8px 0;white-space:normal;}
.ai-box table.md-table th,.ai-box table.md-table td,.eng-mini-body table.md-table th,.eng-mini-body table.md-table td{border:1px solid var(--border);padding:4px 6px;text-align:left;vertical-align:top;}
.ai-box table.md-table th,.eng-mini-body table.md-table th{color:var(--muted);text-transform:uppercase;font-size:.6rem;}
.other-engines{margin-top:10px;}
.other-engines summary{cursor:pointer;font-family:'JetBrains Mono',monospace;font-size:.65rem;color:var(--muted);padding:8px 0;}
.other-engines summary:hover{color:var(--text);}
.eng-mini{padding:10px 0;border-top:1px solid var(--border);}
.eng-mini-title{font-family:'Orbitron',sans-serif;font-size:.6rem;color:var(--amber);letter-spacing:.05em;margin-bottom:6px;}
.eng-mini-body{font-family:'JetBrains Mono',monospace;font-size:.65rem;color:var(--muted);white-space:pre-wrap;line-height:1.6;}
.no-items{font-family:'JetBrains Mono',monospace;font-size:.7rem;color:var(--muted);}
.explain-panel{background:var(--bg2);border:1px solid var(--border);border-left:2px solid var(--amber);border-radius:6px;padding:14px 18px;margin-bottom:16px;}
.explain-title{font-family:'Orbitron',sans-serif;font-size:.62rem;color:var(--amber);letter-spacing:.1em;margin-bottom:10px;}
.explain-row{padding:6px 0;border-top:1px solid var(--border);}
.explain-row:first-of-type{border-top:none;}
.explain-node{font-family:'Orbitron',sans-serif;font-size:.6rem;color:var(--cyan);letter-spacing:.05em;margin-right:10px;}
.explain-score{font-family:'JetBrains Mono',monospace;font-size:.65rem;color:var(--text);}
.explain-text{font-family:'JetBrains Mono',monospace;font-size:.62rem;color:var(--muted);margin-top:3px;line-height:1.5;}
.toast{position:fixed;bottom:20px;right:20px;background:var(--bg2);border:1px solid var(--gold);color:var(--gold);padding:10px 18px;border-radius:4px;font-family:'JetBrains Mono',monospace;font-size:.65rem;opacity:0;pointer-events:none;transition:.3s;z-index:50;}
.toast.show{opacity:1;transform:translateY(-4px);}
.action-bar{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px;}
.abtn{font-family:'Orbitron',sans-serif;font-size:.65rem;letter-spacing:.08em;padding:10px 18px;border-radius:4px;cursor:pointer;border:1px solid var(--border);background:var(--bg3);color:var(--text);}
.abtn.approve{border-color:var(--green);color:var(--green);}
.abtn.escalate{border-color:var(--red);color:var(--red);}
.abtn:hover{opacity:.85;}

<script>
function tick(){document.getElementById('clock').textContent=new Date().toLocaleTimeString();}
setInterval(tick,1000);tick();

const RELAY_KEY = 'TSM_HONEYWELL_EXEC_RELAY';

const SOURCE_META = {
  plant:    { label: 'PLANT — OPERATIONS INCIDENT',     icon: '⚡', color: 'var(--orange)' },
  cyber:    { label: 'CYBER — SECURITY INCIDENT',        icon: '🛡', color: 'var(--red)' },
  supplier: { label: 'SUPPLIER SHUTDOWN — SUPPLY CHAIN', icon: '📦', color: 'var(--amber)' },
  bess:     { label: 'BESS/GIGAFACTORY — THERMAL EVENT', icon: '🔋', color: 'var(--red)' },
  detection:{ label: 'ADVANCED DETECTION — PRE-ALARM',   icon: '📡', color: 'var(--amber)' },
  healthcare:{ label: 'HEALTHCARE — THERMAL CONTINUITY', icon: '🏥', color: 'var(--green)' },
  aerospace:{ label: 'AEROSPACE — MAINTENANCE READINESS', icon: '✈', color: 'var(--blue)' },
  lifesciences:{ label: 'LIFE SCIENCES — PRODUCTION CONTINUITY', icon: '🧪', color: 'var(--green)' },
  capitalproject:{ label: 'CAPITAL PROJECT — RECOVERY', icon: '🏗', color: 'var(--amber)' }
};

function showToast(msg, isErr){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.toggle('err', !!isErr); t.classList.add('show');
  clearTimeout(showToast._h);
  showToast._h=setTimeout(()=>t.classList.remove('show'),2500);
}

// Was 'no downstream write in this demo build' -- now a real, persisted
// audit entry via TSMAuditEngine -> POST /api/governance/audit. No
// logged-in-user identity on this page (no session/auth wired here), so
// actor is the page identity itself, same convention used elsewhere for
// unauthenticated pages -- not a fabricated person.
function recordExecutiveAction(action, note){
  if(window.TSMAuditEngine){
    TSMAuditEngine.record({
      actor: 'honeywell-executive-portal',
      action: action,
      resource: 'HONEYWELL',
      vertical: 'honeywell'
    });
  }
  showToast(note);

  // Also record to the real server-side HITL decision log (server.js:
  // /api/exec-portal/honeywell/decide), same pattern as Mortgage/PM
  // Copilot/Legal/Construction. Plant/Supplier/Cyber-OT share this one
  // portal, so the incident type (data.source, set by the war room that
  // relayed here) is folded into the decision text rather than the
  // vertical key -- the gate itself has no per-incident-type slot.
  // Verdict mapping: AUTHORIZED = executive signs off ('approved');
  // BOARD_NOTIFIED = escalated up rather than accepted as-is ('rejected')
  // -- a deliberate two-button-to-gate-vocabulary mapping, not a literal
  // rejection claim.
  const relay = loadRelay();
  const incidentType = (relay && relay.source) ? relay.source : 'UNKNOWN';
  const verdict = action === 'AUTHORIZED' ? 'approved' : 'rejected';
  fetch('/api/exec-portal/honeywell/decide', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ index: Date.now(), verdict, text: `[${incidentType}] ${note}`, actor: 'Executive', tenantId: (typeof TSMActiveMember !== 'undefined' && TSMActiveMember) ? TSMActiveMember.getId() : null })
  }).catch(() => { /* offline/unreachable -- action still logged to audit trail above */ });
}

function loadRelay(){
  try{
    const raw = localStorage.getItem(RELAY_KEY) || sessionStorage.getItem(RELAY_KEY);
    return raw ? JSON.parse(raw) : null;
  }catch(e){ return null; }
}

function manualRefresh(){
  const data = loadRelay();
  if(!data){ showToast('No escalation found yet.', true); render(); return; }
  render();
  showToast('Pulled latest escalation.');
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// Ported from plant-incident.html / supplier-shutdown.html / cyber-incident.html
// so escalated engine output (dispatch text + the collapsed other-engines list)
// renders the same way here as it did in the war room — previously this page
// only escapeHtml()'d the raw text, leaving **bold** and pipe-table syntax
// visible as literal characters instead of rendering.
function renderEngineOutput(text) {
  if(!text) return '';
  const clean = text.replace(/KPI_JSON:\s*\{[^}]*\}\n*/i, '').trim();
  const lines = clean.split('\n');
  const isTableSep = l => /^\s*\|?[\s:|-]+\|?\s*$/.test(l) && l.includes('-');
  const inlineFmt = s => escapeHtml(s).replace(/&lt;br\s*\/?&gt;/gi, '<br>').replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  const tables = [];
  const outLines = [];
  let i = 0;
  while (i < lines.length) {
    const line = lines[i];
    if (/^\s*\|.*\|\s*$/.test(line) && lines[i + 1] !== undefined && isTableSep(lines[i + 1])) {
      const headers = line.trim().replace(/^\||\|$/g, '').split('|').map(c => c.trim());
      let t = '<table class="md-table"><thead><tr>' + headers.map(c => `<th>${inlineFmt(c)}</th>`).join('') + '</tr></thead><tbody>';
      i += 2;
      while (i < lines.length && /^\s*\|.*\|\s*$/.test(lines[i])) {
        const cells = lines[i].trim().replace(/^\||\|$/g, '').split('|').map(c => c.trim());
        t += '<tr>' + cells.map(c => `<td>${inlineFmt(c)}</td>`).join('') + '</tr>';
        i++;
      }
      t += '</tbody></table>';
      outLines.push(`@@TABLE${tables.length}@@`);
      tables.push(t);
      continue;
    }
    outLines.push(line);
    i++;
  }
  let html = escapeHtml(outLines.join('\n'));
  html = html.replace(/&lt;br\s*\/?&gt;/gi, '<br>');
  html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  html = html.replace(/^▸\s*(.+)$/gm, '<div style="margin:4px 0">▸ $1</div>');
  html = html.replace(/^(\d+)\.\s+(.+)$/gm, '<div style="margin:4px 0 4px 8px"><strong>$1.</strong> $2</div>');
  html = html.replace(/\n{2,}/g, '<br><br>').replace(/\n/g, '<br>');
  tables.forEach((t, idx) => { html = html.replace(`@@TABLE${idx}@@`, t); });
  return html;
}

// Safety net: normalizes exposure figures that were saved to localStorage
// before this fix (e.g. from an earlier demo run) as well as any future
// model slip -- covers this tile's display.
function tsmNormalizeExposurePair(lo, hi){
  const bothPresent = lo != null && hi != null;
  if(bothPresent && lo > 0 && hi > 0 && lo < 1000 && hi < 1000){
    return [lo * 1e6, hi * 1e6];
  }
  return [lo, hi];
}
function kpiExposure(k){
  if(!k) return '—';
  if(k.totalExposureLow || k.totalExposureHigh){
    const [lo,hi]=tsmNormalizeExposurePair(k.totalExposureLow, k.totalExposureHigh);
    const fmt=n=>'$'+Number(n).toLocaleString();
    return (lo && hi && lo!==hi) ? `${fmt(lo)}–${fmt(hi)}` : fmt(hi||lo);
  }
  if(k.raw) return k.raw;
  return '—';
}

function kpiSecondary(k){
  if(!k) return '—';
  if(typeof k.bufferDays === 'number') return k.bufferDays + ' days';
  if(k.containmentEta) return k.containmentEta;
  if(k.downtimeEstimate) return k.downtimeEstimate;
  if(k.leadTimeEstimate) return k.leadTimeEstimate;
  if(k.raw) return k.raw;
  return '—';
}

function kpiTertiary(k){
  if(!k) return '—';
  if(typeof k.ordersAtRisk === 'number') return k.ordersAtRisk + ' orders';
  if(typeof k.riskScore === 'number') return k.riskScore + '/100';
  if(k.raw) return k.raw;
  return '—';
}

function secondaryLabel(source){
  if(source==='supplier') return 'BUFFER';
  if(source==='cyber') return 'CONTAINMENT ETA';
  return 'DOWNTIME';
}

function tertiaryLabel(source){
  if(source==='supplier') return 'ORDERS AT RISK';
  return 'RISK SCORE';
}

// Renders the BNCA exposure projection the strategist computed and forwarded
// via payload.bnca_exposure — this page never recomputes it, only displays
// what was relayed. Mirrors honeywell-strategist.html's renderHoneywellBNCA().
function hwMoney(n){ return '$' + Math.round(Number(n) || 0).toLocaleString(); }

// Mirrors honeywell-strategist.html's panel of the same name — the
// strategist now forwards every domain that was active at escalation time
// (data.allDomains) instead of just the one it happened to have open, so
// this page can show the executive the same full picture rather than only
// the single most-recent incident.
function renderActiveDomainsPanel(allEntries){
  if(!allEntries || !allEntries.length) return '';
  const rows = allEntries.map(d => {
    const meta = SOURCE_META[d.source] || { label: (d.source||'UNKNOWN').toUpperCase(), icon:'◆', color:'var(--gold)' };
    const exp = kpiExposure((d.kpis||{}).exposure);
    const when = d.timestamp ? new Date(d.timestamp).toLocaleString() : 'unknown time';
    return `<tr>
      <td style="color:${meta.color}">${meta.icon} ${escapeHtml(meta.label)}</td>
      <td>${escapeHtml(exp)}</td>
      <td class="no-items" style="padding:0">${escapeHtml(when)}</td>
    </tr>`;
  }).join('');
  return `<div class="sec"><div class="sec-hdr">DOMAINS AT ESCALATION TIME (${allEntries.length})</div>
    <table class="md-table"><thead><tr><th>DOMAIN</th><th>EXPOSURE</th><th>RELAYED</th></tr></thead>
    <tbody>${rows}</tbody></table></div>`;
}
function renderHoneywellBNCA(bnca){
  if(!bnca) return '';
  if(bnca.unavailable){
    return `<div class="sec"><div class="sec-hdr">BNCA EXPOSURE PROJECTION</div><div class="no-items">${escapeHtml(bnca.reason || 'Exposure projection unavailable.')}</div></div>`;
  }
  return `<div class="sec"><div class="sec-hdr">BNCA EXPOSURE PROJECTION</div>
    <div class="kpi-row">
      <div class="kpi"><div class="kpi-val cyan">${hwMoney(bnca.currentExposure)}</div><div class="kpi-lbl">CURRENT EXPOSURE</div></div>
      <div class="kpi"><div class="kpi-val green">${hwMoney(bnca.ifActed.exposure)}</div><div class="kpi-lbl">IF ACTED</div></div>
      <div class="kpi"><div class="kpi-val red">${hwMoney(bnca.ifIgnored.exposure)}</div><div class="kpi-lbl">IF IGNORED</div></div>
    </div><div class="no-items" style="margin-top:8px">${escapeHtml(bnca.urgencyWindow || '')}</div></div>`;
}

// Grounded in the actual relay payload shape (data.kpis.*, data.outputs) — this
// payload carries no confidence/ML score field, so this cites which structured
// field each KPI came from and which war room wrote it, rather than fabricating
// a confidence number. Mirrors honeywell-strategist.html's version.
//
// Roadmap #9 (Delivery Package) — extended additively: each item now also
// carries the shared {claim, severity, rationale, dataPoints, sources, id}
// fields alongside the original {label, value, explain} this page's own
// renderExplainItems() already reads. severity is always 'high' for every
// item on this page — none of the source engines (plant/cyber/supplier)
// emit a real severity field into the KPI payload, and these are executive-
// escalated incidents by definition (that's the only reason they reached
// this portal), so 'high' is grounded in what escalation to this page
// already means rather than an invented dollar threshold.
function getExplainItems(data){
  const items = [];
  const k = data.kpis || {};
  const src = data.source || 'unknown';
  const srcLabel = SOURCE_META[src] ? SOURCE_META[src].label : src.toUpperCase();

  const exposureVal = kpiExposure(k.exposure);
  if (exposureVal !== '—') {
    const explain = `Read directly from kpis.exposure in the ${srcLabel} relay payload${data.docType ? ' (source doc type: ' + data.docType + ')' : ''} — not recomputed on this page.`;
    items.push({
      label: 'FINANCIAL EXPOSURE',
      value: exposureVal,
      explain: explain,
      id: 'honeywell-' + src + '-exposure',
      claim: 'FINANCIAL EXPOSURE: ' + exposureVal,
      severity: 'high',
      rationale: explain,
      dataPoints: [{ key: 'kpis.exposure', value: exposureVal }],
      sources: [srcLabel]
    });
  }

  const secKpi = k.buffer || k.containment;
  const secVal = kpiSecondary(secKpi);
  if (secVal !== '—') {
    const secField = k.buffer ? 'buffer.bufferDays' : 'containment';
    const explain = `Read directly from kpis.${secField} as written by the ${srcLabel} war room.`;
    items.push({
      label: secondaryLabel(src),
      value: secVal,
      explain: explain,
      id: 'honeywell-' + src + '-secondary',
      claim: secondaryLabel(src) + ': ' + secVal,
      severity: 'high',
      rationale: explain,
      dataPoints: [{ key: 'kpis.' + secField, value: secVal }],
      sources: [srcLabel]
    });
  }

  const terKpi = k.orders || k.risk;
  const terVal = kpiTertiary(terKpi);
  if (terVal !== '—') {
    const terField = k.orders ? 'orders.ordersAtRisk' : 'risk.riskScore';
    const explain = `Read directly from kpis.${terField} as written by the ${srcLabel} war room.`;
    items.push({
      label: tertiaryLabel(src),
      value: terVal,
      explain: explain,
      id: 'honeywell-' + src + '-tertiary',
      claim: tertiaryLabel(src) + ': ' + terVal,
      severity: 'high',
      rationale: explain,
      dataPoints: [{ key: 'kpis.' + terField, value: terVal }],
      sources: [srcLabel]
    });
  }

  if (data.outputs && data.outputs.length) {
    const explain = `The KPI figures above are the war room's own computation across its 6-engine pipeline, escalated as-is by the strategist — this page displays them without re-scoring.`;
    items.push({
      label: '6-ENGINE ANALYSIS',
      value: data.outputs.length + ' engine output' + (data.outputs.length === 1 ? '' : 's'),
      explain: explain,
      id: 'honeywell-' + src + '-engine-analysis',
      claim: '6-ENGINE ANALYSIS: ' + data.outputs.length + ' engine output' + (data.outputs.length === 1 ? '' : 's'),
      severity: 'high',
      rationale: explain,
      dataPoints: [{ key: 'outputs.length', value: data.outputs.length }],
      sources: [srcLabel]
    });
  }

  return items;
}

function renderExplainItems(items){
  if (!items.length) return '';
  return `<div class="explain-panel">
    <div class="explain-title">WHY THESE NUMBERS</div>
    ${items.map(it => `<div class="explain-row">
      <span class="explain-node">${escapeHtml(it.label)}</span>
      <span class="explain-score">${escapeHtml(it.value)}</span>
      <div class="explain-text">${escapeHtml(it.explain)}</div>
    </div>`).join('')}
  </div>`;
}

// ===== TSM MEMORY: REGISTER CROSS-MODULE ANOMALIES =====
// This page did NOT load tsm-memory-engine.js at all before this change (no
// TSMMemory usage anywhere in the file) -- added the script include below,
// plus a new 'honeywell' sector branch to tsm-memory-engine.js's
// detectSector()/DEFAULTS (previously unrecognized, would have fallen
// through to 'executive'). registerAnomaly() fires from render(), the real
// relay-parsing function, off the same data.kpis figures the KPI row just
// rendered -- not a static mirror, since this page shows "no escalation
// received" until a strategist relay actually arrives. One exposure anomaly
// per source (plant/cyber/supplier) plus a secondary anomaly when the
// buffer/containment/risk KPI signals urgency. Self-dedupes by anomalyCode
// (keyed to source) against the shared TSM_OPERATIONAL_MEMORY_V3 store so
// repeat renders (storage events) don't pile up duplicates.
function registerHoneywellAnomalies(data){
  if(!window.TSMMemory || typeof window.TSMMemory.registerAnomaly !== 'function' || !data) return;

  function alreadyOpen(code){
    try{
      const all = JSON.parse(localStorage.getItem('TSM_OPERATIONAL_MEMORY_V3') || '{}');
      const bucket = all.honeywell;
      return !!(bucket && Array.isArray(bucket.anomalies) &&
        bucket.anomalies.some(a => a.anomalyCode === code && a.status === 'open'));
    }catch(e){ return false; }
  }
  function fire(a){
    if(alreadyOpen(a.anomalyCode)) return;
    window.TSMMemory.registerAnomaly(a);
  }

  const src = data.source || 'unknown';
  const meta = SOURCE_META[src] || { label: src.toUpperCase() };
  const k = data.kpis || {};
  const codeSrc = src.toUpperCase();

  const exposureStr = kpiExposure(k.exposure);
  if(exposureStr !== '—'){
    const severity = (src === 'cyber' || src === 'bess' || src === 'healthcare' || src === 'lifesciences') ? 'CRITICAL' : (src === 'plant' || src === 'aerospace' || src === 'capitalproject' ? 'HIGH' : 'MEDIUM');
    fire({
      entityType: 'honeywell-incident', entityId: src,
      anomalyCode: 'HW_' + codeSrc + '_EXPOSURE', severity,
      title: `${meta.label} — ${exposureStr} exposure escalated to executive`,
      source: 'honeywell-executive-portal',
      meta: { exposure: k.exposure, incidentSource: src }
    });
  }

  const secKpi = k.buffer || k.containment;
  const secVal = kpiSecondary(secKpi);
  if(secVal !== '—'){
    fire({
      entityType: 'honeywell-incident', entityId: src,
      anomalyCode: 'HW_' + codeSrc + '_' + (k.buffer ? 'BUFFER' : 'CONTAINMENT'), severity: (src === 'cyber' || src === 'bess' || src === 'healthcare' || src === 'lifesciences') ? 'HIGH' : 'MEDIUM',
      title: `${meta.label} — ${secondaryLabel(src)} at ${secVal}`,
      source: 'honeywell-executive-portal',
      meta: { value: secKpi, incidentSource: src }
    });
  }

  const terKpi = k.orders || k.risk;
  const terVal = kpiTertiary(terKpi);
  if(terVal !== '—' && src === 'supplier'){
    fire({
      entityType: 'honeywell-incident', entityId: src,
      anomalyCode: 'HW_' + codeSrc + '_ORDERS_AT_RISK', severity: 'MEDIUM',
      title: `${meta.label} — ${terVal} at risk`,
      source: 'honeywell-executive-portal',
      meta: { value: terKpi, incidentSource: src }
    });
  }
}

function renderEmpty(){
  document.getElementById('hdrBadge').style.display='none';
  document.getElementById('hdrSub').textContent='Awaiting escalation from the strategist…';
  document.getElementById('wrap').innerHTML = `
    <div class="empty">
      <h2>NO ESCALATION RECEIVED</h2>
      <p>Once a strategist escalates an incident, its executive dispatch will appear here automatically.</p>
      <div class="hdr-btns" style="justify-content:center;">
        <a class="hbtn primary" href="/html/war-rooms/honeywell-strategist.html">→ Go to Strategist</a>
      </div>
    </div>`;
}

// ===== EXCEPTION / CASE QUEUE FEED — Roadmap #10 Case Engine =====
// Different shape than the other verticals: Honeywell escalates ONE
// incident at a time (Plant / Cyber / Supplier), not a batch list of
// many SLA-breaching items. So this feeds a single exception per
// escalation rather than looping a fin.*_exposure_items array. Dedupe
// key is source + escalation timestamp (a re-escalation of the same
// incident type at a new time is a genuinely new exception). Severity
// and fields mirror registerHoneywellAnomalies() above exactly -- no
// new data invented, same k.exposure/buffer/containment/orders/risk
// figures already rendered in the KPI row and Explain panel.
const _hwFedIds = {};
function hwFeedException(data){
  if (typeof TSMExceptions === 'undefined' || !data) return;

  const src = data.source || 'unknown';
  const meta = SOURCE_META[src] || { label: src.toUpperCase() };
  const k = data.kpis || {};
  const escalatedAt = data.strategistReviewedAt || data.timestamp || 'unknown';
  const fedKey = src + ':' + escalatedAt;
  if (_hwFedIds[fedKey]) return;

  const exposureStr = kpiExposure(k.exposure);
  if (exposureStr === '\u2014') return; // nothing real to escalate as an exception
  _hwFedIds[fedKey] = true;

  const secVal = kpiSecondary(k.buffer || k.containment);
  const severity = (src === 'cyber' || src === 'bess' || src === 'healthcare' || src === 'lifesciences') ? 'high' : (src === 'plant' || src === 'aerospace' || src === 'capitalproject' ? 'high' : 'med');
  const exposureNum = (k.exposure && (k.exposure.totalExposureHigh || k.exposure.totalExposureLow)) || null;

  const exceptionRecord = TSMExceptions.add({
    title: `${meta.label} \u2014 ${exposureStr} exposure escalated to executive`,
    detail: secVal !== '\u2014' ? `${secondaryLabel(src)}: ${secVal}.` : null,
    recommendedAction: 'See Honeywell Executive Portal for the escalated dispatch and full 6-engine analysis.',
    severity, confidence: null, sector: 'honeywell', agentLabel: 'Honeywell Strategist'
  });

  if (typeof TSMCaseManager !== 'undefined' && exceptionRecord) {
    const newCase = TSMCaseManager.createFromException(exceptionRecord, {
      process: 'honeywell_' + src + '_incident_resolution',
      source: 'Honeywell Strategist',
      exposure: exposureNum
    });
    if (newCase) {
      TSMCaseManager.requestApproval(newCase.caseId, { note: 'Auto-requested on case creation from Honeywell exception feed.' });
    }
  }

  if (typeof TSMExceptionWidget !== 'undefined') {
    TSMExceptionWidget.mount('tsm-exception-queue', { sector: 'honeywell' });
  }
  if (typeof TSMCaseWidget !== 'undefined') {
    TSMCaseWidget.mount('tsm-case-queue', { sector: 'honeywell' });
  }
}

// Roadmap #9 -- stashed here so exportClientPackage() (defined below) can
// reuse the exact same explain items render() already computed, rather than
// re-deriving anything. This page has no quality-score engine or document
// counter wired, so qualityScore/documentCount stay undefined -- honest
// nulls in the built package, same convention as insurance-executive-portal.html.
let lastExplainItems = [];
let lastKpis = null;

function render(){
  const data = loadRelay();
  if(!data){ renderEmpty(); return; }

  const meta = SOURCE_META[data.source] || { label: (data.source||'UNKNOWN').toUpperCase(), icon:'◆', color:'var(--gold)' };
  const badge = document.getElementById('hdrBadge');
  badge.style.display='inline-block';
  badge.textContent = `${meta.icon} ${meta.label}`;
  badge.style.borderColor = meta.color;
  badge.style.color = meta.color;

  document.getElementById('hdrSub').textContent = data.strategistReviewedAt
    ? `Escalated by strategist ${new Date(data.strategistReviewedAt).toLocaleString()}`
    : (data.timestamp ? `Relayed ${new Date(data.timestamp).toLocaleString()}` : 'Escalation received');

  // If the strategist escalated with multiple active domains, show the full
  // picture (and its combined exposure) before drilling into the single
  // most-recent incident below — otherwise this falls back to exactly the
  // old single-domain-only behavior for any older escalation still sitting
  // in storage from before this field existed.
  let html = '';
  if(data.allDomains && data.allDomains.length){
    html += renderActiveDomainsPanel(data.allDomains);
    html += `<div class="sec"><div class="sec-hdr">AGGREGATE BNCA — ALL ACTIVE DOMAINS</div></div>`;
    html += renderHoneywellBNCA(data.aggregate_bnca);
    html += `<div class="sec"><div class="sec-hdr">MOST RECENT DOMAIN: ${escapeHtml(meta.label)}</div></div>`;
  }

  const k = data.kpis || {};
  lastKpis = k;
  html += `<div class="kpi-row">
    <div class="kpi"><div class="kpi-val red">${kpiExposure(k.exposure)}</div><div class="kpi-lbl">FINANCIAL EXPOSURE</div></div>
    <div class="kpi"><div class="kpi-val amber">${kpiSecondary(k.buffer || k.containment)}</div><div class="kpi-lbl">${secondaryLabel(data.source)}</div></div>
    <div class="kpi"><div class="kpi-val cyan">${kpiTertiary(k.orders || k.risk)}</div><div class="kpi-lbl">${tertiaryLabel(data.source)}</div></div>
  </div>`;

  const explainItems = getExplainItems(data);
  lastExplainItems = explainItems;
  html += renderExplainItems(explainItems);
  html += renderHoneywellBNCA(data.bnca_exposure);

  registerHoneywellAnomalies(data);
  hwFeedException(data);

  // The last of the 6 engines is always the "Executive Dispatch" summary —
  // that's the headline. Everything else is available below, collapsed.
  const outputs = data.outputs || [];
  const dispatch = outputs.length ? outputs[outputs.length - 1] : null;
  const others = outputs.length > 1 ? outputs.slice(0, -1) : [];

  if(dispatch){
    html += `<div class="ai-box"><strong>EXECUTIVE DISPATCH</strong>${renderEngineOutput(dispatch.text||'')}</div>`;
  } else {
    html += `<div class="sec"><div class="no-items">No executive dispatch in this escalation.</div></div>`;
  }

  if(others.length){
    html += `<div class="sec"><details class="other-engines"><summary>▸ Show full engine analysis (${others.length} prior engines)</summary>`;
    html += others.map(o => `
      <div class="eng-mini">
        <div class="eng-mini-title">ENGINE 0${o.engine} — ${escapeHtml(o.title||'')}</div>
        <div class="eng-mini-body">${renderEngineOutput(o.text||'')}</div>
      </div>`).join('');
    html += `</details></div>`;
  }

  html += `<div class="sec"><div class="sec-hdr">EXECUTIVE ACTIONS</div>
    <div class="action-bar">
      <button class="abtn approve" onclick="recordExecutiveAction('AUTHORIZED', 'Authorized \u2014 logged to audit trail.')">✓ AUTHORIZE RESPONSE</button>
      <button class="abtn escalate" onclick="recordExecutiveAction('BOARD_NOTIFIED', 'Board notification flagged \u2014 logged to audit trail.')">↑ NOTIFY BOARD</button>
      <button class="abtn" onclick="window.location='/html/war-rooms/honeywell-strategist.html'">← BACK TO STRATEGIST</button>
    </div>
  </div>`;

  document.getElementById('wrap').innerHTML = html;
}

// Roadmap #9 -- pure assembly layer, same convention as TSMDeliveryPackage
// itself: nothing computed here, just reuses lastExplainItems already
// produced by render() above and hands it to the engine.
window.exportClientPackage = function () {
  if (!window.TSMDeliveryPackage) {
    showToast('Delivery package engine not loaded.', true);
    return;
  }
  // Real quality score computed from the same explain items the page
  // already rendered — no new data invented, matches the existing
  // fromExplainItems(items, opts) contract (tsm-quality-score-engine.js).
  let qs = (window.TSMQualityScoreEngine && typeof TSMQualityScoreEngine.fromExplainItems === 'function')
    ? TSMQualityScoreEngine.fromExplainItems(lastExplainItems, {})
    : null;
  // Honeywell-only honesty fix: none of the 6 Honeywell engine prompts
  // (supplier-shutdown.html / plant-incident.html / cyber-incident.html)
  // ever ask the model for a per-item confidence figure, so every item
  // getExplainItems() builds has no .confidence field. The shared engine's
  // fromExplainItems() falls back to a flat 60 in that case (see its own
  // "conservative default when nothing self-reports confidence" comment) --
  // that's a real, intentional feature for verticals that DO have a
  // confidence signal, so the shared engine itself is left untouched here.
  // For Honeywell specifically, a flat 60 isn't a measurement, it's a
  // placeholder that looks like data -- so report confidence honestly as
  // unavailable and recompute overall from only the three metrics that
  // are real for this vertical (accuracy/completeness/compliance,
  // reweighted proportionally so they still sum to 100%).
  if (qs && qs.confidence === 60 && !lastExplainItems.some(it => typeof it.confidence === 'number')) {
    const w = { accuracy: 0.30, completeness: 0.25, compliance: 0.25 }; // same weights as the shared engine, confidence weight (0.20) dropped
    const wSum = w.accuracy + w.completeness + w.compliance; // 0.80
    const overall = Math.round(
      (qs.accuracy * w.accuracy + qs.completeness * w.completeness + qs.compliance * w.compliance) / wSum
    );
    qs = Object.assign({}, qs, {
      overall: overall,
      confidence: null,
      confidenceUnavailable: true // no per-item confidence signal exists for this vertical
    });
  }
  // Same exposure object hwFeedException() already parses via exposureNum
  // (line ~544) -- reused here so financialExposure stops coming back null.
  // BUGFIX: this previously read exposure.totalExposureHigh directly, which
  // is the raw stored value (e.g. 7.85) -- the same raw shape kpiExposure()
  // runs through tsmNormalizeExposurePair() before display. Without that
  // same normalization here, the exported executiveSummary.whyItMatters
  // .financialExposure came back as the bare 7.85 instead of 7850000, even
  // after the KPI row and structuredData item both displayed correctly.
  const exposure = lastKpis && lastKpis.exposure;
  const [normLo, normHi] = exposure
    ? tsmNormalizeExposurePair(exposure.totalExposureLow, exposure.totalExposureHigh)
    : [null, null];
  const estimatedImpactTotal = typeof normHi === 'number'
    ? normHi
    : (typeof normLo === 'number' ? normLo : null);
  const missionQueueSummary = estimatedImpactTotal != null
    ? { estimatedImpactTotal: estimatedImpactTotal, unestimatedCount: 0 }
    : null; // honest null if no exposure figure was ever relayed
  const pkg = TSMDeliveryPackage.build({
    domain: 'Honeywell',
    explainItems: lastExplainItems,
    documentCount: Array.isArray(lastExplainItems) ? lastExplainItems.length : null,
    qualityScore: qs,
    missionQueueSummary: missionQueueSummary
  });
  const blob = new Blob([JSON.stringify(pkg, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'tsm-client-package-' + Date.now() + '.json';
  a.click();
};

render();
window.addEventListener('storage', e => { if(e.key === RELAY_KEY) render(); });
