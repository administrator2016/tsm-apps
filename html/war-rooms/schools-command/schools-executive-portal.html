<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TSM &middot; Schools Command Center Executive Portal</title>
<style>
:root{
  --bg:#07101c;--panel:#0d1a2b;--panel2:#0a1520;--border:#1a3050;
  --text:#e0eaf5;--muted:#5a7a99;--teal:#14b8a6;
  --gold:#f59e0b;--red:#ef4444;--green:#10b981;--blue:#3b82f6;
  --purple:#a78bfa;--orange:#f97316;--pink:#ec4899;
  --mono:'Courier New',monospace;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;min-height:100vh;padding-bottom:60px;}
.topbar{height:42px;background:#050d18;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 20px;}
.tb-brand{font-family:var(--mono);font-size:.7rem;color:var(--gold);letter-spacing:.15em;}
.tb-time{font-family:var(--mono);font-size:.75rem;color:var(--gold);}
.hdr{padding:18px 24px;border-bottom:1px solid var(--border);background:var(--panel);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;}
.hdr-title{font-size:1.05rem;font-weight:700;letter-spacing:.04em;color:#fff;}
.hdr-sub{font-family:var(--mono);font-size:.65rem;color:var(--muted);margin-top:4px;}
.hdr-btns{display:flex;gap:8px;flex-wrap:wrap;}
.hbtn{background:var(--panel2);border:1px solid var(--border);color:var(--text);font-family:var(--mono);font-size:.62rem;padding:8px 14px;border-radius:4px;cursor:pointer;text-decoration:none;display:inline-block;}
.hbtn:hover{border-color:var(--gold);color:var(--gold);}
.hbtn.primary{border-color:var(--gold);color:var(--gold);}
.wrap{max-width:1200px;margin:0 auto;padding:20px 24px;}
.empty{text-align:center;padding:80px 20px;}
.empty h2{font-size:.9rem;color:var(--muted);letter-spacing:.08em;margin-bottom:14px;}
.empty p{font-family:var(--mono);font-size:.7rem;color:var(--muted);margin-bottom:24px;}
.sec{background:var(--panel);border:1px solid var(--border);border-radius:6px;padding:18px;margin-bottom:16px;}
.sec-hdr{font-size:.68rem;color:var(--gold);letter-spacing:.12em;margin-bottom:14px;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;text-transform:uppercase;font-weight:700;}
.sec-hdr .lbl::before{content:'\25C6';font-size:.55rem;margin-right:8px;}
.sec-hdr-note{font-family:var(--mono);font-size:.58rem;color:var(--muted);text-transform:none;letter-spacing:0;font-weight:400;}
.no-items{font-family:var(--mono);font-size:.7rem;color:var(--muted);}
.toast{position:fixed;bottom:20px;right:20px;background:var(--panel);border:1px solid var(--gold);color:var(--gold);padding:10px 18px;border-radius:4px;font-family:var(--mono);font-size:.65rem;opacity:0;pointer-events:none;transition:.3s;z-index:50;}
.toast.show{opacity:1;transform:translateY(-4px);}

.fin-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-bottom:16px;}
.fin-card{background:var(--panel);border:1px solid var(--border);border-radius:6px;padding:18px;text-align:center;}
.fin-card.hero{border-color:var(--gold);background:rgba(245,158,11,.06);}
.fin-val{font-family:var(--mono);font-size:1.6rem;font-weight:700;color:var(--gold);}
.fin-val.red{color:var(--red);}.fin-val.green{color:var(--green);}.fin-val.blue{color:var(--blue);}
.fin-lbl{font-size:.62rem;color:var(--muted);margin-top:8px;font-family:var(--mono);letter-spacing:.08em;}
.fin-sub{font-size:.58rem;color:var(--muted);margin-top:4px;font-family:var(--mono);}
.model-note{font-family:var(--mono);font-size:.6rem;color:var(--muted);border-top:1px solid var(--border);padding-top:10px;margin-top:6px;}
.meta-row{display:flex;gap:18px;flex-wrap:wrap;font-family:var(--mono);font-size:.6rem;color:var(--muted);margin-top:10px;}
.meta-row span{color:var(--text);}

.funnel{display:flex;flex-direction:column;gap:6px;}
.funnel-row{display:grid;grid-template-columns:150px 1fr 90px 110px;gap:10px;align-items:center;font-size:.75rem;}
.funnel-row .fr-lbl{font-family:var(--mono);font-size:.62rem;color:var(--text);}
.funnel-bar-wrap{background:var(--panel2);border-radius:4px;height:22px;overflow:hidden;position:relative;}
.funnel-bar{height:100%;background:linear-gradient(90deg,var(--gold),var(--orange));display:flex;align-items:center;padding-left:8px;font-family:var(--mono);font-size:.6rem;color:#1a1200;font-weight:700;white-space:nowrap;}
.funnel-bar.empty-bar{background:var(--panel2);}
.fr-hours{font-family:var(--mono);font-size:.62rem;color:var(--muted);text-align:right;}
.fr-exposure{font-family:var(--mono);font-size:.65rem;text-align:right;color:var(--red);font-weight:700;}
.funnel-hdr{display:grid;grid-template-columns:150px 1fr 90px 110px;gap:10px;font-family:var(--mono);font-size:.55rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px;}
.funnel-hdr .align-r{text-align:right;}

.risk-item{display:flex;gap:14px;align-items:flex-start;padding:12px 0;border-bottom:1px solid #0e2236;}
.risk-item:last-child{border-bottom:none;}
.risk-rank{font-family:var(--mono);font-size:1.1rem;font-weight:700;color:var(--gold);width:28px;flex-shrink:0;}
.risk-body{flex:1;}
.risk-title{font-size:.85rem;color:var(--text);margin-bottom:4px;}
.risk-title b{color:var(--red);}
.risk-action{font-family:var(--mono);font-size:.65rem;color:var(--muted);}
.risk-amount{font-family:var(--mono);font-size:1rem;font-weight:700;color:var(--red);white-space:nowrap;}

.action-bar{display:flex;gap:10px;flex-wrap:wrap;margin-top:4px;}
.abtn{font-family:var(--mono);font-size:.65rem;letter-spacing:.08em;padding:10px 18px;border-radius:4px;cursor:pointer;border:1px solid var(--border);background:var(--panel2);color:var(--text);}
.abtn.approve{border-color:var(--green);color:var(--green);}
.abtn.escalate{border-color:var(--red);color:var(--red);}
.abtn:hover{opacity:.85;}
.ai-box{background:rgba(245,158,11,.06);border:1px solid var(--gold);border-radius:6px;padding:22px;margin-bottom:16px;white-space:pre-wrap;font-size:.95rem;line-height:1.55;}
.ai-box table.md-table{border-collapse:collapse;width:100%;margin:8px 0;white-space:normal;}
.ai-box table.md-table th,.ai-box table.md-table td{border:1px solid var(--border);padding:4px 6px;text-align:left;vertical-align:top;}
.ai-box table.md-table th{color:var(--muted);text-transform:uppercase;font-size:.6rem;}
</style>

<script>
function tick(){document.getElementById('clock').textContent=new Date().toLocaleTimeString();}
setInterval(tick,1000);tick();

const DOMAIN = 'SCHOOLS';
const RELAY_KEY_FALLBACK = 'TSM_' + DOMAIN + '_RELAY';

function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  clearTimeout(showToast._h);
  showToast._h=setTimeout(()=>t.classList.remove('show'),2500);
}

// Was 'no downstream write in this demo build' -- now a real, persisted
// audit entry via TSMAuditEngine -> POST /api/governance/audit. No
// logged-in-user identity on this page (no session/auth wired here), so
// actor is the page identity itself, same convention used elsewhere for
// unauthenticated pages -- not a fabricated person.
function recordExecutiveAction(action, note){
  if(window.TSMAuditEngine){
    TSMAuditEngine.record({
      actor: 'schools-executive-portal',
      action: action,
      resource: DOMAIN,
      vertical: 'schools'
    });
  }
  showToast(note);

  // Also record to the real server-side HITL decision log (server.js:
  // /api/exec-portal/schools/decide), same pattern as Mortgage/PM Copilot.
  // Verdict mapping: ACKNOWLEDGED = executive signs off ('approved');
  // ESCALATED = executive pushes it up the chain ('rejected') -- a deliberate
  // two-button-to-gate-vocabulary mapping, not a literal rejection claim.
  const verdict = action === 'ACKNOWLEDGED' ? 'approved' : 'rejected';
  fetch('/api/exec-portal/schools/decide', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ index: Date.now(), verdict, text: note, actor: 'Executive', tenantId: (typeof TSMActiveMember !== 'undefined' && TSMActiveMember) ? TSMActiveMember.getId() : null })
  }).catch(() => { /* offline/unreachable -- action still logged to audit trail above */ });
}

function loadRelay(){
  try {
    if(window.TSM && window.TSM.relay && window.TSM.relay.read){
      const d = window.TSM.relay.read(DOMAIN);
      if(d) return d;
    }
  } catch(e){}
  try {
    const raw = sessionStorage.getItem(RELAY_KEY_FALLBACK) || localStorage.getItem(RELAY_KEY_FALLBACK) || localStorage.getItem('TSM_SCHOOLS_STRATEGIST_RELAY');
    return raw ? JSON.parse(raw) : null;
  } catch(e){ return null; }
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function money(n, currency){
  const sym = (currency === 'USD' || !currency) ? '$' : (currency + ' ');
  return sym + Math.round(n||0).toLocaleString();
}

function renderEmpty(){
  document.getElementById('wrap').innerHTML = `
    <div class="empty">
      <h2>NO DATA RECEIVED</h2>
      <p>Run an analysis in the Schools Command Center, then relay it here.</p>
      <div class="hdr-btns" style="justify-content:center;">
        <a class="hbtn primary" href="schools-command.html">&#127891; Go to Command Center</a>
      </div>
    </div>`;
}

function renderEngineOutput(text) {
  if(!text) return '';
  const clean = text.replace(/KPI_JSON:\s*\{[^}]*\}\n*/i, '').trim();
  const lines = clean.split('\n');
  const isTableSep = l => /^\s*\|?[\s:|-]+\|?\s*$/.test(l) && l.includes('-');
  const inlineFmt = s => escapeHtml(s).replace(/&lt;br\s*\/?&gt;/gi, '<br>').replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  const tables = [];
  const outLines = [];
  let i = 0;
  while (i < lines.length) {
    const line = lines[i];
    if (/^\s*\|.*\|\s*$/.test(line) && lines[i + 1] !== undefined && isTableSep(lines[i + 1])) {
      const headers = line.trim().replace(/^\||\|$/g, '').split('|').map(c => c.trim());
      let t = '<table class="md-table"><thead><tr>' + headers.map(c => `<th>${inlineFmt(c)}</th>`).join('') + '</tr></thead><tbody>';
      i += 2;
      while (i < lines.length && /^\s*\|.*\|\s*$/.test(lines[i])) {
        const cells = lines[i].trim().replace(/^\||\|$/g, '').split('|').map(c => c.trim());
        t += '<tr>' + cells.map(c => `<td>${inlineFmt(c)}</td>`).join('') + '</tr>';
        i++;
      }
      t += '</tbody></table>';
      outLines.push(`@@TABLE${tables.length}@@`);
      tables.push(t);
      continue;
    }
    outLines.push(line);
    i++;
  }
  let html = escapeHtml(outLines.join('\n'));
  html = html.replace(/&lt;br\s*\/?&gt;/gi, '<br>');
  html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  html = html.replace(/^▸\s*(.+)$/gm, '<div style="margin:4px 0">▸ $1</div>');
  html = html.replace(/^(\d+)\.\s+(.+)$/gm, '<div style="margin:4px 0 4px 8px"><strong>$1.</strong> $2</div>');
  html = html.replace(/\n{2,}/g, '<br><br>').replace(/\n/g, '<br>');
  tables.forEach((t, idx) => { html = html.replace(`@@TABLE${idx}@@`, t); });
  return html;
}

/* ---------- Board / superintendent framing helpers ---------- */

function execAction(sev){
  if(sev === 'HIGH') return 'Escalate to program officer now \u2014 deobligation and audit-finding exposure compounding daily.';
  if(sev === 'MEDIUM') return 'Confirm remediation ETA with grants team; escalate if unresolved this week.';
  return 'Monitor \u2014 low board-level exposure at current pace.';
}

// "Strategist reviewed" badge — confirms this payload actually passed
// through schools-strategist.html's stampStrategistReview() rather than
// being read straight off the command center's raw broadcast.
function renderReviewBadge(data){
  if(!data || !data.reviewedAt){
    return '<div class="meta-row"><span style="color:var(--muted)">Awaiting strategist review</span></div>';
  }
  let t;
  try { t = new Date(data.reviewedAt).toLocaleTimeString(); } catch(e){ t = data.reviewedAt; }
  return '<div class="meta-row">Strategist reviewed <span style="color:var(--green)">' + escapeHtml(String(t)) + '</span></div>';
}

function renderFinancials(fin){
  if(!fin) return '';
  const total = fin.total_exposure || 0;
  return `<div class="fin-row">
    <div class="fin-card hero">
      <div class="fin-val">${money(total, fin.currency)}</div>
      <div class="fin-lbl">TOTAL EXPOSURE</div>
      <div class="fin-sub">Funding delay + compliance exposure, current portfolio</div>
    </div>
    <div class="fin-card">
      <div class="fin-val red">${money(fin.funding_delay_exposure_total, fin.currency)}</div>
      <div class="fin-lbl">FUNDING DELAY EXPOSURE</div>
      <div class="fin-sub">${(fin.funding_delay_exposure_items||[]).length} grant file(s) over SLA</div>
    </div>
    <div class="fin-card">
      <div class="fin-val red">${money(fin.compliance_exposure_total, fin.currency)}</div>
      <div class="fin-lbl">COMPLIANCE EXPOSURE</div>
      <div class="fin-sub">${(fin.compliance_exposure_items||[]).length} open exception(s)</div>
    </div>
    <div class="fin-card">
      <div class="fin-val blue">${money(fin.active_award_value, fin.currency)}</div>
      <div class="fin-lbl">ACTIVE AWARD VALUE</div>
      <div class="fin-sub">Total open grant award value in portfolio</div>
    </div>
  </div>
  ${fin.note ? `<div class="model-note">&#9432; ${escapeHtml(fin.note)}</div>` : ''}`;
}

function renderFunnel(wip, fin){
  if(!wip || !wip.length) return '';
  const expByStage = {};
  (fin && fin.funding_delay_exposure_items || []).forEach(it => {
    expByStage[it.stage] = (expByStage[it.stage] || 0) + it.exposure;
  });
  const maxCount = Math.max(1, ...wip.map(s => s.count));
  const rows = wip.map(s => {
    const pct = Math.round((s.count / maxCount) * 100);
    const exposure = expByStage[s.label] || 0;
    return `<div class="funnel-row">
      <div class="fr-lbl">${escapeHtml(s.label)}</div>
      <div class="funnel-bar-wrap"><div class="funnel-bar${s.count===0?' empty-bar':''}" style="width:${Math.max(pct,s.count?12:0)}%">${s.count} file${s.count===1?'':'s'}</div></div>
      <div class="fr-hours">${s.avg_hours_in_stage!==null ? s.avg_hours_in_stage+'h avg' : '&mdash;'}</div>
      <div class="fr-exposure">${exposure>0?money(exposure, fin&&fin.currency):'&mdash;'}</div>
    </div>`;
  }).join('');
  return `<div class="sec">
    <div class="sec-hdr"><span class="lbl">GRANT FILE LIFECYCLE (PIPELINE VIEW)</span><span class="sec-hdr-note">Application &rarr; Agency Review &rarr; Active &rarr; Corrective Action &rarr; Closeout Ready &rarr; Closed/Denied</span></div>
    <div class="funnel-hdr"><span>Stage</span><span>Volume</span><span class="align-r">Avg Time</span><span class="align-r">$ Exposure</span></div>
    <div class="funnel">${rows}</div>
  </div>`;
}

function renderRiskRegister(fin){
  const items = (fin && fin.funding_delay_exposure_items) || [];
  if(!items.length){
    return `<div class="sec"><div class="sec-hdr"><span class="lbl">TOP RISK REGISTER</span></div><div class="no-items">No SLA-breaching exposure right now &mdash; nothing to escalate to the board.</div></div>`;
  }
  const top3 = items.slice(0,3);
  const rows = top3.map((it, idx) => `
    <div class="risk-item">
      <div class="risk-rank">${idx+1}</div>
      <div class="risk-body">
        <div class="risk-title"><b>${escapeHtml(it.stage)}</b> &middot; ${escapeHtml(it.id)} &mdash; ${escapeHtml(it.grantee||'')} (${it.days_over}d over SLA)</div>
        <div class="risk-action">${escapeHtml(execAction(it.days_over > 3 ? 'HIGH' : 'MEDIUM'))}</div>
      </div>
      <div class="risk-amount">${money(it.exposure, fin.currency)}</div>
    </div>`).join('');
  return `<div class="sec">
    <div class="sec-hdr"><span class="lbl">TOP RISK REGISTER</span><span class="sec-hdr-note">ranked by $ exposure</span></div>
    ${rows}
  </div>`;
}

// Roadmap #9 (Delivery Package) — same template as mortgage-executive-
// portal.html, same reused-not-invented severity rule: days_over > 3 =
// 'high' / else 'medium', already grounded on this page in execAction(),
// registerSchoolsAnomalies(), and schFeedExceptions() above. Compliance
// exceptions are always 'high', matching schFeedExceptions()'s existing
// severity: 'high'. active_award_value has no risk framing anywhere in
// this codebase, so it stays honestly unclassified.
function getExplainItems(data){
  const items = [];
  const fin = data.financials || {};

  (fin.funding_delay_exposure_items || []).forEach(it => {
    const sev = it.days_over > 3 ? 'high' : 'medium';
    const explain = `${escapeHtml(it.stage)} \u2014 Grant ${escapeHtml(it.id)} \u2014 ${escapeHtml(it.grantee||'grantee')}, ${it.days_over}d over SLA, ${money(it.exposure, fin.currency)} funding-delay exposure. Read from financials.funding_delay_exposure_items as written by the Schools Command Center.`;
    items.push({
      label: 'FUNDING DELAY \u2014 ' + it.stage,
      value: money(it.exposure, fin.currency),
      explain: explain,
      id: 'schools-funding-delay-' + it.id,
      claim: it.stage + ': Grant ' + it.id + ' ' + it.days_over + 'd over SLA',
      severity: sev,
      rationale: explain,
      dataPoints: [
        { key: 'days_over', value: it.days_over },
        { key: 'exposure', value: it.exposure },
        { key: 'stage', value: it.stage }
      ],
      sources: ['Schools Command Center']
    });
  });

  if ((fin.compliance_exposure_items || []).length) {
    const compItems = fin.compliance_exposure_items;
    const explain = `${compItems.length} open compliance exception(s), ${money(fin.compliance_exposure_total, fin.currency)} total exposure. Read from financials.compliance_exposure_items as written by the Schools Command Center \u2014 same severity convention as schFeedExceptions() below (compliance exceptions are always high).`;
    items.push({
      label: 'COMPLIANCE EXPOSURE',
      value: money(fin.compliance_exposure_total, fin.currency),
      explain: explain,
      id: 'schools-compliance-exposure',
      claim: compItems.length + ' open compliance exception(s)',
      severity: 'high',
      rationale: explain,
      dataPoints: [
        { key: 'count', value: compItems.length },
        { key: 'total', value: fin.compliance_exposure_total }
      ],
      sources: ['Schools Command Center']
    });
  }

  if (fin.active_award_value != null) {
    const explain = 'Read directly from financials.active_award_value, the total open grant award value in the portfolio \u2014 not recomputed on this page.';
    items.push({
      label: 'ACTIVE AWARD VALUE',
      value: money(fin.active_award_value, fin.currency),
      explain: explain,
      id: 'schools-active-award-value',
      claim: 'ACTIVE AWARD VALUE: ' + money(fin.active_award_value, fin.currency),
      // No severity: active_award_value has no risk framing anywhere in
      // this codebase, so left honestly unclassified rather than guessed.
      rationale: explain,
      dataPoints: [{ key: 'active_award_value', value: fin.active_award_value }],
      sources: ['Schools Command Center']
    });
  }

  return items;
}

function renderExplainItems(items){
  if (!items.length) return '';
  return `<div class="sec">
    <div class="sec-hdr"><span class="lbl">WHY THESE NUMBERS</span></div>
    ${items.map(it => `<div class="risk-item">
      <div class="risk-body">
        <div class="risk-title">${escapeHtml(it.label)}</div>
        <div class="risk-action">${escapeHtml(it.explain)}</div>
      </div>
      <div class="risk-amount">${escapeHtml(it.value)}</div>
    </div>`).join('')}
  </div>`;
}

// ===== TSM MEMORY: REGISTER CROSS-MODULE ANOMALIES =====
// Same approach as mortgage's executive portal (same template) -- fires off
// the real relay data just rendered, not a static mirror, since this page
// shows "no active relay" until real Command Center data arrives. Registers
// the #1 SLA-breaching grant file plus a rollup if there are open compliance
// exceptions. Self-dedupes by anomalyCode (keyed to the grant file's own id)
// against the shared TSM_OPERATIONAL_MEMORY_V3 store.
function registerSchoolsAnomalies(fin){
  if (!window.TSMMemory || typeof window.TSMMemory.registerAnomaly !== 'function' || !fin) return;

  function alreadyOpen(code){
    try{
      const all = JSON.parse(localStorage.getItem('TSM_OPERATIONAL_MEMORY_V3') || '{}');
      const bucket = all.schools;
      return !!(bucket && Array.isArray(bucket.anomalies) &&
        bucket.anomalies.some(a => a.anomalyCode === code && a.status === 'open'));
    }catch(e){ return false; }
  }
  function fire(a){
    if (alreadyOpen(a.anomalyCode)) return;
    window.TSMMemory.registerAnomaly(a);
  }

  const items = fin.funding_delay_exposure_items || [];
  if (items.length){
    const top = items[0];
    fire({
      entityType: 'grant-file', entityId: top.id,
      anomalyCode: 'SCH_SLA_BREACH_' + top.id, severity: top.days_over > 3 ? 'HIGH' : 'MEDIUM',
      title: `${top.stage} — Grant ${top.id} — ${top.grantee || 'grantee'} — ${top.days_over}d over SLA`,
      source: 'schools-executive-portal',
      meta: { exposure: top.exposure, currency: fin.currency, daysOver: top.days_over }
    });
  }

  const compItems = fin.compliance_exposure_items || [];
  if (compItems.length){
    fire({
      entityType: 'grant-portfolio', entityId: 'compliance-exceptions',
      anomalyCode: 'SCH_COMPLIANCE_EXCEPTIONS', severity: 'HIGH',
      title: `${compItems.length} open compliance exception(s) — ${money(fin.compliance_exposure_total, fin.currency)} exposure`,
      source: 'schools-executive-portal',
      meta: { count: compItems.length, total: fin.compliance_exposure_total }
    });
  }
}

// ===== EXCEPTION / CASE QUEUE FEED — Roadmap #10 Case Engine =====
// Same pattern as Mortgage/Legal/BPO/Healthcare/Construction/FinOps/
// Insurance: turn the real SLA-breaching grant files and open compliance
// items already shown in the Top Risk Register into TSMExceptions.add()
// records, then TSMCaseManager.createFromException() so each gets a real
// approval/execution/audit lifecycle. No fabricated fields -- everything
// here mirrors fin.funding_delay_exposure_items / compliance_exposure_items,
// the same real relay data renderRiskRegister() already renders.
const _schFedIds = {};
function schFeedExceptions(fin){
  if (typeof TSMExceptions === 'undefined' || !fin) return;
  const items = fin.funding_delay_exposure_items || [];
  let fedAny = false;

  items.forEach(it => {
    if (!it || !it.id) return;
    if (_schFedIds[it.id]) return; // already fed this grant file this pageload
    _schFedIds[it.id] = true;
    fedAny = true;

    const exceptionRecord = TSMExceptions.add({
      title: `${it.stage} \u2014 Grant ${it.id} \u2014 ${it.grantee || 'grantee'} (${it.days_over}d over SLA)`,
      detail: `Funding-delay exposure of ${money(it.exposure, fin.currency)} at the ${it.stage} stage.`,
      recommendedAction: 'See Schools Command Center Executive Portal risk register.',
      severity: it.days_over > 3 ? 'high' : 'med',
      confidence: null,
      sector: 'schools',
      agentLabel: 'Schools Strategist'
    });

    if (typeof TSMCaseManager !== 'undefined' && exceptionRecord) {
      const newCase = TSMCaseManager.createFromException(exceptionRecord, {
        process: 'schools_funding_delay_resolution',
        source: 'Schools Strategist',
        exposure: it.exposure
      });
      if (newCase) {
        TSMCaseManager.requestApproval(newCase.caseId, { note: 'Auto-requested on case creation from Schools exception feed.' });
      }
    }
  });

  const compItems = fin.compliance_exposure_items || [];
  if (compItems.length && !_schFedIds['compliance-exceptions']){
    _schFedIds['compliance-exceptions'] = true;
    fedAny = true;
    const exceptionRecord = TSMExceptions.add({
      title: `${compItems.length} open compliance exception(s) \u2014 ${money(fin.compliance_exposure_total, fin.currency)} exposure`,
      detail: 'See Schools Command Center Executive Portal compliance exposure panel.',
      recommendedAction: 'Route to program officer / grants compliance for review.',
      severity: 'high',
      confidence: null,
      sector: 'schools',
      agentLabel: 'Schools Strategist'
    });
    if (typeof TSMCaseManager !== 'undefined' && exceptionRecord) {
      const newCase = TSMCaseManager.createFromException(exceptionRecord, {
        process: 'schools_compliance_exceptions',
        source: 'Schools Strategist',
        exposure: fin.compliance_exposure_total
      });
      if (newCase) {
        TSMCaseManager.requestApproval(newCase.caseId, { note: 'Auto-requested on case creation from Schools exception feed.' });
      }
    }
  }

  if (!fedAny) return;
  if (typeof TSMExceptionWidget !== 'undefined') {
    TSMExceptionWidget.mount('tsm-exception-queue', { sector: 'schools' });
  }
  if (typeof TSMCaseWidget !== 'undefined') {
    TSMCaseWidget.mount('tsm-case-queue', { sector: 'schools' });
  }
}

// Roadmap #9 -- stashed here so exportClientPackage() (defined below) can
// reuse the exact same explain items render() already computed, rather than
// re-deriving anything. This page has no quality-score engine or document
// counter wired, so qualityScore/documentCount stay undefined -- honest
// nulls in the built package, same convention as insurance-executive-portal.html.
let lastExplainItems = [];

// Roadmap #9 -- render() already reads real financials and grant WIP off
// the relay, but exportClientPackage() only ever forwarded lastExplainItems.
// Hoisted here so the export can pass them through as sections, same
// convention as Mortgage/Healthcare/BPO.
let lastFinancials = null;
let lastGrantWip = null;

function render(){
  const data = loadRelay();
  if(!data){ renderEmpty(); return; }

  document.getElementById('hdrSub').textContent = `Relayed ${data.timestamp ? new Date(data.timestamp).toLocaleString() : '\u2014'}`;

  lastFinancials = data.financials || null;
  lastGrantWip = data.grant_wip || null;

  let html = '';
  html += renderFinancials(data.financials);
  html += renderReviewBadge(data);

  if(data.ai_summary){
    html += `<div class="ai-box"><strong style="color:var(--gold);font-size:.65rem;letter-spacing:.1em;display:block;margin-bottom:8px;">EXECUTIVE RECOMMENDATION</strong>${renderEngineOutput(data.ai_summary)}</div>`;
  }

  const explainItems = getExplainItems(data);
  lastExplainItems = explainItems;
  html += renderExplainItems(explainItems);

  html += renderRiskRegister(data.financials);
  html += renderFunnel(data.grant_wip, data.financials);

  registerSchoolsAnomalies(data.financials);
  schFeedExceptions(data.financials);

  html += `<div class="sec"><div class="sec-hdr"><span class="lbl">EXECUTIVE ACTIONS</span></div>
    <div class="action-bar">
      <button class="abtn approve" onclick="recordExecutiveAction('ACKNOWLEDGED', 'Marked reviewed \u2014 logged to audit trail.')">&#10003; ACKNOWLEDGE</button>
      <button class="abtn escalate" onclick="recordExecutiveAction('ESCALATED', 'Escalation flagged \u2014 notify program officer. Logged to audit trail.')">&#8593; ESCALATE</button>
    </div>
  </div>`;

  document.getElementById('wrap').innerHTML = html;
}

// Deferred to DOMContentLoaded (not called synchronously here) so that
// TSMExceptions/TSMCaseManager/TSMMemory -- all loaded via <script src>
// tags earlier in the body -- are guaranteed available on the very first
// render(), not just on a later storage/TSM_RELAY_EVENT re-render. Same
// pattern used by Mortgage/Legal Executive Portals.
function initRender(){
  render();
  window.addEventListener('storage', e => { if(e.key === RELAY_KEY_FALLBACK || e.key === 'TSM_EVENT_LOG') render(); });
  window.addEventListener('TSM_RELAY_EVENT', e => { if(e.detail && e.detail.domain === DOMAIN) render(); });
}
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', initRender);
} else {
  initRender();
}

// Roadmap #9 -- pure assembly layer, same convention as TSMDeliveryPackage
// itself: nothing computed here, just reuses lastExplainItems already
// produced by render() above and hands it to the engine.
window.exportClientPackage = function () {
  if (!window.TSMDeliveryPackage) {
    showToast('Delivery package engine not loaded.');
    return;
  }
  const _pkgQs = (window.TSMQualityScoreEngine && typeof TSMQualityScoreEngine.fromExplainItems === 'function')
    ? TSMQualityScoreEngine.fromExplainItems(lastExplainItems, {})
    : null;
  const pkg = TSMDeliveryPackage.build({
    domain: 'Schools',
    explainItems: lastExplainItems,
    documentCount: Array.isArray(lastExplainItems) ? lastExplainItems.length : null,
    qualityScore: _pkgQs,
    sections: { financials: lastFinancials, grantWip: lastGrantWip }
  });
  const blob = new Blob([JSON.stringify(pkg, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'tsm-client-package-' + Date.now() + '.json';
  a.click();
};

<div id="tsm-sch-intelligence-v3"></div>

<style id="tsm-sch-intelligence-v3-css">
/* TSM SCHOOLS INTELLIGENCE V3 · ACTION CENTER -- same class names/rules as
   PM Copilot's and Mortgage's exec-portal panels (html/war-rooms/pm-copilot/
   pm-exec-portal.html, html/war-rooms/mortgage/mortgage-executive-portal.html)
   so this inherits the same look with a different id prefix, not a fork. */
.tsm-sch-v3-shell { margin-top: 18px; }
.tsm-sch-v3-header { display:flex; justify-content:space-between; align-items:baseline; margin-bottom:10px; }
.tsm-sch-v3-title { font-family:'Orbitron',sans-serif; font-size:.75rem; letter-spacing:.1em; color:var(--gold); }
.tsm-sch-v3-subtitle { font-family:'JetBrains Mono',monospace; font-size:.68rem; color:var(--muted); }
.tsm-sch-v3-metrics { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-bottom:14px; }
.tsm-sch-v3-metric { border:1px solid rgba(127,127,127,.25); border-radius:8px; padding:8px 10px; }
.tsm-sch-v3-metric-label { font-size:.65rem; color:var(--muted); text-transform:uppercase; letter-spacing:.06em; }
.tsm-sch-v3-metric-value { font-size:1.05rem; font-weight:700; margin-top:2px; }
.tsm-sch-v3-action { display:grid; grid-template-columns:90px 1fr 110px 110px auto; gap:10px; align-items:center;
  padding:8px 6px; border-bottom:1px solid rgba(127,127,127,.15); font-size:.82rem; }
.tsm-sch-v3-priority { font-weight:700; font-size:.72rem; }
.tsm-sch-v3-finding { line-height:1.3; }
.tsm-sch-v3-entity { color:var(--muted); font-size:.72rem; margin-top:2px; }
.tsm-sch-v3-status { font-size:.72rem; opacity:.85; }
.tsm-sch-v3-actions-cell { display:flex; gap:6px; flex-wrap:wrap; }
.tsm-sch-v3-btn { font-size:.78rem; font-weight:600; padding:6px 12px; border-radius:8px;
  border:1px solid rgba(127,127,127,.35); background:rgba(127,127,127,.08); color:inherit; cursor:pointer; }
.tsm-sch-v3-btn:hover { background:rgba(127,127,127,.18); }
.tsm-sch-v3-btn-reject { border-color:rgba(220,60,60,.5); color:#dc3c3c; }
.tsm-sch-v3-btn-verify { border-color:rgba(60,160,90,.5); color:#2f9e5c; }
.tsm-sch-v3-verified-badge { font-size:.82rem; font-weight:700; color:#2f9e5c; }
.tsm-sch-v3-empty { color:var(--muted); font-size:.8rem; padding:10px 0; }
</style>

<script id="tsm-sch-intelligence-v3-script">
(function () {
  'use strict';

  // Mirrors html/war-rooms/mortgage/mortgage-executive-portal.html's V3
  // panel script 1:1 in structure (which itself mirrors PM Copilot's).
  // Difference from Mortgage: Schools' node reports (POST
  // /api/schools/node-report) don't carry exposure/breachCount fields the
  // way Mortgage's do -- only nodeId, nodeLabel, grantIds, severity, kpi.
  // So nodeReportToFinding() below only maps what actually exists on a
  // Schools node report; exposure defaults to 0 until a real grants-system
  // feed populates it (same gap noted in server/schools/portfolio-
  // intelligence.js's header comment). No LLM call happens in this file --
  // findings are handed to the deterministic decision engine server-side
  // via POST /api/schools/intelligence-v3.
  const API = '/api/schools/intelligence-v3';
  const NODE_REPORTS_API = '/api/schools/node-reports';

  async function postJson(url, body) {
    const response = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body || {})
    });
    const data = await response.json().catch(() => ({}));
    if (!response.ok) {
      const err = new Error(data.error || ('HTTP ' + response.status));
      err.data = data;
      throw err;
    }
    return data;
  }

  async function advanceAction(actionId, nextStatus) {
    try {
      await postJson('/api/pm/actions/' + encodeURIComponent(actionId) + '/transition', { nextStatus });
      showToast('Action advanced to ' + nextStatus);
      await load();
    } catch (err) {
      showToast('Transition failed: ' + (err.message || 'error'));
    }
  }

  async function approveAction(actionId) {
    try {
      await postJson('/api/pm/actions/' + encodeURIComponent(actionId) + '/approve', {});
      showToast('Action approved');
      await load();
    } catch (err) {
      showToast('Approval failed: ' + (err.message || 'error'));
    }
  }

  async function rejectAction(actionId) {
    try {
      await postJson('/api/pm/actions/' + encodeURIComponent(actionId) + '/reject', {});
      showToast('Action rejected');
      await load();
    } catch (err) {
      showToast('Rejection failed: ' + (err.message || 'error'));
    }
  }

  async function verifyAction(actionId) {
    const exposureAfterRaw = window.prompt('Exposure after remediation ($, 0 if fully cleared):', '0');
    if (exposureAfterRaw === null) return;
    const exposureAfter = Number(exposureAfterRaw);
    if (!Number.isFinite(exposureAfter) || exposureAfter < 0) {
      showToast('Verification cancelled: exposure must be a non-negative number');
      return;
    }
    const notes = window.prompt('Verification notes (optional):', '') || '';

    try {
      const result = await postJson('/api/pm/actions/verify', {
        actionId,
        verification: { verified: true, exposureAfter, notes }
      });
      if (!result.ok) {
        showToast(result.error || 'Verification blocked — action must be approved first');
        return;
      }
      showToast('Action verified');
      await load();
    } catch (err) {
      showToast('Verification failed: ' + (err.message || 'error'));
    }
  }

  function actionButtons(action) {
    const id = esc(action.id);
    switch (action.status) {
      case 'OPEN':
        return '<button type="button" class="tsm-sch-v3-btn" data-act="advance" data-id="' + id + '" data-next="ACKNOWLEDGED">Acknowledge</button>';
      case 'ACKNOWLEDGED':
        return '<button type="button" class="tsm-sch-v3-btn" data-act="advance" data-id="' + id + '" data-next="IN_PROGRESS">Start Work</button>';
      case 'IN_PROGRESS':
        return '<button type="button" class="tsm-sch-v3-btn" data-act="advance" data-id="' + id + '" data-next="RESOLVED">Mark Resolved</button>';
      case 'RESOLVED':
        return (
          '<button type="button" class="tsm-sch-v3-btn" data-act="approve" data-id="' + id + '">Approve</button>' +
          '<button type="button" class="tsm-sch-v3-btn tsm-sch-v3-btn-reject" data-act="reject" data-id="' + id + '">Reject</button>' +
          '<button type="button" class="tsm-sch-v3-btn tsm-sch-v3-btn-verify" data-act="verify" data-id="' + id + '">Verify</button>'
        );
      case 'VERIFIED':
        return '<span class="tsm-sch-v3-verified-badge">✓ Verified</span>';
      default:
        return '';
    }
  }

  function wireActionButtons(root) {
    if (root._tsmSchV3Wired) return;
    root._tsmSchV3Wired = true;
    root.addEventListener('click', function (evt) {
      const btn = evt.target.closest('[data-act]');
      if (!btn || !root.contains(btn)) return;
      const act = btn.getAttribute('data-act');
      const id = btn.getAttribute('data-id');
      if (!id) return;
      if (act === 'advance') advanceAction(id, btn.getAttribute('data-next'));
      else if (act === 'approve') approveAction(id);
      else if (act === 'reject') rejectAction(id);
      else if (act === 'verify') verifyAction(id);
    });
  }

  function esc(v) {
    return String(v == null ? '' : v)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function money(v) {
    return '$' + Number(v || 0).toLocaleString();
  }

  // Structured-fields-only mapping from a raw Schools node report into a
  // decision-engine finding. Deliberately ignores report.analysisText (LLM
  // free text) -- only fields that were already structured when captured
  // by POST /api/schools/node-report feed the deterministic engine.
  // Unlike Mortgage, there is no exposure/breachCount field on a Schools
  // node report today, so exposure stays 0 here rather than being invented.
  function nodeReportToFinding(report) {
    const ids = Array.isArray(report.grantIds) ? report.grantIds : [];
    return {
      id: ids[0] || report.nodeId,
      claim: report.nodeLabel || report.nodeId,
      rationale: 'Node report severity ' + (report.severity || 'INFO') + '.',
      severity: report.severity || 'medium',
      exposure: report.exposure || 0,
      sources: [report.nodeId]
    };
  }

  async function buildPayload() {
    const relay = loadRelay() || {};

    let findings = [];
    try {
      const res = await fetch(NODE_REPORTS_API);
      const reportData = await res.json();
      if (reportData && Array.isArray(reportData.reports)) {
        findings = reportData.reports.map(nodeReportToFinding);
      }
    } catch (err) {
      console.warn('[TSM Schools V3] node-reports fetch failed', err);
    }

    return {
      ...relay,
      findings,
      decisions: Array.isArray(relay.decisions) ? relay.decisions : []
    };
  }

  async function load() {
    const payload = await buildPayload();
    const data = await postJson(API, payload);
    window.TSM_SCHOOLS_INTELLIGENCE_V3 = data;
    render(data);
  }

  function render(data) {
    const root = document.getElementById('tsm-sch-intelligence-v3');
    if (!root) return;
    wireActionButtons(root);

    const p = data.portfolio || {};
    const actions = data.actions || [];

    root.innerHTML = `
      <section class="tsm-sch-v3-shell">
        <div class="tsm-sch-v3-header">
          <div>
            <div class="tsm-sch-v3-title">SCHOOLS INTELLIGENCE V3 · ACTION CENTER</div>
            <div class="tsm-sch-v3-subtitle">Decide → Execute → Verify → Explain</div>
          </div>
        </div>
        <div class="tsm-sch-v3-metrics">
          <div class="tsm-sch-v3-metric">
            <div class="tsm-sch-v3-metric-label">Modeled Exposure</div>
            <div class="tsm-sch-v3-metric-value">${money(p.modeledExposure)}</div>
          </div>
          <div class="tsm-sch-v3-metric">
            <div class="tsm-sch-v3-metric-label">Critical Open</div>
            <div class="tsm-sch-v3-metric-value">${esc(p.criticalOpen || 0)}</div>
          </div>
          <div class="tsm-sch-v3-metric">
            <div class="tsm-sch-v3-metric-label">High Open</div>
            <div class="tsm-sch-v3-metric-value">${esc(p.highOpen || 0)}</div>
          </div>
          <div class="tsm-sch-v3-metric">
            <div class="tsm-sch-v3-metric-label">Verified Reduction</div>
            <div class="tsm-sch-v3-metric-value">${money(p.verifiedExposureReduction)}</div>
          </div>
        </div>
        <div class="tsm-sch-v3-actions">
          ${
            actions.length
              ? actions.map(action => `
                <div class="tsm-sch-v3-action" data-action-id="${esc(action.id)}">
                  <div class="tsm-sch-v3-priority">${esc(action.priority)}</div>
                  <div>
                    <div class="tsm-sch-v3-finding">${esc(action.finding)}</div>
                    <div class="tsm-sch-v3-entity">${esc(action.entityId)} · ${esc(action.owner)}</div>
                  </div>
                  <div class="tsm-sch-v3-status">${esc(action.status)}</div>
                  <div>${money(action.exposure)}</div>
                  <div class="tsm-sch-v3-actions-cell">${actionButtons(action)}</div>
                </div>
              `).join('')
              : '<div class="tsm-sch-v3-empty">No open decisions. Ingest node reports from the Schools War Room to populate this queue.</div>'
          }
        </div>
      </section>
    `;
  }

  function init() {
    load().catch(err => console.warn('[TSM Schools V3]', err.message));
    window.addEventListener('TSM_RELAY_EVENT', e => {
      if (e.detail && e.detail.domain === DOMAIN) {
        load().catch(err => console.warn('[TSM Schools V3]', err.message));
      }
    });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>
