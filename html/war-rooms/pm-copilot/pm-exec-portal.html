<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#080b10;--bg2:#0a0f16;--bg3:#0d1119;
  --accent:#1ee8b6;--accent2:#14b892;--green:#22c55e;
  --red:#ef4444;--amber:#eab308;--muted:#4a7a9b;--text:#e8f0f8;--border:rgba(30,232,182,.12);
}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);color:var(--text);font-family:'Rajdhani',sans-serif;min-height:100vh;padding-bottom:60px;}
.topbar{height:42px;background:#05070c;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 20px;}
.tb-brand{font-family:'Orbitron',sans-serif;font-size:.7rem;color:var(--accent);letter-spacing:.15em;}
.tb-time{font-family:'Orbitron',sans-serif;font-size:.75rem;color:var(--accent);}
.hdr{padding:18px 24px;border-bottom:1px solid var(--border);background:var(--bg2);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;}
.hdr-title{font-family:'Orbitron',sans-serif;font-size:1rem;letter-spacing:.08em;}
.hdr-sub{font-family:'JetBrains Mono',monospace;font-size:.65rem;color:var(--muted);margin-top:4px;}
.hdr-btns{display:flex;gap:8px;flex-wrap:wrap;}
.hbtn{background:var(--bg3);border:1px solid var(--border);color:var(--text);font-family:'JetBrains Mono',monospace;font-size:.62rem;padding:8px 14px;border-radius:4px;cursor:pointer;text-decoration:none;display:inline-block;}
.hbtn:hover{border-color:var(--accent);color:var(--accent);}
.hbtn.primary{border-color:var(--accent);color:var(--accent);}
.wrap{max-width:1200px;margin:0 auto;padding:20px 24px;}
.empty{text-align:center;padding:80px 20px;}
.empty h2{font-family:'Orbitron',sans-serif;font-size:.9rem;color:var(--muted);letter-spacing:.08em;margin-bottom:14px;}
.empty p{font-family:'JetBrains Mono',monospace;font-size:.7rem;color:var(--muted);margin-bottom:24px;}
.kpi-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:20px;}
.kpi{background:var(--bg2);border:1px solid var(--border);border-radius:6px;padding:16px;text-align:center;}
.kpi-val{font-family:'Orbitron',sans-serif;font-size:1.3rem;font-weight:700;color:var(--accent);}
.kpi-val.red{color:var(--red);}.kpi-val.green{color:var(--green);}.kpi-val.amber{color:var(--amber);}
.kpi-val.gold{color:#d4af37;}
.kpi-lbl{font-size:.6rem;color:var(--muted);margin-top:6px;font-family:'JetBrains Mono',monospace;letter-spacing:.08em;}
.sec{background:var(--bg2);border:1px solid var(--border);border-radius:6px;padding:18px;margin-bottom:16px;}
.sec-hdr{font-family:'Orbitron',sans-serif;font-size:.68rem;color:var(--accent);letter-spacing:.12em;margin-bottom:14px;display:flex;align-items:center;justify-content:space-between;gap:8px;}
.sec-hdr .lbl::before{content:'\25C6';font-size:.55rem;margin-right:8px;}
.sec-hdr-note{font-family:'JetBrains Mono',monospace;font-size:.58rem;color:var(--muted);text-transform:none;letter-spacing:0;}
.no-items{font-family:'JetBrains Mono',monospace;font-size:.7rem;color:var(--muted);}
.toast{position:fixed;bottom:20px;right:20px;background:var(--bg2);border:1px solid var(--accent);color:var(--accent);padding:10px 18px;border-radius:4px;font-family:'JetBrains Mono',monospace;font-size:.65rem;opacity:0;pointer-events:none;transition:.3s;z-index:50;}
.toast.show{opacity:1;transform:translateY(-4px);}
.impact-row{display:flex;gap:10px;flex-wrap:wrap;}
.impact-box{flex:1;min-width:150px;padding:12px;border-radius:6px;text-align:center;border:1px solid var(--border);background:var(--bg3);}
.impact-lbl{font-family:'JetBrains Mono',monospace;font-size:.56rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:5px;}
.impact-val{font-family:'Orbitron',sans-serif;font-size:1.05rem;font-weight:700;color:var(--red);}
.actions{display:flex;gap:10px;margin-top:4px;}
.abtn{flex:1;padding:12px;border-radius:6px;font-family:'Orbitron',sans-serif;font-size:.65rem;letter-spacing:.08em;font-weight:700;cursor:pointer;border:1px solid;background:transparent;}
.abtn.approve{color:var(--green);border-color:var(--green);}
.abtn.approve:hover{background:rgba(34,197,94,.1);}
.abtn.escalate{color:var(--red);border-color:var(--red);}
.abtn.escalate:hover{background:rgba(239,68,68,.1);}
.rate-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;}
.rate-card{background:var(--bg3);border:1px solid var(--border);border-radius:6px;padding:14px;text-align:center;}
.rate-val{font-family:'Orbitron',sans-serif;font-size:1.15rem;font-weight:700;}
.rate-val.gold{color:#d4af37;}.rate-val.green{color:var(--green);}.rate-val.red{color:var(--red);}.rate-val.muted{color:var(--muted);}
.rate-lbl{font-family:'JetBrains Mono',monospace;font-size:.55rem;color:var(--muted);margin-top:6px;letter-spacing:.05em;}
.ai-box table.md-table{border-collapse:collapse;width:100%;margin:8px 0;white-space:normal;}
.ai-box table.md-table th,.ai-box table.md-table td{border:1px solid var(--border);padding:4px 6px;text-align:left;vertical-align:top;}
.ai-box table.md-table th{color:var(--muted);text-transform:uppercase;font-size:.6rem;}

.risk-item{display:flex;gap:14px;align-items:flex-start;padding:12px 0;border-bottom:1px solid #0f1620;}
.risk-item:last-child{border-bottom:none;}
.risk-rank{font-family:'Orbitron',sans-serif;font-size:1.1rem;font-weight:900;color:var(--accent);width:28px;flex-shrink:0;}
.risk-body{flex:1;}
.risk-title{font-size:.85rem;color:var(--text);margin-bottom:4px;}
.risk-title b{color:var(--red);}
.risk-action{font-family:'JetBrains Mono',monospace;font-size:.65rem;color:var(--muted);}
.risk-amount{font-family:'Orbitron',sans-serif;font-size:1rem;font-weight:700;color:var(--red);white-space:nowrap;}

.funnel{display:flex;flex-direction:column;gap:6px;}
.funnel-row{display:grid;grid-template-columns:130px 1fr 90px 110px;gap:10px;align-items:center;font-size:.75rem;}
.funnel-row .fr-lbl{font-family:'JetBrains Mono',monospace;font-size:.62rem;color:var(--text);}
.funnel-bar-wrap{background:var(--bg3);border-radius:4px;height:22px;overflow:hidden;position:relative;}
.funnel-bar{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));display:flex;align-items:center;padding-left:8px;font-family:'JetBrains Mono',monospace;font-size:.6rem;color:#02120d;font-weight:700;white-space:nowrap;}
.funnel-bar.empty-bar{background:var(--bg3);}
.fr-hours{font-family:'JetBrains Mono',monospace;font-size:.62rem;color:var(--muted);text-align:right;}
.fr-exposure{font-family:'JetBrains Mono',monospace;font-size:.65rem;text-align:right;color:var(--red);font-weight:700;}
.funnel-hdr{display:grid;grid-template-columns:130px 1fr 90px 110px;gap:10px;font-family:'JetBrains Mono',monospace;font-size:.55rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px;}
.funnel-hdr .align-r{text-align:right;}
.explain-panel{background:var(--bg2);border:1px solid var(--border);border-left:2px solid var(--amber);border-radius:6px;padding:14px 18px;margin-bottom:16px;}
.explain-title{font-family:'Orbitron',sans-serif;font-size:.62rem;color:var(--amber);letter-spacing:.1em;margin-bottom:10px;}
.explain-row{padding:6px 0;border-top:1px solid var(--border);}
.explain-row:first-of-type{border-top:none;}
.explain-node{font-family:'Orbitron',sans-serif;font-size:.6rem;color:var(--accent);letter-spacing:.05em;margin-right:10px;}
.explain-score{font-family:'JetBrains Mono',monospace;font-size:.65rem;color:var(--text);}
.explain-text{font-family:'JetBrains Mono',monospace;font-size:.62rem;color:var(--muted);margin-top:3px;line-height:1.5;}
</style>

<script>
function tick(){document.getElementById('clock').textContent=new Date().toLocaleTimeString();}
setInterval(tick,1000);tick();

const DOMAIN = 'PM';
const RELAY_KEY_FALLBACK = 'TSM_' + DOMAIN + '_RELAY';

function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  clearTimeout(showToast._h);
  showToast._h=setTimeout(()=>t.classList.remove('show'),2500);
}

function loadRelay(){
  try {
    if(window.TSM && window.TSM.relay && window.TSM.relay.read){
      const d = window.TSM.relay.read(DOMAIN);
      if(d) return d;
    }
  } catch(e){}
  try {
    const raw = sessionStorage.getItem(RELAY_KEY_FALLBACK) || localStorage.getItem(RELAY_KEY_FALLBACK) || localStorage.getItem('TSM_PM_RELAY');
    return raw ? JSON.parse(raw) : null;
  } catch(e){ return null; }
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function fmtMoney(n){ return '$' + Math.round(n||0).toLocaleString('en-US'); }

function renderEngineOutput(text) {
  if(!text) return '';
  const clean = text.replace(/KPI_JSON:\s*\{[^}]*\}\n*/i, '').trim();
  const lines = clean.split('\n');
  const isTableSep = l => /^\s*\|?[\s:|-]+\|?\s*$/.test(l) && l.includes('-');
  const inlineFmt = s => escapeHtml(s).replace(/&lt;br\s*\/?&gt;/gi, '<br>').replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  const tables = [];
  const outLines = [];
  let i = 0;
  while (i < lines.length) {
    const line = lines[i];
    if (/^\s*\|.*\|\s*$/.test(line) && lines[i + 1] !== undefined && isTableSep(lines[i + 1])) {
      const headers = line.trim().replace(/^\||\|$/g, '').split('|').map(c => c.trim());
      let t = '<table class="md-table"><thead><tr>' + headers.map(c => `<th>${inlineFmt(c)}</th>`).join('') + '</tr></thead><tbody>';
      i += 2;
      while (i < lines.length && /^\s*\|.*\|\s*$/.test(lines[i])) {
        const cells = lines[i].trim().replace(/^\||\|$/g, '').split('|').map(c => c.trim());
        t += '<tr>' + cells.map(c => `<td>${inlineFmt(c)}</td>`).join('') + '</tr>';
        i++;
      }
      t += '</tbody></table>';
      outLines.push(`@@TABLE${tables.length}@@`);
      tables.push(t);
      continue;
    }
    outLines.push(line);
    i++;
  }
  let html = escapeHtml(outLines.join('\n'));
  html = html.replace(/&lt;br\s*\/?&gt;/gi, '<br>');
  html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  html = html.replace(/^▸\s*(.+)$/gm, '<div style="margin:4px 0">▸ $1</div>');
  html = html.replace(/^(\d+)\.\s+(.+)$/gm, '<div style="margin:4px 0 4px 8px"><strong>$1.</strong> $2</div>');
  html = html.replace(/\n{2,}/g, '<br><br>').replace(/\n/g, '<br>');
  tables.forEach((t, idx) => { html = html.replace(`@@TABLE${idx}@@`, t); });
  return html;
}

/* ---------- Regional PM Manager framing helpers ---------- */

function pmExecAction(sev){
  if(sev === 'HIGH') return 'Escalate to regional PM manager now \u2014 exposure compounding daily.';
  if(sev === 'MEDIUM') return 'Confirm remediation ETA with property manager; escalate if unresolved this week.';
  return 'Monitor \u2014 low board-level exposure at current pace.';
}

// Top Risk Register -- merges the three deterministic exposure item lists
// the PM engine already computes (vacancy / maintenance-delay / vendor-
// compliance) into a single board-ranked-by-$ list, same pattern as
// mortgage-executive-portal.html's renderRiskRegister() over
// closing_delay_exposure_items. Nothing invented here -- exposure, severity
// basis, and IDs all come straight off data.financials.
function renderRiskRegister(fin){
  if(!fin) return '';
  const items = [];
  (fin.vacancy_exposure_items || []).forEach(it => items.push({
    kind: 'Vacancy', id: it.unit_id, detail: `${it.property || ''} \u2014 ${it.days_vacant}d vacant`,
    severity: it.days_vacant > 30 ? 'HIGH' : 'MEDIUM', exposure: it.exposure
  }));
  (fin.maintenance_delay_exposure_items || []).forEach(it => items.push({
    kind: 'Maintenance Delay', id: it.id, detail: `${it.unit_id || ''} \u2014 ${it.stage} \u2014 ${it.days_over}d over SLA`,
    severity: it.days_over > 3 ? 'HIGH' : 'MEDIUM', exposure: it.exposure
  }));
  (fin.vendor_compliance_exposure_items || []).forEach(it => items.push({
    kind: 'Vendor Compliance', id: it.vendor_id, detail: `${it.name || ''} \u2014 ${it.trade || ''} \u2014 ${it.severity}`,
    severity: it.severity, exposure: it.exposure
  }));

  if(!items.length){
    return `<div class="sec"><div class="sec-hdr"><span class="lbl">TOP RISK REGISTER</span></div><div class="no-items">No $ exposure right now &mdash; nothing to escalate to the board.</div></div>`;
  }
  const top3 = items.slice().sort((a,b) => (b.exposure||0) - (a.exposure||0)).slice(0,3);
  const rows = top3.map((it, idx) => `
    <div class="risk-item">
      <div class="risk-rank">${idx+1}</div>
      <div class="risk-body">
        <div class="risk-title"><b>${escapeHtml(it.kind)}</b> &middot; ${escapeHtml(it.id||'')} &mdash; ${escapeHtml(it.detail)}</div>
        <div class="risk-action">${escapeHtml(pmExecAction(it.severity))}</div>
      </div>
      <div class="risk-amount">${fmtMoney(it.exposure)}</div>
    </div>`).join('');
  return `<div class="sec">
    <div class="sec-hdr"><span class="lbl">TOP RISK REGISTER</span><span class="sec-hdr-note">ranked by $ exposure</span></div>
    ${rows}
  </div>`;
}

// Portfolio Lifecycle Funnel -- mirrors mortgage-executive-portal.html's
// renderFunnel() over the loan pipeline: shows the work-order pipeline by
// stage with volume, avg time in stage, and $ exposure per stage (matched
// off maintenance_delay_exposure_items' .stage label, which pm-engine.js
// sets to the same stage.label used in work_order_wip).
function renderFunnel(wip, fin){
  if(!wip || !wip.length) return '';
  const expByStage = {};
  (fin && fin.maintenance_delay_exposure_items || []).forEach(it => {
    expByStage[it.stage] = (expByStage[it.stage] || 0) + it.exposure;
  });
  const maxCount = Math.max(1, ...wip.map(s => s.count));
  const rows = wip.map(s => {
    const pct = Math.round((s.count / maxCount) * 100);
    const exposure = expByStage[s.label] || 0;
    return `<div class="funnel-row">
      <div class="fr-lbl">${escapeHtml(s.label)}</div>
      <div class="funnel-bar-wrap"><div class="funnel-bar${s.count===0?' empty-bar':''}" style="width:${Math.max(pct,s.count?12:0)}%">${s.count} order${s.count===1?'':'s'}</div></div>
      <div class="fr-hours">${s.avg_hours_in_stage!==null ? s.avg_hours_in_stage+'h avg' : '&mdash;'}</div>
      <div class="fr-exposure">${exposure>0?fmtMoney(exposure):'&mdash;'}</div>
    </div>`;
  }).join('');
  return `<div class="sec">
    <div class="sec-hdr"><span class="lbl">WORK ORDER LIFECYCLE (PIPELINE VIEW)</span><span class="sec-hdr-note">Open &rarr; Assigned &rarr; In Progress &rarr; Verified/Cancelled</span></div>
    <div class="funnel-hdr"><span>Stage</span><span>Volume</span><span class="align-r">Avg Time</span><span class="align-r">$ Exposure</span></div>
    <div class="funnel">${rows}</div>
  </div>`;
}

// ===== TSM MEMORY: REGISTER CROSS-MODULE ANOMALIES =====
// Mirrors mortgage-executive-portal.html's registerMortgageAnomalies(): fires
// the top-ranked risk (same one shown at rank 1 in the Top Risk Register)
// plus a vendor-compliance rollup if there are open flags, into the shared
// TSM_OPERATIONAL_MEMORY_V3 store. Self-dedupes by anomalyCode so repeat
// renders (storage/relay events) don't pile up duplicates.
function registerPmAnomalies(fin){
  if (!window.TSMMemory || typeof window.TSMMemory.registerAnomaly !== 'function' || !fin) return;

  function alreadyOpen(code){
    try{
      const all = JSON.parse(localStorage.getItem('TSM_OPERATIONAL_MEMORY_V3') || '{}');
      const bucket = all.pm;
      return !!(bucket && Array.isArray(bucket.anomalies) &&
        bucket.anomalies.some(a => a.anomalyCode === code && a.status === 'open'));
    }catch(e){ return false; }
  }
  function fire(a){
    if (alreadyOpen(a.anomalyCode)) return;
    window.TSMMemory.registerAnomaly(a);
  }

  const maintItems = fin.maintenance_delay_exposure_items || [];
  if (maintItems.length){
    const top = maintItems[0];
    fire({
      entityType: 'pm-work-order', entityId: top.id,
      anomalyCode: 'PM_SLA_BREACH_' + top.id, severity: top.days_over > 3 ? 'HIGH' : 'MEDIUM',
      title: `${top.stage} \u2014 Work Order ${top.id} \u2014 ${top.days_over}d over SLA`,
      source: 'pm-executive-portal',
      meta: { exposure: top.exposure, currency: fin.currency, daysOver: top.days_over }
    });
  }

  const vendorItems = fin.vendor_compliance_exposure_items || [];
  if (vendorItems.length){
    fire({
      entityType: 'pm-portfolio', entityId: 'vendor-compliance-flags',
      anomalyCode: 'PM_VENDOR_COMPLIANCE_FLAGS', severity: 'HIGH',
      title: `${vendorItems.length} vendor compliance flag(s) \u2014 ${fmtMoney(fin.vendor_compliance_exposure_total)} exposure`,
      source: 'pm-executive-portal',
      meta: { count: vendorItems.length, total: fin.vendor_compliance_exposure_total }
    });
  }
}

// Real downstream write for executive actions -- loads the CURRENT relay
// payload and appends to it rather than replacing it (TSM.relay.write()
// overwrites the whole stored object for a domain), same pattern as
// mortgage-executive-portal.html's recordExecAction().
function recordExecAction(actionType, note){
  const data = loadRelay();
  if(!data){ showToast('No active relay to act on.'); return; }
  data.exec_actions = data.exec_actions || [];
  data.exec_actions.push({ type: actionType, note, ts: new Date().toISOString() });
  try {
    if(window.TSM && window.TSM.relay && window.TSM.relay.write){
      window.TSM.relay.write(DOMAIN, data, { caseId: data.id || RELAY_KEY_FALLBACK, stage: 'executive-action:' + actionType });
    } else {
      const json = JSON.stringify(data);
      sessionStorage.setItem(RELAY_KEY_FALLBACK, json);
      localStorage.setItem(RELAY_KEY_FALLBACK, json);
    }
  } catch(e){ console.warn('recordExecAction write failed:', e); }

  // Also record to the real server-side HITL decision log (server.js:
  // /api/exec-portal/pm/decide, same shared gate factory Mortgage/Governance/
  // Integration Hub use) so ACKNOWLEDGE/ESCALATE feed the Approval
  // Improvement Rate panel below and persist across sessions/reloads.
  // Verdict mapping: ACKNOWLEDGE = executive signs off on current portfolio
  // state ("approved"); ESCALATE = executive does not accept it as-is
  // ("rejected") -- same deliberate two-button-onto-approve/reject mapping
  // Mortgage uses, not a claim that an escalation was literally rejected.
  const verdict = actionType === 'acknowledged' ? 'approved' : 'rejected';
  fetch('/api/exec-portal/pm/decide', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ index: Date.now(), verdict, text: note, actor: 'Executive', tenantId: (typeof TSMActiveMember !== 'undefined' && TSMActiveMember) ? TSMActiveMember.getId() : null })
  }).then(r => r.json()).then(res => {
    if (res && res.ok && res.recorded) loadApprovalRate();
  }).catch(() => { /* offline/unreachable -- exec action still logged to relay above */ });
}

function renderApprovalRatePanelShell(){
  return `<div class="sec">
    <div class="sec-hdr"><span class="lbl">APPROVAL IMPROVEMENT RATE</span><span class="sec-hdr-note">from ACKNOWLEDGE / ESCALATE decision history</span></div>
    <div id="rateBody"><div class="no-items">Loading decision history&hellip;</div></div>
  </div>`;
}
function loadApprovalRate(){
  const body = document.getElementById('rateBody');
  if(!body) return;
  fetch('/api/exec-portal/pm/decisions')
    .then(r => r.json())
    .then(res => {
      if(!res || !res.ok) throw new Error('bad response');
      renderApprovalRateStats(res.stats, body);
    })
    .catch(() => { body.innerHTML = '<div class="no-items">Decision history unavailable this session.</div>'; });
}
function renderApprovalRateStats(stats, body){
  if(!stats || !stats.total){
    body.innerHTML = '<div class="no-items">No decisions recorded yet &mdash; ACKNOWLEDGE or ESCALATE above to start tracking trend.</div>';
    return;
  }
  let deltaVal = '&mdash;', deltaCls = 'muted';
  if(stats.improvementRate !== null && stats.improvementRate !== undefined){
    const dir = stats.improvementRate > 0 ? 'up' : (stats.improvementRate < 0 ? 'down' : 'flat');
    const arrow = dir === 'up' ? '&#9650;' : (dir === 'down' ? '&#9660;' : '&#9679;');
    const sign = stats.improvementRate > 0 ? '+' : '';
    deltaCls = dir === 'up' ? 'green' : (dir === 'down' ? 'red' : 'muted');
    deltaVal = `${arrow} ${sign}${stats.improvementRate}pp`;
  }
  body.innerHTML = `<div class="rate-grid">
    <div class="rate-card"><div class="rate-val gold">${stats.approvalRate}%</div><div class="rate-lbl">Acknowledge Rate (All-Time)</div></div>
    <div class="rate-card"><div class="rate-val ${deltaCls}">${deltaVal}</div><div class="rate-lbl">Trend vs Prior Period</div></div>
    <div class="rate-card"><div class="rate-val gold">${stats.total}</div><div class="rate-lbl">Total Decisions</div></div>
    <div class="rate-card"><div class="rate-val green">${stats.approved}</div><div class="rate-lbl">Acknowledged</div></div>
    <div class="rate-card"><div class="rate-val red">${stats.rejected}</div><div class="rate-lbl">Escalated</div></div>
  </div>`;
}

// Grounded in the actual buildRelayPayload() shape from pm-engine.js
// (data.kpis/financials) — mirrors honeywell-executive-portal.html's
// getExplainItems(): cites the exact field + engine method behind each KPI
// tile above, rather than a fabricated confidence score. The financial
// exposure section already carries its own sec-hdr-note, so this covers the
// top KPI row only.
//
// Roadmap #9 (Delivery Package) — extended additively: each item now also
// carries the shared {claim, severity, rationale, dataPoints, sources, id}
// fields alongside the original {label, value, explain}. No invented
// thresholds — severity reuses conventions already baked into this exact
// page: occupancy_rate reuses the same >=90/>=75 color thresholds the KPI
// tile itself renders with (red/<75 = high risk, amber/75-89 = medium, green
// = healthy and left unclassified); work_orders_over_sla and
// vendor_compliance_flags reuse "count > 0 = high", since this page already
// colors both tiles red unconditionally whenever the count is nonzero.
// portfolio_rent_value has no risk framing anywhere in this codebase, so it
// stays honestly unclassified rather than assigned a made-up severity.
function getExplainItems(data){
  const items = [];
  const k = data.kpis || {};

  if (k.occupancy_rate != null) {
    const rate = k.occupancy_rate;
    const explain = 'Read directly from kpis.occupancy_rate, computed by pm-engine.js\u2019s computeKpis() from the live units records \u2014 not recomputed on this page.';
    const sev = rate < 75 ? 'high' : (rate < 90 ? 'medium' : undefined);
    const item = {
      label: 'OCCUPANCY RATE',
      value: rate + '%',
      explain: explain,
      id: 'pm-occupancy-rate',
      claim: 'OCCUPANCY RATE: ' + rate + '%',
      rationale: explain,
      dataPoints: [{ key: 'kpis.occupancy_rate', value: rate }],
      sources: ['pm-engine.js computeKpis()']
    };
    if (sev) item.severity = sev;
    items.push(item);
  }
  if (k.portfolio_rent_value != null) {
    const explain = 'Read directly from kpis.portfolio_rent_value, summed by pm-engine.js from the live units/leases records.';
    items.push({
      label: 'PORTFOLIO RENT VALUE',
      value: fmtMoney(k.portfolio_rent_value),
      explain: explain,
      id: 'pm-portfolio-rent-value',
      claim: 'PORTFOLIO RENT VALUE: ' + fmtMoney(k.portfolio_rent_value),
      // No severity: no risk framing exists anywhere in this codebase for
      // portfolio rent value, so left honestly unclassified.
      rationale: explain,
      dataPoints: [{ key: 'kpis.portfolio_rent_value', value: k.portfolio_rent_value }],
      sources: ['pm-engine.js']
    });
  }
  if (k.work_orders_over_sla != null) {
    const explain = 'Count of work orders returned by pm-engine.js\u2019s getSlaBreaches(\u2018work_orders\u2019) \u2014 the underlying items are in the war room\u2019s Action Queue.';
    const item = {
      label: 'WORK ORDERS OVER SLA',
      value: String(k.work_orders_over_sla),
      explain: explain,
      id: 'pm-work-orders-over-sla',
      claim: 'WORK ORDERS OVER SLA: ' + k.work_orders_over_sla,
      rationale: explain,
      dataPoints: [{ key: 'kpis.work_orders_over_sla', value: k.work_orders_over_sla }],
      sources: ['pm-engine.js getSlaBreaches()']
    };
    if (k.work_orders_over_sla > 0) item.severity = 'high';
    items.push(item);
  }
  if (k.vendor_compliance_flags != null) {
    const explain = 'Count of vendors in \u2018expiring_soon\u2019/\u2018expired\u2019 stages from the live vendors records, computed by pm-engine.js\u2019s computeKpis().';
    const item = {
      label: 'VENDOR COMPLIANCE FLAGS',
      value: String(k.vendor_compliance_flags),
      explain: explain,
      id: 'pm-vendor-compliance-flags',
      claim: 'VENDOR COMPLIANCE FLAGS: ' + k.vendor_compliance_flags,
      rationale: explain,
      dataPoints: [{ key: 'kpis.vendor_compliance_flags', value: k.vendor_compliance_flags }],
      sources: ['pm-engine.js computeKpis()']
    };
    if (k.vendor_compliance_flags > 0) item.severity = 'high';
    items.push(item);
  }

  return items;
}

function renderExplainItems(items){
  if (!items.length) return '';
  return `<div class="explain-panel">
    <div class="explain-title">WHY THESE NUMBERS</div>
    ${items.map(it => `<div class="explain-row">
      <span class="explain-node">${escapeHtml(it.label)}</span>
      <span class="explain-score">${escapeHtml(it.value)}</span>
      <div class="explain-text">${escapeHtml(it.explain)}</div>
    </div>`).join('')}
  </div>`;
}

// ===== EXCEPTION / CASE QUEUE FEED — Roadmap #10 Case Engine =====
// Same pattern as Mortgage/Schools/Legal/BPO/Healthcare/Construction/
// FinOps/Insurance: turn the three real exposure item lists already
// merged into the Top Risk Register above (vacancy / maintenance-delay /
// vendor-compliance) into TSMExceptions.add() records, then
// TSMCaseManager.createFromException() so each gets a real
// approval/execution/audit lifecycle. No fabricated fields -- everything
// here mirrors fin.vacancy_exposure_items / maintenance_delay_exposure_items
// / vendor_compliance_exposure_items, the same real relay data
// renderRiskRegister() already renders.
const _pmFedIds = {};
function pmFeedExceptions(fin){
  if (typeof TSMExceptions === 'undefined' || !fin) return;
  let fedAny = false;

  function feedOne(key, id, title, detail, severity, exposure, process){
    if (!id) return;
    const fedKey = key + ':' + id;
    if (_pmFedIds[fedKey]) return;
    _pmFedIds[fedKey] = true;
    fedAny = true;

    const exceptionRecord = TSMExceptions.add({
      title, detail,
      recommendedAction: 'See PM Copilot Executive Portal risk register.',
      severity, confidence: null, sector: 'pm', agentLabel: 'PM Strategist'
    });

    if (typeof TSMCaseManager !== 'undefined' && exceptionRecord) {
      const newCase = TSMCaseManager.createFromException(exceptionRecord, {
        process, source: 'PM Strategist', exposure
      });
      if (newCase) {
        TSMCaseManager.requestApproval(newCase.caseId, { note: 'Auto-requested on case creation from PM exception feed.' });
      }
    }
  }

  (fin.vacancy_exposure_items || []).forEach(it => {
    feedOne('vacancy', it.unit_id,
      `Vacancy \u2014 ${it.property || 'unit'} \u2014 ${it.unit_id} \u2014 ${it.days_vacant}d vacant`,
      `Vacancy exposure of ${fmtMoney(it.exposure)} at ${it.property || 'this unit'}.`,
      it.days_vacant > 30 ? 'high' : 'med', it.exposure, 'pm_vacancy_resolution');
  });

  (fin.maintenance_delay_exposure_items || []).forEach(it => {
    feedOne('maint', it.id,
      `Maintenance Delay \u2014 ${it.unit_id || ''} \u2014 ${it.stage} \u2014 ${it.days_over}d over SLA`,
      `Maintenance-delay exposure of ${fmtMoney(it.exposure)} at the ${it.stage} stage.`,
      it.days_over > 3 ? 'high' : 'med', it.exposure, 'pm_maintenance_delay_resolution');
  });

  (fin.vendor_compliance_exposure_items || []).forEach(it => {
    feedOne('vendor', it.vendor_id,
      `Vendor Compliance \u2014 ${it.name || it.vendor_id} \u2014 ${it.trade || ''} \u2014 ${it.severity}`,
      `Vendor compliance exposure of ${fmtMoney(it.exposure)} for ${it.name || it.vendor_id}.`,
      it.severity === 'HIGH' ? 'high' : 'med', it.exposure, 'pm_vendor_compliance_resolution');
  });

  if (!fedAny) return;
  if (typeof TSMExceptionWidget !== 'undefined') {
    TSMExceptionWidget.mount('tsm-exception-queue', { sector: 'pm' });
  }
  if (typeof TSMCaseWidget !== 'undefined') {
    TSMCaseWidget.mount('tsm-case-queue', { sector: 'pm' });
  }
}

    <div class="impact-row">

      <div class="impact-box"><div class="impact-lbl">Maintenance Delay</div><div class="impact-val">${fmtMoney(fin.maintenance_delay_exposure_total)}</div></div>
      <div class="impact-box"><div class="impact-lbl">Vendor Compliance</div><div class="impact-val">${fmtMoney(fin.vendor_compliance_exposure_total)}</div></div>
      <div class="impact-box" style="border-color:var(--accent)"><div class="impact-lbl">Total</div><div class="impact-val" style="color:var(--accent)">${fmtMoney(fin.total_exposure)}</div></div>
    </div>
  </div>`;

  if(data.ai_summary){
    html += `<div class="sec"><div class="sec-hdr"><span class="lbl">AI PORTFOLIO ANALYSIS</span></div><div style="white-space:pre-wrap;font-size:.85rem;line-height:1.5;">${escapeHtml(data.ai_summary)}</div></div>`;
  }

  html += `<div class="sec">
    <div class="sec-hdr"><span class="lbl">EXECUTIVE DECISION</span><span class="sec-hdr-note">signs off on or escalates the current portfolio snapshot above</span></div>
    <div class="actions">
      <button class="abtn approve" onclick="recordExecAction('acknowledged','Portfolio snapshot reviewed and signed off by executive'); showToast('Acknowledged \\u2014 logged to relay and decision log.')">&#10003; ACKNOWLEDGE</button>
      <button class="abtn escalate" onclick="recordExecAction('escalated','Escalation flagged \\u2014 notify regional PM manager'); showToast('Escalated \\u2014 logged to relay and decision log.')">&#8593; ESCALATE</button>
    </div>
  </div>`;

  html += renderApprovalRatePanelShell();

  document.getElementById('wrap').innerHTML = html;
  loadApprovalRate();
  pmFeedExceptions(fin);
}

// Deferred to DOMContentLoaded (not called synchronously here) so that
// TSMExceptions/TSMCaseManager -- both loaded via <script src> tags
// earlier in the body -- are guaranteed available on the very first
// render(), not just on a later storage/TSM_RELAY_EVENT re-render. Same
// pattern used by Mortgage/Schools/Legal Executive Portals.
function initRender(){
  render();
  window.addEventListener('storage', e => { if(e.key === RELAY_KEY_FALLBACK || e.key === 'TSM_PM_RELAY' || e.key === 'TSM_EVENT_LOG') render(); });
  window.addEventListener('TSM_RELAY_EVENT', e => { if(e.detail && e.detail.domain === DOMAIN) render(); });
}
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', initRender);
} else {
  initRender();
}

// Roadmap #9 -- pure assembly layer, same convention as TSMDeliveryPackage
// itself: nothing computed here, just reuses lastExplainItems already
// produced by render() above and hands it to the engine.
window.exportClientPackage = function () {
  if (!window.TSMDeliveryPackage) {
    showToast('Delivery package engine not loaded.');
    return;
  }
  const pkg = TSMDeliveryPackage.build({
    domain: 'PM Copilot',
    explainItems: lastExplainItems,
    sections: { kpis: lastKpis, financials: lastFinancials }
  });
  const blob = new Blob([JSON.stringify(pkg, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'tsm-client-package-' + Date.now() + '.json';
  a.click();
};

  }

  async function load() {

  window.addEventListener(

  window.addEventListener(

  );

})();
</script>

<script id="tsm-pm-intelligence-v3-script">
(function () {
  'use strict';

  const API = '/api/pm/intelligence-v3';

  async function postJson(url, body) {
    const response = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body || {})
    });
    const data = await response.json().catch(() => ({}));
    if (!response.ok) {
      const err = new Error(data.error || ('HTTP ' + response.status));
      err.data = data;
      throw err;
    }
    return data;
  }

  async function advanceAction(actionId, nextStatus) {
    try {
      await postJson('/api/pm/actions/' + encodeURIComponent(actionId) + '/transition', { nextStatus });
      showToast('Action advanced to ' + nextStatus);
      await load();
    } catch (err) {
      showToast('Transition failed: ' + (err.message || 'error'));
    }
  }

  async function approveAction(actionId) {
    try {
      await postJson('/api/pm/actions/' + encodeURIComponent(actionId) + '/approve', {});
      showToast('Action approved');
      await load();
    } catch (err) {
      showToast('Approval failed: ' + (err.message || 'error'));
    }
  }

  async function rejectAction(actionId) {
    try {
      await postJson('/api/pm/actions/' + encodeURIComponent(actionId) + '/reject', {});
      showToast('Action rejected');
      await load();
    } catch (err) {
      showToast('Rejection failed: ' + (err.message || 'error'));
    }
  }

  async function verifyAction(actionId) {
    const exposureAfterRaw = window.prompt('Exposure after remediation ($, 0 if fully cleared):', '0');
    if (exposureAfterRaw === null) return;
    const exposureAfter = Number(exposureAfterRaw);
    if (!Number.isFinite(exposureAfter) || exposureAfter < 0) {
      showToast('Verification cancelled: exposure must be a non-negative number');
      return;
    }
    const notes = window.prompt('Verification notes (optional):', '') || '';

    try {
      const result = await postJson('/api/pm/actions/verify', {
        actionId,
        verification: { verified: true, exposureAfter, notes }
      });
      if (!result.ok) {
        showToast(result.error || 'Verification blocked — action must be approved first');
        return;
      }
      showToast('Action verified');
      await load();
    } catch (err) {
      showToast('Verification failed: ' + (err.message || 'error'));
    }
  }

  function actionButtons(action) {
    const id = esc(action.id);
    switch (action.status) {
      case 'OPEN':
        return '<button type="button" class="tsm-pm-v3-btn" data-act="advance" data-id="' + id + '" data-next="ACKNOWLEDGED">Acknowledge</button>';
      case 'ACKNOWLEDGED':
        return '<button type="button" class="tsm-pm-v3-btn" data-act="advance" data-id="' + id + '" data-next="IN_PROGRESS">Start Work</button>';
      case 'IN_PROGRESS':
        return '<button type="button" class="tsm-pm-v3-btn" data-act="advance" data-id="' + id + '" data-next="RESOLVED">Mark Resolved</button>';
      case 'RESOLVED':
        return (
          '<button type="button" class="tsm-pm-v3-btn" data-act="approve" data-id="' + id + '">Approve</button>' +
          '<button type="button" class="tsm-pm-v3-btn tsm-pm-v3-btn-reject" data-act="reject" data-id="' + id + '">Reject</button>' +
          '<button type="button" class="tsm-pm-v3-btn tsm-pm-v3-btn-verify" data-act="verify" data-id="' + id + '">Verify</button>'
        );
      case 'VERIFIED':
        return '<span class="tsm-pm-v3-verified-badge">✓ Verified</span>';
      default:
        return '';
    }
  }

  function wireActionButtons(root) {
    if (root._tsmPmV3Wired) return;
    root._tsmPmV3Wired = true;
    root.addEventListener('click', function (evt) {
      const btn = evt.target.closest('[data-act]');
      if (!btn || !root.contains(btn)) return;
      const act = btn.getAttribute('data-act');
      const id = btn.getAttribute('data-id');
      if (!id) return;
      if (act === 'advance') advanceAction(id, btn.getAttribute('data-next'));
      else if (act === 'approve') approveAction(id);
      else if (act === 'reject') rejectAction(id);
      else if (act === 'verify') verifyAction(id);
    });
  }

  function esc(v) {
    return String(v == null ? '' : v)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function money(v) {
    return '$' + Number(v || 0).toLocaleString();
  }

  function readRelay() {
    try {
      const raw =
        sessionStorage.getItem('TSM_PM_RELAY') ||
        localStorage.getItem('TSM_PM_RELAY');

      return raw ? JSON.parse(raw) : {};
    } catch (err) {
      console.warn('[TSM PM V3] relay parse failed', err);
      return {};
    }
  }

  async function load() {
    const relay = readRelay();

    const decisionState = window.TSM_PM_DECISIONS || {};
    const intelligence =
      window.TSM_PM_INTELLIGENCE_V2 ||
      {};

    const payload = {
      ...relay,
      ...intelligence,
      decisions:
        intelligence.decisions ||
        decisionState.decisions ||
        []
    };

    const response = await fetch(API, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json'
      },
      body: JSON.stringify(payload)
    });

    if (!response.ok) {
      throw new Error('PM Intelligence V3 HTTP ' + response.status);
    }

    const data = await response.json();
    window.TSM_PM_INTELLIGENCE_V3 = data;

    render(data);
  }

  function render(data) {
    const root = document.getElementById('tsm-pm-intelligence-v3');
    if (!root) return;
    wireActionButtons(root);

    const p = data.portfolio || {};
    const a = data.actionSummary || {};
    const actions = data.actions || [];

    root.innerHTML = `
      <section class="tsm-pm-v3-shell">
        <div class="tsm-pm-v3-header">
          <div>
            <div class="tsm-pm-v3-title">
              PM INTELLIGENCE V3 · ACTION CENTER
            </div>
            <div class="tsm-pm-v3-subtitle">
              Decide → Execute → Verify → Explain
            </div>
          </div>
        </div>

        <div class="tsm-pm-v3-metrics">
          <div class="tsm-pm-v3-metric">
            <div class="tsm-pm-v3-metric-label">Modeled Exposure</div>
            <div class="tsm-pm-v3-metric-value">
              ${money(p.modeledExposure)}
            </div>
          </div>

          <div class="tsm-pm-v3-metric">
            <div class="tsm-pm-v3-metric-label">Exposure At Risk</div>
            <div class="tsm-pm-v3-metric-value">
              ${money(a.exposureAtRisk)}
            </div>
          </div>

          <div class="tsm-pm-v3-metric">
            <div class="tsm-pm-v3-metric-label">Critical Open</div>
            <div class="tsm-pm-v3-metric-value">
              ${esc(p.criticalOpen || 0)}
            </div>
          </div>

          <div class="tsm-pm-v3-metric">
            <div class="tsm-pm-v3-metric-label">Verified Reduction</div>
            <div class="tsm-pm-v3-metric-value">
              ${money(a.verifiedExposureReduction)}
            </div>
          </div>
        </div>

        <div class="tsm-pm-v3-actions">
          ${
            actions.length
              ? actions.map(action => `
                <div class="tsm-pm-v3-action"
                     data-action-id="${esc(action.id)}">
                  <div class="tsm-pm-v3-priority">
                    ${esc(action.priority)}
                  </div>

                  <div>
                    <div class="tsm-pm-v3-finding">
                      ${esc(action.finding)}
                    </div>
                    <div class="tsm-pm-v3-entity">
                      ${esc(action.entityId)} · ${esc(action.owner)}
                    </div>
                  </div>

                  <div class="tsm-pm-v3-status">
                    ${esc(action.status)}
                  </div>

                  <div>
                    ${money(action.exposure)}
                  </div>

                  <div class="tsm-pm-v3-actions-cell">
                    ${actionButtons(action)}
                  </div>
                </div>
              `).join('')
              : '<div>No active PM actions.</div>'
          }
        </div>

        <div class="tsm-pm-v3-loop">
          Deterministic intelligence · Human approval required ·
          No source-system write-back · Verification required for closure
        </div>
      </section>
    `;
  }

  window.TSM_PM_INTELLIGENCE_V3_LOAD = load;

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', load);
  } else {
    load();
  }
})();
</script>
