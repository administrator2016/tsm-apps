<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Insurance Command Executive Portal</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --bg: #0b0f14; --panel: #121821; --border: #223042; --text: #e6edf3;
    --muted: #8ea0b5; --accent: #4da3ff; --high: #ff5d5d; --med: #ffb547; --low: #4caf6f;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: -apple-system, Segoe UI, Roboto, sans-serif; }
  header { padding: 20px 28px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
  header h1 { font-size: 18px; margin: 0; }
  header .sub { color: var(--muted); font-size: 12px; margin-top: 4px; }
  main { padding: 24px 28px; max-width: 1200px; margin: 0 auto; }
  .summary-bar { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 14px; margin-bottom: 24px; }
  .summary-tile { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; }
  .summary-tile .val { font-size: 22px; font-weight: 700; }
  .summary-tile .lbl { color: var(--muted); font-size: 12px; margin-top: 4px; }
  .domain-section { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; margin-bottom: 16px; padding: 16px 18px; }
  .domain-section h3 { margin: 0 0 4px 0; font-size: 14px; }
  .domain-section .stale { color: var(--med); font-size: 11px; margin-bottom: 10px; }
  .domain-metrics { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }
  .domain-metrics .metric-val { font-weight: 700; }
  .domain-metrics .metric-lbl { color: var(--muted); font-size: 11px; }
  .ai-note { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--border); color: var(--muted); font-size: 12px; white-space: pre-wrap; }
  .empty-state { text-align: center; padding: 60px 20px; color: var(--muted); }
  .no-data { color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
<header>
  <div>
    <h1>Insurance Command Executive Portal</h1>
    <div class="sub">Combined view across Claims, P&amp;C, Compliance &amp; Licensing — read-only</div>
  </div>
  <div class="sub" id="clock"></div>
</header>
<main>
  <div class="summary-bar" id="summaryBar"></div>
  <div id="domainSections"></div>
</main>

<script src="/html/war-rooms/_relay_control_plane/relay.core.js"></script>
<script>
(function () {
  // Reads all 4 domain relay keys directly rather than depending on an
  // intermediate combined-write step (unlike College's TSM_COLLEGE_EXEC_RELAY,
  // which college-strategist.html builds) — each Insurance Command page
  // relays independently and this portal aggregates on read.
  const DOMAINS = [
    { domain: 'INSURANCE_CLAIMS',     label: 'Claims & Appeals' },
    { domain: 'INSURANCE_PC',         label: 'Property & Casualty' },
    { domain: 'INSURANCE_COMPLIANCE', label: 'Compliance & Legal' },
    { domain: 'INSURANCE_LICENSING',  label: 'Licensing & CE' }
  ];
  const STALE_MS = 24 * 60 * 60 * 1000;

  function tick() { document.getElementById('clock').textContent = new Date().toLocaleTimeString(); }
  setInterval(tick, 1000); tick();

  function escapeHtml(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  function readDomain(domain) {
    try {
      if (window.TSM && window.TSM.relay && window.TSM.relay.read) {
        const v = window.TSM.relay.read(domain);
        if (v) return v;
      }
    } catch (e) { /* fall through to direct key read below */ }
    const key = 'TSM_' + domain + '_RELAY';
    try {
      const raw = localStorage.getItem(key) || sessionStorage.getItem(key);
      return raw ? JSON.parse(raw) : null;
    } catch (e) { return null; }
  }

  function render() {
    const active = DOMAINS
      .map(d => ({ ...d, payload: readDomain(d.domain) }))
      .filter(d => d.payload);

    const summaryBar = document.getElementById('summaryBar');
    const sections = document.getElementById('domainSections');

    if (!active.length) {
      summaryBar.innerHTML = '';
      sections.innerHTML = '<div class="empty-state">No relay from any Insurance Command domain yet. Open a domain page (Claims, P&amp;C, Compliance, Licensing) and click its relay button.</div>';
      return;
    }

    const totalExposure = active.reduce((sum, d) => sum + ((d.payload.financials && d.payload.financials.total_exposure) || 0), 0);
    const mostRecent = active.reduce((latest, d) => Math.max(latest, d.payload.timestamp || 0), 0);

    summaryBar.innerHTML = `
      <div class="summary-tile"><div class="val">${active.length} / ${DOMAINS.length}</div><div class="lbl">Active Domains</div></div>
      <div class="summary-tile"><div class="val">$${Number(totalExposure).toLocaleString()}</div><div class="lbl">Combined Financial Exposure</div></div>
      <div class="summary-tile"><div class="val">${mostRecent ? new Date(mostRecent).toLocaleString() : '—'}</div><div class="lbl">Most Recent Relay</div></div>
    `;

    sections.innerHTML = active.map(d => {
      const p = d.payload || {};
      const kpis = p.kpis || {};
      const metrics = Object.entries(kpis).map(([k, v]) => {
        const isMoney = /amount|premium|exposure|revenue/.test(k);
        return { label: k.replace(/_/g, ' '), value: isMoney ? '$' + Number(v || 0).toLocaleString() : v };
      });
      if (p.financials && p.financials.total_exposure != null) {
        metrics.push({ label: 'total exposure', value: '$' + Number(p.financials.total_exposure).toLocaleString() });
      }
      const age = p.timestamp ? Date.now() - p.timestamp : null;
      const staleNote = age != null && age > STALE_MS
        ? `<div class="stale">Last relayed ${new Date(p.timestamp).toLocaleString()} — may be stale.</div>` : '';
      const aiNote = p.ai_summary ? `<div class="ai-note">${escapeHtml(p.ai_summary)}</div>` : '';
      return `
        <div class="domain-section">
          <h3>${escapeHtml(d.label)}</h3>
          ${staleNote}
          <div class="domain-metrics">
            ${metrics.map(m => `<div><div class="metric-val">${escapeHtml(m.value)}</div><div class="metric-lbl">${escapeHtml(m.label)}</div></div>`).join('')}
          </div>
          ${aiNote}
        </div>
      `;
    }).join('') + DOMAINS.filter(d => !active.find(a => a.domain === d.domain)).map(d => `
      <div class="domain-section">
        <h3>${escapeHtml(d.label)}</h3>
        <div class="no-data">No relay received yet.</div>
      </div>
    `).join('');
  }

  window.addEventListener('storage', e => {
    if (e.key && e.key.indexOf('_RELAY') !== -1) render();
  });
  window.addEventListener('TSM_RELAY_EVENT', render);
  render();
})();
</script>
</body>
</html>
