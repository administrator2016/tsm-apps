<html lang="en">
<head>
<meta charset="UTF-8">

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#050a0f;--bg2:#0a1020;--bg3:#0d1528;
  --cyan:#00d4d4;--amber:#f5a623;--green:#22c55e;
  --red:#ef4444;--purple:#a855f7;--blue:#3b82f6;
  --orange:#f97316;--gold:#c9a84c;--text:#e2e8f0;--muted:#64748b;--border:#1e293b;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);color:var(--text);font-family:'Rajdhani',sans-serif;min-height:100vh;padding-bottom:60px;}
.topbar{height:42px;background:#020810;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 20px;}
.tb-brand{font-family:'Orbitron',sans-serif;font-size:.7rem;color:var(--amber);letter-spacing:.15em;}
.tb-stat{font-family:'JetBrains Mono',monospace;font-size:.65rem;color:var(--muted);}
.tb-stat span{color:var(--green);}
.tb-time{font-family:'Orbitron',sans-serif;font-size:.75rem;color:var(--amber);}
.nav-tabs{display:flex;align-items:center;background:var(--bg2);border-bottom:1px solid var(--border);padding:0 20px;gap:2px;}
.nav-tab{padding:10px 18px;font-family:'Orbitron',sans-serif;font-size:.58rem;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;letter-spacing:.08em;transition:.2s;}
.nav-tab:hover{color:var(--text);}
.nav-tab.active{color:var(--amber);border-bottom-color:var(--amber);}
.hdr{padding:18px 24px;border-bottom:1px solid var(--border);background:var(--bg2);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;}
.hdr-title{font-family:'Orbitron',sans-serif;font-size:1rem;letter-spacing:.08em;color:var(--text);}
.hdr-sub{font-family:'JetBrains Mono',monospace;font-size:.65rem;color:var(--muted);margin-top:4px;}
.hdr-badge{padding:4px 12px;border-radius:3px;font-family:'Orbitron',sans-serif;font-size:.6rem;letter-spacing:.1em;border:1px solid var(--amber);color:var(--amber);background:rgba(245,166,35,.1);}
.hdr-btns{display:flex;gap:8px;flex-wrap:wrap;}
.hbtn{background:var(--bg3);border:1px solid var(--border);color:var(--text);font-family:'JetBrains Mono',monospace;font-size:.62rem;padding:8px 14px;border-radius:4px;cursor:pointer;text-decoration:none;display:inline-block;}
.hbtn:hover{border-color:var(--amber);color:var(--amber);}
.hbtn.primary{border-color:var(--amber);color:var(--amber);}
.wrap{max-width:1200px;margin:0 auto;padding:20px 24px;}
.empty{text-align:center;padding:80px 20px;}
.empty h2{font-family:'Orbitron',sans-serif;font-size:.9rem;color:var(--muted);letter-spacing:.08em;margin-bottom:14px;}
.empty p{font-family:'JetBrains Mono',monospace;font-size:.7rem;color:var(--muted);margin-bottom:24px;}
.kpi-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:20px;}
.kpi{background:var(--bg2);border:1px solid var(--border);border-radius:6px;padding:16px;text-align:center;}
.kpi-val{font-family:'Orbitron',sans-serif;font-size:1.3rem;font-weight:700;color:var(--amber);}
.kpi-val.red{color:var(--red);}.kpi-val.green{color:var(--green);}.kpi-val.cyan{color:var(--cyan);}.kpi-val.amber{color:var(--amber);}
.kpi-lbl{font-size:.6rem;color:var(--muted);margin-top:6px;font-family:'JetBrains Mono',monospace;letter-spacing:.08em;}
.doc-box{background:var(--bg2);border:1px solid var(--border);border-radius:6px;padding:16px 18px;margin-bottom:16px;}
.doc-box .sec-hdr{margin-bottom:10px;}
.doc-text{font-family:'JetBrains Mono',monospace;font-size:.68rem;color:var(--muted);white-space:pre-wrap;max-height:140px;overflow:auto;line-height:1.6;}
.sec{background:var(--bg2);border:1px solid var(--border);border-radius:6px;padding:18px;margin-bottom:16px;}
.sec-hdr{font-family:'Orbitron',sans-serif;font-size:.68rem;color:var(--amber);letter-spacing:.12em;margin-bottom:14px;display:flex;align-items:center;gap:8px;}
.sec-hdr::before{content:'\25C6';font-size:.55rem;}
.engines-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
.engine-card{background:var(--bg3);border:1px solid var(--border);border-radius:6px;overflow:hidden;}
.eng-card-header{padding:10px 14px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);}
.eng-card-num{font-family:'Orbitron',sans-serif;font-size:.6rem;color:var(--amber);}
.eng-card-title{font-family:'Orbitron',sans-serif;font-size:.62rem;color:var(--text);letter-spacing:.05em;}
.eng-card-body{padding:14px;font-family:'JetBrains Mono',monospace;font-size:.65rem;color:var(--text);line-height:1.7;white-space:pre-wrap;max-height:260px;overflow:auto;}
.eng-card-body table.md-table{border-collapse:collapse;width:100%;margin:8px 0;white-space:normal;}
.eng-card-body table.md-table th,.eng-card-body table.md-table td{border:1px solid var(--border);padding:4px 6px;text-align:left;vertical-align:top;}
.eng-card-body table.md-table th{color:var(--muted);text-transform:uppercase;font-size:.6rem;}
.no-items{font-family:'JetBrains Mono',monospace;font-size:.7rem;color:var(--muted);}
.explain-panel{background:var(--bg2);border:1px solid var(--border);border-left:2px solid var(--amber);border-radius:6px;padding:14px 18px;margin-bottom:16px;}
.explain-title{font-family:'Orbitron',sans-serif;font-size:.62rem;color:var(--amber);letter-spacing:.1em;margin-bottom:10px;}
.explain-row{padding:6px 0;border-top:1px solid var(--border);}
.explain-row:first-of-type{border-top:none;}
.explain-node{font-family:'Orbitron',sans-serif;font-size:.6rem;color:var(--cyan);letter-spacing:.05em;margin-right:10px;}
.explain-score{font-family:'JetBrains Mono',monospace;font-size:.65rem;color:var(--text);}
.explain-text{font-family:'JetBrains Mono',monospace;font-size:.62rem;color:var(--muted);margin-top:3px;line-height:1.5;}
.toast{position:fixed;bottom:20px;right:20px;background:var(--bg2);border:1px solid var(--amber);color:var(--amber);padding:10px 18px;border-radius:4px;font-family:'JetBrains Mono',monospace;font-size:.65rem;opacity:0;pointer-events:none;transition:.3s;z-index:50;}
.toast.show{opacity:1;transform:translateY(-4px);}
.toast.err{border-color:var(--red);color:var(--red);}
.action-bar{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px;}
.abtn{font-family:'Orbitron',sans-serif;font-size:.65rem;letter-spacing:.08em;padding:10px 18px;border-radius:4px;cursor:pointer;border:1px solid var(--border);background:var(--bg3);color:var(--text);}
.abtn.approve{border-color:var(--green);color:var(--green);}
.abtn.escalate{border-color:var(--red);color:var(--red);}
.abtn:hover{opacity:.85;}
@media(max-width:800px){.engines-grid{grid-template-columns:1fr;}}

<div class="nav-tabs">

    </div>

<script>
function tick(){document.getElementById('clock').textContent=new Date().toLocaleTimeString();}
setInterval(tick,1000);tick();

// Domain-specific relay keys (post-split) — plant/cyber/supplier each write
// their own key now instead of colliding on one TSM_HONEYWELL_RELAY.
const RELAY_KEYS = {
  plant:     'TSM_HONEYWELL_PLANT_RELAY',
  cyber:     'TSM_HONEYWELL_CYBER_RELAY',
  supplier:  'TSM_HONEYWELL_SUPPLIER_RELAY',
  bess:      'TSM_HONEYWELL_BESS_RELAY',
  detection: 'TSM_HONEYWELL_DETECTION_RELAY'
};
// Legacy key, kept as a fallback read only — nothing writes to it anymore
// post-split, but any old in-flight session data still sitting in a
// browser's storage from before the split can still be picked up once.
const LEGACY_RELAY_KEY = 'TSM_HONEYWELL_RELAY';

const SOURCE_META = {
  plant:    { label: 'PLANT — OPERATIONS INCIDENT',       icon: '⚡', war: '/html/plant-incident.html',                        color: 'var(--orange)' },
  cyber:    { label: 'CYBER — SECURITY INCIDENT',          icon: '🛡', war: '/html/cyber-incident.html',                        color: 'var(--red)' },
  supplier: { label: 'SUPPLIER SHUTDOWN — SUPPLY CHAIN',   icon: '📦', war: '/html/supplier-shutdown.html',                     color: 'var(--amber)' },
  bess:     { label: 'BESS/GIGAFACTORY — THERMAL EVENT',   icon: '🔋', war: '/html/war-rooms/bess-gigafactory-incident.html',   color: 'var(--red)' },
  detection:{ label: 'ADVANCED DETECTION — PRE-ALARM',     icon: '📡', war: '/html/war-rooms/advanced-detection-incident.html', color: 'var(--amber)' }
};

function showToast(msg, isErr){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.toggle('err', !!isErr); t.classList.add('show');
  clearTimeout(showToast._h);
  showToast._h=setTimeout(()=>t.classList.remove('show'),2500);
}

function loadRelay(){
  let latest = null;
  for (const key of Object.values(RELAY_KEYS)) {
    try {
      const raw = localStorage.getItem(key) || sessionStorage.getItem(key);
      if (!raw) continue;
      const parsed = JSON.parse(raw);
      if (!latest || (parsed.timestamp && (!latest.timestamp || parsed.timestamp > latest.timestamp))) {
        latest = parsed;
      }
    } catch(e) { /* skip malformed entry, keep checking other domains */ }
  }
  if (latest) return latest;
  // Nothing in any of the three split keys — fall back to the legacy
  // unscoped key in case there's pre-split data still sitting around.
  try {
    const raw = localStorage.getItem(LEGACY_RELAY_KEY) || sessionStorage.getItem(LEGACY_RELAY_KEY);
    return raw ? JSON.parse(raw) : null;
  } catch(e) { return null; }
}

function manualRefresh(){
  const data = loadRelay();
  if(!data){ showToast('No relay data found yet.', true); render(); return; }
  render();
  showToast('Pulled latest analysis from ' + (SOURCE_META[data.source] ? SOURCE_META[data.source].label : data.source));
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// Ported from plant-incident.html / supplier-shutdown.html / cyber-incident.html
// so relayed engine output renders the same way here as it did in the war room —
// previously this page only escapeHtml()'d the raw text, leaving **bold** markers
// and pipe-table syntax visible as literal characters instead of rendering.
function renderEngineOutput(text) {
  if(!text) return '';
  const clean = text.replace(/KPI_JSON:\s*\{[^}]*\}\n*/i, '').trim();
  const lines = clean.split('\n');
  const isTableSep = l => /^\s*\|?[\s:|-]+\|?\s*$/.test(l) && l.includes('-');
  const inlineFmt = s => escapeHtml(s).replace(/&lt;br\s*\/?&gt;/gi, '<br>').replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  const tables = [];
  const outLines = [];
  let i = 0;
  while (i < lines.length) {
    const line = lines[i];
    if (/^\s*\|.*\|\s*$/.test(line) && lines[i + 1] !== undefined && isTableSep(lines[i + 1])) {
      const headers = line.trim().replace(/^\||\|$/g, '').split('|').map(c => c.trim());
      let t = '<table class="md-table"><thead><tr>' + headers.map(c => `<th>${inlineFmt(c)}</th>`).join('') + '</tr></thead><tbody>';
      i += 2;
      while (i < lines.length && /^\s*\|.*\|\s*$/.test(lines[i])) {
        const cells = lines[i].trim().replace(/^\||\|$/g, '').split('|').map(c => c.trim());
        t += '<tr>' + cells.map(c => `<td>${inlineFmt(c)}</td>`).join('') + '</tr>';
        i++;
      }
      t += '</tbody></table>';
      outLines.push(`@@TABLE${tables.length}@@`);
      tables.push(t);
      continue;
    }
    outLines.push(line);
    i++;
  }
  let html = escapeHtml(outLines.join('\n'));
  html = html.replace(/&lt;br\s*\/?&gt;/gi, '<br>');
  html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  html = html.replace(/^▸\s*(.+)$/gm, '<div style="margin:4px 0">▸ $1</div>');
  html = html.replace(/^(\d+)\.\s+(.+)$/gm, '<div style="margin:4px 0 4px 8px"><strong>$1.</strong> $2</div>');
  html = html.replace(/\n{2,}/g, '<br><br>').replace(/\n/g, '<br>');
  tables.forEach((t, idx) => { html = html.replace(`@@TABLE${idx}@@`, t); });
  return html;
}

// The three producer war rooms (plant/cyber/supplier) store slightly
// different KPI shapes under sessionData.kpis. Pull the first sensible
// display value regardless of which incident type wrote it.
// Safety net: normalizes exposure figures that were saved to localStorage
// before this fix (e.g. from an earlier demo run) as well as any future
// model slip -- both the tile below and computeHoneywellBNCA() further down
// read k.totalExposureLow/High directly, so correcting the shape once here
// covers both.
function tsmNormalizeExposurePair(lo, hi){
  const bothPresent = lo != null && hi != null;
  if(bothPresent && lo > 0 && hi > 0 && lo < 1000 && hi < 1000){
    return [lo * 1e6, hi * 1e6];
  }
  return [lo, hi];
}
function kpiExposure(k){
  if(!k) return '—';
  if(k.totalExposureLow || k.totalExposureHigh){
    const [lo,hi]=tsmNormalizeExposurePair(k.totalExposureLow, k.totalExposureHigh);
    const fmt=n=>'$'+Number(n).toLocaleString();
    return (lo && hi && lo!==hi) ? `${fmt(lo)}–${fmt(hi)}` : fmt(hi||lo);
  }
  if(k.raw) return k.raw;
  return '—';
}

function kpiSecondary(k){
  if(!k) return '—';
  if(typeof k.bufferDays === 'number') return k.bufferDays + ' days';
  if(k.containmentEta) return k.containmentEta;
  if(k.downtimeEstimate) return k.downtimeEstimate;
  if(k.leadTimeEstimate) return k.leadTimeEstimate;
  if(k.raw) return k.raw;
  return '—';
}

function kpiTertiary(k){
  if(!k) return '—';
  if(typeof k.ordersAtRisk === 'number') return k.ordersAtRisk + ' orders';
  if(typeof k.riskScore === 'number') return k.riskScore + '/100';
  if(k.raw) return k.raw;
  return '—';
}

function secondaryLabel(source){
  if(source==='supplier') return 'BUFFER';
  if(source==='cyber') return 'CONTAINMENT ETA';
  return 'DOWNTIME';
}

function tertiaryLabel(source){
  if(source==='supplier') return 'ORDERS AT RISK';
  return 'RISK SCORE';
}

// BNCA exposure projection — deterministic, via TSMBNCAExposureEngine.
// baseExposure comes straight from kpis.exposure (conservative/low end when
// a range is reported, matching the engine's own doc convention), same
// number already shown in the FINANCIAL EXPOSURE tile above — nothing new
// invented. Severity reuses the same source->severity mapping this file
// already applies to anomaly registration below (cyber/plant/supplier),
// remapped to the engine's CRIT/HIGH/MED vocabulary. This payload carries
// no real confidence/deadline signal (see comment on getExplainItems), so
// confidence defaults to the engine's own neutral 70 and daysUntilDeadline
// to 0 — except supplier incidents, which do report a real buffer-days
// figure that doubles as the deadline signal.
function hwBncaSeverity(src){
  if(src === 'cyber') return 'CRIT';
  if(src === 'bess') return 'CRIT'; // thermal runaway — same top tier as cyber
  if(src === 'plant') return 'HIGH';
  return 'MED'; // includes supplier and detection (pre-alarm, not yet a confirmed event)
}
function computeHoneywellBNCA(data){
  if(!window.TSMBNCAExposureEngine) return null;
  const k = data.kpis || {};
  const exp = k.exposure || {};
  const [normLo, normHi] = tsmNormalizeExposurePair(exp.totalExposureLow, exp.totalExposureHigh);
  const baseExposure = Number(normLo || normHi);
  if(!Number.isFinite(baseExposure) || baseExposure <= 0){
    return { unavailable: true, reason: 'no structured exposure figure present in this relay payload' };
  }
  const src = data.source || 'unknown';
  const buffer = k.buffer || {};
  // Supplier's bufferDays remains the primary deadline signal where present.
  // Every other vertical can now also carry kpis.deadline.daysUntilDeadline,
  // parsed from the war room's own ranked action plan (Engine 05) — without
  // this, plant/cyber/bess/detection always defaulted to 0 and "IF IGNORED"
  // was mathematically forced to equal "CURRENT EXPOSURE" every time.
  const deadlineKpi = k.deadline || {};
  const daysUntilDeadline = (src === 'supplier' && typeof buffer.bufferDays === 'number')
    ? buffer.bufferDays
    : (typeof deadlineKpi.daysUntilDeadline === 'number' ? deadlineKpi.daysUntilDeadline : 0);
  return window.TSMBNCAExposureEngine.project({
    baseExposure: baseExposure,
    severity: hwBncaSeverity(src),
    confidence: 70, // no confidence signal in this payload — engine's own neutral default
    daysUntilDeadline: daysUntilDeadline
  });
}
function hwMoney(n){ return '$' + Math.round(Number(n) || 0).toLocaleString(); }
function renderHoneywellBNCA(bnca){
  if(!bnca) return '';
  if(bnca.unavailable){
    return `<div class="sec"><div class="sec-hdr">BNCA EXPOSURE PROJECTION</div><div class="no-items">${escapeHtml(bnca.reason || 'Exposure projection unavailable.')}</div></div>`;
  }
  return `<div class="sec"><div class="sec-hdr">BNCA EXPOSURE PROJECTION</div>
    <div class="kpi-row">
      <div class="kpi"><div class="kpi-val cyan">${hwMoney(bnca.currentExposure)}</div><div class="kpi-lbl">CURRENT EXPOSURE</div></div>
      <div class="kpi"><div class="kpi-val green">${hwMoney(bnca.ifActed.exposure)}</div><div class="kpi-lbl">IF ACTED</div></div>
      <div class="kpi"><div class="kpi-val red">${hwMoney(bnca.ifIgnored.exposure)}</div><div class="kpi-lbl">IF IGNORED</div></div>
    </div><div class="no-items" style="margin-top:8px">${escapeHtml(bnca.urgencyWindow || '')}</div></div>`;
}

// Grounded in the actual relay payload shape (data.kpis.*, data.outputs) — this
// payload carries no confidence/ML score field, unlike legal/construction's
// node-score model, so this cites which structured field each KPI came from
// and which war room wrote it, rather than fabricating a confidence number.
function getExplainItems(data){
  const items = [];
  const k = data.kpis || {};
  const src = data.source || 'unknown';
  const srcLabel = SOURCE_META[src] ? SOURCE_META[src].label : src.toUpperCase();

  const exposureVal = kpiExposure(k.exposure);
  if (exposureVal !== '—') {
    items.push({
      label: 'FINANCIAL EXPOSURE',
      value: exposureVal,
      explain: `Read directly from kpis.exposure in the ${srcLabel} relay payload${data.docType ? ' (source doc type: ' + data.docType + ')' : ''} — not recomputed on this page.`
    });
  }

  const secKpi = k.buffer || k.containment;
  const secVal = kpiSecondary(secKpi);
  if (secVal !== '—') {
    items.push({
      label: secondaryLabel(src),
      value: secVal,
      explain: `Read directly from kpis.${k.buffer ? 'buffer.bufferDays' : 'containment'} as written by the ${srcLabel} war room.`
    });
  }

  const terKpi = k.orders || k.risk;
  const terVal = kpiTertiary(terKpi);
  if (terVal !== '—') {
    items.push({
      label: tertiaryLabel(src),
      value: terVal,
      explain: `Read directly from kpis.${k.orders ? 'orders.ordersAtRisk' : 'risk.riskScore'} as written by the ${srcLabel} war room.`
    });
  }

  if (data.outputs && data.outputs.length) {
    items.push({
      label: '6-ENGINE ANALYSIS',
      value: data.outputs.length + ' engine output' + (data.outputs.length === 1 ? '' : 's'),
      explain: `The KPI figures above are the war room's own computation across its 6-engine pipeline — this page displays them, it does not independently re-score or re-weight them.`
    });
  }

  return items;
}

function renderExplainItems(items){
  if (!items.length) return '';
  return `<div class="explain-panel">
    <div class="explain-title">WHY THESE NUMBERS</div>
    ${items.map(it => `<div class="explain-row">
      <span class="explain-node">${escapeHtml(it.label)}</span>
      <span class="explain-score">${escapeHtml(it.value)}</span>
      <div class="explain-text">${escapeHtml(it.explain)}</div>
    </div>`).join('')}
  </div>`;
}

// ===== TSM MEMORY: REGISTER CROSS-MODULE ANOMALIES =====
// This page did NOT load tsm-memory-engine.js at all before this change --
// added the script include below (the 'honeywell' sector was already added
// to tsm-memory-engine.js when the executive portal was wired). Mirrors
// honeywell-executive-portal.html's registerHoneywellAnomalies() exactly,
// using the same anomaly codes, so a user who reviews at the strategist but
// never escalates to Executive still surfaces the anomaly in RCM OS -- and
// whichever page (war room / strategist / exec portal) runs first sets the
// anomaly, the rest are no-op dedupes. Fires from render() off the same
// data.kpis figures the KPI row just rendered.
function registerHoneywellAnomalies(data){
  if(!window.TSMMemory || typeof window.TSMMemory.registerAnomaly !== 'function' || !data) return;

  function alreadyOpen(code){
    try{
      const all = JSON.parse(localStorage.getItem('TSM_OPERATIONAL_MEMORY_V3') || '{}');
      const bucket = all.honeywell;
      return !!(bucket && Array.isArray(bucket.anomalies) &&
        bucket.anomalies.some(a => a.anomalyCode === code && a.status === 'open'));
    }catch(e){ return false; }
  }
  function fire(a){
    if(alreadyOpen(a.anomalyCode)) return;
    window.TSMMemory.registerAnomaly(a);
  }

  const src = data.source || 'unknown';
  const meta = SOURCE_META[src] || { label: src.toUpperCase() };
  const k = data.kpis || {};
  const codeSrc = src.toUpperCase();

  const exposureStr = kpiExposure(k.exposure);
  if(exposureStr !== '—'){
    const severity = (src === 'cyber' || src === 'bess') ? 'CRITICAL' : (src === 'plant' ? 'HIGH' : 'MEDIUM');
    fire({
      entityType: 'honeywell-incident', entityId: src,
      anomalyCode: 'HW_' + codeSrc + '_EXPOSURE', severity,
      title: `${meta.label} — ${exposureStr} exposure`,
      source: 'honeywell-strategist',
      meta: { exposure: k.exposure, incidentSource: src }
    });
  }

  const secKpi = k.buffer || k.containment;
  const secVal = kpiSecondary(secKpi);
  if(secVal !== '—'){
    fire({
      entityType: 'honeywell-incident', entityId: src,
      anomalyCode: 'HW_' + codeSrc + '_' + (k.buffer ? 'BUFFER' : 'CONTAINMENT'), severity: (src === 'cyber' || src === 'bess') ? 'HIGH' : 'MEDIUM',
      title: `${meta.label} — ${secondaryLabel(src)} at ${secVal}`,
      source: 'honeywell-strategist',
      meta: { value: secKpi, incidentSource: src }
    });
  }

  const terKpi = k.orders || k.risk;
  const terVal = kpiTertiary(terKpi);
  if(terVal !== '—' && src === 'supplier'){
    fire({
      entityType: 'honeywell-incident', entityId: src,
      anomalyCode: 'HW_' + codeSrc + '_ORDERS_AT_RISK', severity: 'MEDIUM',
      title: `${meta.label} — ${terVal} at risk`,
      source: 'honeywell-strategist',
      meta: { value: terKpi, incidentSource: src }
    });
  }
}

function renderEmpty(){
  document.getElementById('hdrBadge').style.display='none';
  document.getElementById('hdrSub').textContent='Awaiting relay from a war room…';
  document.getElementById('wrap').innerHTML = `
    <div class="empty">
      <h2>NO ANALYSIS RECEIVED</h2>
      <p>Run the 6-engine analysis in a war room, then escalate — it will appear here automatically.</p>
      <div class="hdr-btns" style="justify-content:center;">
        <a class="hbtn primary" href="/html/plant-incident.html">⚡ Plant</a>
        <a class="hbtn primary" href="/html/supplier-shutdown.html">📦 Supplier</a>
        <a class="hbtn primary" href="/html/cyber-incident.html">🛡 Cyber</a>
        <a class="hbtn primary" href="/html/war-rooms/bess-gigafactory-incident.html">🔋 BESS</a>
        <a class="hbtn primary" href="/html/war-rooms/advanced-detection-incident.html">📡 Detection</a>
      </div>
    </div>`;
}

function render(){
  const data = loadRelay();
  if(!data){ renderEmpty(); return; }

  const meta = SOURCE_META[data.source] || { label: (data.source||'UNKNOWN').toUpperCase(), icon:'◆', war:null, color:'var(--amber)' };
  const badge = document.getElementById('hdrBadge');
  badge.style.display='inline-block';
  badge.textContent = `${meta.icon} ${meta.label}`;
  badge.style.borderColor = meta.color;
  badge.style.color = meta.color;

  document.getElementById('hdrSub').textContent = data.timestamp
    ? `Relayed ${new Date(data.timestamp).toLocaleString()}${data.docType ? ' · doc type: ' + data.docType : ''}`
    : 'Relay received';

  const k = data.kpis || {};
  let html = `<div class="kpi-row">
    <div class="kpi"><div class="kpi-val red">${kpiExposure(k.exposure)}</div><div class="kpi-lbl">FINANCIAL EXPOSURE</div></div>
    <div class="kpi"><div class="kpi-val amber">${kpiSecondary(k.buffer || k.containment)}</div><div class="kpi-lbl">${secondaryLabel(data.source)}</div></div>
    <div class="kpi"><div class="kpi-val cyan">${kpiTertiary(k.orders || k.risk)}</div><div class="kpi-lbl">${tertiaryLabel(data.source)}</div></div>
  </div>`;

  html += renderExplainItems(getExplainItems(data));
  html += renderHoneywellBNCA(computeHoneywellBNCA(data));

  registerHoneywellAnomalies(data);

  if(data.docText){
    html += `<div class="doc-box"><div class="sec-hdr">SOURCE DOCUMENT</div><div class="doc-text">${escapeHtml(data.docText)}</div></div>`;
  }

  if(data.outputs && data.outputs.length){
    html += `<div class="sec"><div class="sec-hdr">6-ENGINE ANALYSIS</div><div class="engines-grid">`;
    html += data.outputs.map(o => `
      <div class="engine-card">
        <div class="eng-card-header">
          <span class="eng-card-num">ENGINE 0${o.engine}</span>
          <span class="eng-card-title">${escapeHtml(o.title||'')}</span>
        </div>
        <div class="eng-card-body">${renderEngineOutput(o.text||'')}</div>
      </div>`).join('');
    html += `</div></div>`;
  } else {
    html += `<div class="sec"><div class="sec-hdr">6-ENGINE ANALYSIS</div><div class="no-items">No engine outputs in this relay payload.</div></div>`;
  }

  html += `<div class="sec"><div class="sec-hdr">STRATEGIST ACTIONS</div>
    <div class="action-bar">
      <button class="abtn approve" onclick="escalateExec()">↑ ESCALATE TO EXECUTIVE</button>
      <button class="abtn" onclick="showToast('Marked reviewed by strategist.')">✓ ACKNOWLEDGE</button>
      ${meta.war ? `<button class="abtn escalate" onclick="window.location='${meta.war}'">← BACK TO WAR ROOM</button>` : ''}
    </div>
  </div>`;

  document.getElementById('wrap').innerHTML = html;
}

function escalateExec(){
  const data = loadRelay();
  if(!data){ showToast('No analysis to escalate.', true); return; }
  // Forward the BNCA exposure projection computed above (previously this
  // only ever rendered to this page's own DOM and was never relayed, so
  // the executive portal had no way to show it).
  const payload = JSON.stringify(Object.assign({}, data, { strategistReviewedAt: new Date().toISOString(), bnca_exposure: computeHoneywellBNCA(data) }));
  try{
    localStorage.setItem('TSM_HONEYWELL_EXEC_RELAY', payload);
    sessionStorage.setItem('TSM_HONEYWELL_EXEC_RELAY', payload);
  }catch(e){}

  // Phase 2: Mission Core creation
  try {
    if (window.TSMMissionModel && window.TSMMissionStore) {
      const hwSourceMeta = SOURCE_META[data.source] || null;
      const mission = window.TSMMissionModel.createMission({
        vertical: 'honeywell',
        tenantId: 'default',
        client: hwSourceMeta ? hwSourceMeta.label : (data.source || 'Honeywell Incident'),
        classification: {
          summary: data.summary || data.narrative || '',
          incidentSource: data.source || null,
          source: 'Honeywell Strategist'
        },
        workflow: {
          assignedTo: null,
          queue: null,
          priority: 'normal', // no exposure/risk/confidence signal identified in this payload yet
          sla: null
        },
        actor: 'honeywell-strategist'
      });
      window.TSMMissionStore.saveMission(mission);
    } else {
      console.warn('Mission Core not loaded — skipping mission creation, Honeywell relay write already succeeded.');
    }
  } catch (missionErr) {
    console.warn('Mission Core creation failed (non-fatal, Honeywell relay already written):', missionErr);
  }

  showToast('Escalated to Executive — opening…');
  setTimeout(()=>{ window.location.href = '/html/war-rooms/honeywell-executive-portal.html'; }, 600);
}

render();
window.addEventListener('storage', e => {
  if (Object.values(RELAY_KEYS).includes(e.key) || e.key === LEGACY_RELAY_KEY) render();
});
</script>
