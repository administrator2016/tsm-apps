name: Music Endpoints Integration Test

on:
  pull_request:
    paths:
      - 'server.js'
      - 'routes/music.js'
      - 'server/tsm-music-instrumentals-service.js'
      - 'html/war-rooms/music-war/**'
      - 'test-music-endpoints.js'
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run music endpoint tests
        run: node test-music-endpoints.js
