<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Game Night</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0F2B30;
    --bg-raised: #16383E;
    --amber: #F2A93B;
    --coral: #E8735A;
    --seafoam: #7FB8AC;
    --text: #F5EFE6;
    --text-dim: #A9C2BE;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100dvh;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  h1 {
    font-family: 'Fredoka', sans-serif;
    font-weight: 600;
    font-size: 2rem;
    margin: 0 0 8px;
    text-align: center;
  }

  p.subtitle {
    color: var(--text-dim);
    text-align: center;
    margin: 0 0 40px;
    font-size: 1rem;
  }

  .card {
    width: 100%;
    max-width: 360px;
    background: var(--bg-raised);
    border-radius: 20px;
    padding: 24px;
    margin-bottom: 16px;
  }

  label {
    display: block;
    font-size: 0.85rem;
    color: var(--text-dim);
    margin-bottom: 8px;
  }

  input {
    width: 100%;
    font-family: 'Fredoka', sans-serif;
    font-size: 1.5rem;
    letter-spacing: 0.1em;
    text-align: center;
    text-transform: uppercase;
    background: var(--bg);
    border: 2px solid transparent;
    border-radius: 12px;
    color: var(--text);
    padding: 14px;
    margin-bottom: 16px;
  }

  input:focus {
    outline: none;
    border-color: var(--amber);
  }

  input::placeholder {
    color: var(--text-dim);
    letter-spacing: normal;
    text-transform: none;
    font-family: -apple-system, sans-serif;
    font-size: 1rem;
  }

  button {
    width: 100%;
    font-family: 'Fredoka', sans-serif;
    font-weight: 600;
    font-size: 1.1rem;
    border: none;
    border-radius: 12px;
    padding: 16px;
    cursor: pointer;
    transition: transform 0.1s ease;
  }

  button:active {
    transform: scale(0.97);
  }

  .btn-join {
    background: var(--amber);
    color: #1A1006;
  }

  .btn-create {
    background: transparent;
    color: var(--seafoam);
    border: 2px solid var(--seafoam);
  }

  .error {
    color: var(--coral);
    font-size: 0.9rem;
    text-align: center;
    margin-top: 12px;
    min-height: 1.2em;
  }

  .divider {
    color: var(--text-dim);
    text-align: center;
    margin: 20px 0;
    font-size: 0.9rem;
  }
</style>
</head>
<body>

  <h1>Game Night</h1>
  <p class="subtitle">Pick a game, gather your group, play on your phones</p>

  <div class="card">
    <label for="room-code">Have a room code?</label>
    <input id="room-code" placeholder="e.g. FZQK" maxlength="4">
    <label for="display-name">Your name</label>
    <input id="display-name" placeholder="Your name" style="text-transform: none; letter-spacing: normal; font-family: -apple-system, sans-serif; font-size: 1rem;">
    <button class="btn-join" id="join-btn">Join game</button>
    <p class="error" id="join-error"></p>
  </div>

  <p class="divider">— or —</p>

  <div class="card">
    <button class="btn-create" id="create-btn">Start a new game</button>
  </div>

  <script type="module">
    import { supabase, saveSession, generateRoomCode } from './js/supabase-client.js';

    const joinBtn = document.getElementById('join-btn');
    const createBtn = document.getElementById('create-btn');
    const roomCodeInput = document.getElementById('room-code');
    const nameInput = document.getElementById('display-name');
    const joinError = document.getElementById('join-error');

    joinBtn.addEventListener('click', async () => {
      const roomCode = roomCodeInput.value.trim().toUpperCase();
      const displayName = nameInput.value.trim();
      joinError.textContent = '';

      if (!roomCode || !displayName) {
        joinError.textContent = 'Enter a room code and your name';
        return;
      }

      joinBtn.disabled = true;
      joinBtn.textContent = 'Joining...';

      const { data: game, error: gameError } = await supabase
        .from('games')
        .select('id, status')
        .eq('room_code', roomCode)
        .maybeSingle();

      if (gameError || !game) {
        joinError.textContent = "That room code doesn't exist";
        joinBtn.disabled = false;
        joinBtn.textContent = 'Join game';
        return;
      }

      const { data: player, error: playerError } = await supabase
        .from('players')
        .insert({ game_id: game.id, display_name: displayName, is_host: false })
        .select()
        .single();

      if (playerError) {
        joinError.textContent = 'Could not join — try again';
        console.error(playerError);
        joinBtn.disabled = false;
        joinBtn.textContent = 'Join game';
        return;
      }

      saveSession(game.id, player.id, false);
      window.location.href = `lobby.html?room=${roomCode}`;
    });

    createBtn.addEventListener('click', async () => {
      const displayName = nameInput.value.trim();
      if (!displayName) {
        joinError.textContent = 'Enter your name first';
        nameInput.focus();
        return;
      }

      createBtn.disabled = true;
      createBtn.textContent = 'Creating...';

      // Try a few times in case of a rare room_code collision (unique constraint).
      let game = null;
      for (let attempt = 0; attempt < 5 && !game; attempt++) {
        const roomCode = generateRoomCode();
        const { data, error } = await supabase
          .from('games')
          .insert({ room_code: roomCode, status: 'lobby' })
          .select()
          .single();

        if (data) game = data;
        else if (error && error.code !== '23505') { // 23505 = unique_violation, retry; anything else, bail
          console.error(error);
          break;
        }
      }

      if (!game) {
        joinError.textContent = 'Could not create a game — try again';
        createBtn.disabled = false;
        createBtn.textContent = 'Start a new game';
        return;
      }

      const { data: player, error: playerError } = await supabase
        .from('players')
        .insert({ game_id: game.id, display_name: displayName, is_host: true })
        .select()
        .single();

      if (playerError) {
        joinError.textContent = 'Could not create a game — try again';
        console.error(playerError);
        createBtn.disabled = false;
        createBtn.textContent = 'Start a new game';
        return;
      }

      saveSession(game.id, player.id, true);
      window.location.href = `lobby.html?room=${game.room_code}`;
    });
  </script>
</body>
</html>
